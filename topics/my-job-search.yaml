# Topic: Career & job search (the user's own).
# Assigned by rules, not by the classifier (HBI_REDESIGN_PLAN.md Phase 15):
# the local model can't tell whose career a note is about. Offered as
# `career`, it filed anyone's career here; renamed `my-job-search`, it filed
# notes that fit no other topic (a murder trial, a news brief). So this topic
# is left out of the classifier's prompt, and a note joins it only by a rule
# below or by hand (the note drawer). An HBI edit shadows this file.
name: my-job-search
label: Career & job search
description: >-
  The user's own career: their résumé, work history, job search, job
  applications and professional skills.
assign: rules
members:
  # The résumé import (11 notes, 2026-09-09).
  - source_context: resume
  # The AI Dev Board API spec the job search uses.
  - source_context: https://aidevboard.com/openapi.yaml
  # The daily job-search chat (`jobsearch-<date>` sessions).
  - source_context: chat_session
    content_contains: "[session: jobsearch-"
