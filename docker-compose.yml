services:
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7689:7687"    # Bolt (7689 to avoid conflict with agent-api on 7688)
      - "7476:7474"    # Browser UI (7476 to avoid conflict with agent-api on 7475)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brain-internal
    restart: unless-stopped

  # MCP Server with HTTP transport
  agent-brain:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"    # MCP HTTP endpoint (Use 3001 to avoid conflict if agent-api runs on 3000)
    env_file:
      - .env           # Load .env directly — avoids host shell env overriding API keys
    environment:
      # Wall-clock zone for everything the brain says about time. Without this
      # the container runs UTC, and in America/Detroit that means the brain
      # rolls over to tomorrow at 20:00 local — dating notes, news searches, and
      # chat answers to the wrong day for the last four hours of every day.
      # Storage stays UTC regardless; this affects display only (services/clock.rs).
      - TZ=${TZ:-America/Detroit}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - LLM_PROVIDER=ollama-cloud
      - OLLAMA_URL=https://ollama.com
      # host Ollama — still the EMBEDDINGS backend (bge-m3) even after generation
      # moves to llama.cpp. A single-model llama-server can't serve /api/embeddings,
      # so build_local_llm_config keeps embed() pinned here regardless of backend.
      - OLLAMA_LOCAL_URL=http://host.docker.internal:11434
      # Background/scheduled generation backend: `llamacpp` routes every
      # provider_hint:"ollama" step to the llama.cpp sidecar below (OpenAI-compatible
      # API); `ollama` (the historical default) keeps generation on host Ollama.
      # Embeddings are unaffected either way. See services/llm.rs build_local_llm_config.
      - LOCAL_LLM_BACKEND=llamacpp
      - LLAMACPP_URL=http://llamacpp:8080
      # Ledger/log label only — a single-model llama-server serves whatever GGUF it
      # was launched with (see the llamacpp service --alias) regardless of this name.
      - LLAMACPP_MODEL=gemma4-e4b
      # The model every background/scheduled job runs on. Swapped off
      # gemma4:latest 2026-09-01 on a clean benchmark (brain stopped, no model
      # resident, real video_learning payload):
      #
      #   granite4:latest  1.95GB  100% VRAM  summarize 5.1s   extract 3.4s
      #   gemma4:latest    8.94GB   32% VRAM  summarize 40.6s  extract 45.4s
      #
      # Residency is a cliff, not a curve: gemma4 is a 9.86GB model on an 8GB
      # card and generates at 25.9 tok/s where anything that fits does 67-125.
      # Output quality was indistinguishable on both tasks. granite4 is already
      # in models.yaml (selection_rank 120, 131k context), so capability-routed
      # steps are unaffected and `vision` still resolves to gemma4.
      #
      # Do NOT assume models co-reside — this card holds one generation model
      # plus bge-m3. A swap is a replacement.
      #
      # Written as a LITERAL, not ${OLLAMA_LOCAL_MODEL:-...}. `.env` is
      # gitignored, so a ${} default here is silently overridden by a stale
      # value nobody reviews — which is exactly what happened on the first
      # attempt at this swap: compose said granite4, `.env` line 16 said
      # gemma4:latest, and the container came up on gemma4 with no warning.
      # Keep deployment-shaping values literal in this file; reserve ${} for
      # secrets and per-host paths.
      - OLLAMA_LOCAL_MODEL=granite4:latest
      # Request budget for the LOCAL background model, separate from the 120s
      # default every cloud call keeps. A cloud model that has not answered in
      # 120s is not going to; a local one on a shared 8 GB GPU routinely is —
      # gemma4:latest is a 9.86 GB model that gets ~3.2 GB of VRAM and runs 32%
      # on GPU at ~7 tok/s. At the old shared ceiling the twice-daily media-watch
      # burst was pure data loss: one hour on 2026-08-31 logged 31 local calls,
      # 31 failures, average exactly 120.0s. See CLAUDE.md, "The local model has
      # its own timeout".
      - OLLAMA_LOCAL_TIMEOUT_SECS=${OLLAMA_LOCAL_TIMEOUT_SECS:-600}
      # The brain's default model — what a call with no provider_hint and no
      # required_capabilities lands on. Moved off gemma4:31b-cloud 2026-08-31.
      #
      # gemma4:31b-cloud is the one Ollama Cloud model measured to return EMPTY
      # completions — tokens counted, nothing in the stream — at ~25% on a
      # tool-calling prompt (see CLAUDE.md, "An empty completion is retried").
      # The chat loops retry that; a background job does not, so an empty
      # completion there is persisted as the step's output. It held this slot
      # for its `vision` capability, but nothing in workflows/
      # declares `required_capabilities: ["vision"]` — grep before changing
      # this back. It stays in models.yaml as the free tier's only vision
      # model, so a future vision step still resolves to it; it is just no
      # longer what unhinted calls fall through to.
      - OLLAMA_MODEL=gpt-oss:120b-cloud
      # Billing classes the routing policy may use: CLOUD_TIER 2 = local, free
      # and paid (ROUTING_BILLING, a comma list, overrides it when set). It no
      # longer decides alone — services/routing.rs also requires the work's
      # data_class to fit each provider's data_policy (private work only reaches
      # no_log providers), and a paid provider needs ROUTING_PAID_FOR plus a spend
      # cap. So the public monitors' reasoning steps still win on gemini-2.5-flash
      # (rank 5) while private ones (learn) go to gpt-oss:120b-cloud. On a 429
      # a step falls back to the active config, then local, each rung judged
      # by the same policy — see build_fallback_chain in services/shared_llm.rs.
      - CLOUD_TIER=2
      - ROUTING_BILLING=${ROUTING_BILLING:-}
      # Purposes allowed to spend money: any of chat,subagent,background. Empty
      # = none, so paid providers stay unroutable until this names one.
      - ROUTING_PAID_FOR=${ROUTING_PAID_FOR:-}
      # Human-facing /chat runs on gpt-oss:120b-cloud (Ollama Cloud, UNMETERED —
      # no RPM limit). Gemini was tried here and pulled back 2026-09-06: chat is
      # agentic (one model call per tool round), so a single tool-using turn
      # fired 8 Gemini calls in 17s and tripped the free tier's 5 requests/minute
      # cap mid-turn (the daily 1500 was never the issue — we sent 11 all day).
      # Gemini's per-minute limit fits background reasoning (1 call/step), not
      # interactive chat. So chat stays on gpt-oss; reasoning stays on Gemini via
      # CLOUD_TIER=2 capability routing. No CHAT_LLM_PROVIDER => inherit the
      # ollama-cloud provider + its key; no CHAT_API_KEY needed.
      - CHAT_LLM_MODEL=gpt-oss:120b-cloud
      # Worker/voice split: gpt-oss:120b-cloud gathers via tools (it is fast and
      # a willing, reliable tool caller but fills gaps with fluent invention);
      # gemma4:31b-cloud composes the final reply from what it gathered (nicer to
      # read, and says "we did not find that" instead of inventing). Unset both
      # to put gpt-oss back to speaking for itself.
      # Worker/voice split — OFF by default since 2026-09-11. It existed to
      # replace NO_ANSWER_AFTER_TOOLS when gpt-oss ran the loop; the local E4B
      # front door speaks for itself, faster (21.9s vs ~28s) and with BETTER
      # provenance — measured, the voice pass rewrote "based on what the
      # knowledge-worker found" into the brain's own voice, stripping the
      # attribution that TOOL-RESULT RULE exists to preserve. Turning it on
      # re-adds one cloud call per turn. Set a provider to re-enable:
      #   CHAT_SYNTHESIS_PROVIDER=ollama-cloud CHAT_SYNTHESIS_MODEL=gemma4:31b-cloud
      - CHAT_SYNTHESIS_PROVIDER=${CHAT_SYNTHESIS_PROVIDER-}
      - CHAT_SYNTHESIS_MODEL=${CHAT_SYNTHESIS_MODEL-}
      # In-chat sub-agent delegation (Phase 0 spike — OFF by default). When
      # "true", the orchestrator gains a `delegate(agent, task)` pseudo-tool that
      # runs a bounded, read-only worker sub-agent (researcher/code-analyst/
      # knowledge-worker) whose findings fold back into the turn. Flip to measure
      # latency + calls/turn. See project-docs/SUBAGENT_ORCHESTRATION_PLAN.md.
      - SUBAGENT_ENABLED=${SUBAGENT_ENABLED:-false}
      - OLLAMA_EMBED_MODEL=bge-m3:latest
      # Merge candidates get a verdict from this host-Ollama classifier on idle
      # time (plugins/alias-judge/crate/src/judge.rs); "off" turns it off. Needs `ollama pull nimble`.
      - ALIAS_JUDGE_MODEL=${ALIAS_JUDGE_MODEL:-nimble}
      # Wikimedia asks automated clients for a contact in the user agent; entity
      # linking (plugins/reference/crate/src/wiki.rs) refuses to look anything up without one. Set in .env.
      - WIKIMEDIA_CONTACT=${WIKIMEDIA_CONTACT-}
      # Keep local models resident between chain steps. Steps run serially with
      # gaps, so at Ollama's 5m default the background model and bge-m3 are
      # routinely evicted mid-chain and reloaded per step. Override with a Go
      # duration; "-1m" pins indefinitely (whisper also wants VRAM, so 30m).
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # The conversational front door. Deliberately tool-poor: it holds no
      # retrieval tools and reaches everything through `delegate` (chat) or
      # `run_agent` (MCP). Both vars point at the same profile on purpose — a
      # connecting MCP client then sees ~7 tools instead of the full registry,
      # which keeps its context small. Revert either to `general` to go back.
      - CHAT_DEFAULT_PROFILE=${CHAT_DEFAULT_PROFILE:-GeneralDefault-Orchrestator}
      - MCP_TOOL_PROFILE=${MCP_TOOL_PROFILE:-GeneralDefault-Orchrestator}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Free-tier OpenAI-compatible providers (models.yaml `providers:`). Both are
      # declared data_policy may_train and opened to private work by
      # `private_ok_for` (2026-10-10): the cloud overflow after Ollama Cloud.
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MCP_TRANSPORT=http
      - MCP_HTTP_BIND=0.0.0.0:3000
      - MCP_API_KEY=   # disabled: env_file would otherwise enable auth from .env
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      # Keyed search_web engines. An engine with no key is dropped from the
      # ladder, so leaving one blank costs nothing. Tavily and Exa refill monthly
      # with no card; Serper is 2,500 once; Brave needs a card (no spend cap).
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      # News engines (search_web) — explicit `engine:` only, not in the ladder
      # (fringe/off-topic results on the brain's queries, 2026-10-06).
      # Currents 250/day (7-day windows); Webz is prepaid credit
      # (~$0.01/result, balance logged per call; 5 results per search).
      - CURRENTS_API_KEY=${CURRENTS_API_KEY:-}
      - WEBZIO_API_KEY=${WEBZIO_API_KEY:-}
      # Anakin.io: headless-browser fallback when ingest_article cannot read a
      # page itself (blocked or script-rendered). ~1 of 300 credits/month each.
      - ANAKINIO_API_KEY=${ANAKINIO_API_KEY:-}
      # ApiTube news API key — injected into http_request via the seeded `apitube`
      # ApiContext (X-API-Key header). Used by the daily news brief for structured,
      # dated articles alongside google_news. Free tier is 100 requests/day.
      - APITUBE_API_KEY=${APITUBE_API_KEY:-}
      # ACLED conflict-event API (acled_events). OAuth password grant — ACLED has
      # no API keys, so the account's email + password. Unset => tool not registered.
      - ACLED_EMAIL=${ACLED_EMAIL:-}
      - ACLED_PASSWORD=${ACLED_PASSWORD:-}
      # search_web failover ladder. Keyed engines first; SearXNG is the flagged
      # last resort (its working backends are Naver/Seznam/Zapmeta: undated,
      # foreign-index results, and it always answers, so leading with it starved
      # the keyed engines). Brave stays behind it: card on file, no spend cap.
      # Reorder here to change preference without a rebuild.
      - SEARCH_ENGINE_ORDER=exa,tavily,serper,serpapi,google,searxng,brave
      - SEARXNG_URL=http://searxng:8080
      # Sandboxed code execution. Unset => execute_code is not registered at
      # all, so a deployment without the sandbox service degrades cleanly.
      - SANDBOX_URL=http://sandbox:8000
      # Offline Rust compile/test sandbox. Unset => execute_code offers no
      # `language: "rust"`. See rust-sandbox/ and RUST_FINETUNE_EXPERIMENT.md.
      - RUST_SANDBOX_URL=http://rust-sandbox:8000
      - TELEMETRY_DB_PATH=/home/agent/telemetry/telemetry.duckdb
      - MODEL_CATALOG_PATH=/home/agent/agent-brain/models.yaml
      - WORKSPACE_DIR=/home/agent/workspace
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - KNOWLEDGE_SNAPSHOT_DIR=/home/agent/snapshots
      - CODEBASE_DIR=/home/agent/agent-brain
      # Seed bundles (services/plugins.rs): workflows, profiles, sources, media sources,
      # MCP servers, schemas, topics, entity seeds, relation types. `core` always loads;
      # PLUGINS_ENABLED names the others (comma-separated). GET /api/plugins shows each one.
      - PLUGINS_DIR=/home/agent/agent-brain/plugins
      - PLUGINS_ENABLED=${PLUGINS_ENABLED:-osint-data,media,reference,alias-judge,developer}
      # Bundles the brain drafts (manage_plugin). Inert until PLUGINS_ENABLED names one.
      - PLUGINS_RUNTIME_DIR=/home/agent/agent-brain/plugins-runtime
      - YT_DLP_PATH=/usr/local/bin/yt-dlp                        # yt-dlp baked into the image
      - MEDIA_WATCH_ENABLED=true                                 # autonomous channel polling (12h schedule)
      # 1, paired with the 6h interval in workflows/media-watch.yaml — see the
      # note there. Halves the burst (30 videos at once -> 15) while keeping the
      # daily cap at 60. Lowered from 2 on 2026-09-01.
      - MEDIA_WATCH_MAX_PER_SOURCE=1                             # first-poll stampede guard: max new videos/source/poll
      - MEDIA_DISCOVERY_ENABLED=true                             # weekly autonomous watchlist curation (stages INACTIVE sources for review)
      - GAP_TASKS_DAILY_MAX=${GAP_TASKS_DAILY_MAX:-20}            # curiosity engine: max 'fill knowledge gap' tasks per local day
      - MEDIA_DISCOVERY_MAX=3                                    # max new sources staged per discovery run
      - WHISPER_PROVIDER=http                                    # caption-less fallback via self-hosted Whisper sidecar
      - WHISPER_BASE_URL=http://whisper:8000/v1                  # OpenAI-compatible endpoint (faster-whisper-server)
      - WHISPER_MODEL=Systran/faster-whisper-base
      # GitHub access is via the seeded `github` ApiContext + `http_request` tool.
      # GITHUB_TOKEN is auto-injected by http_request when context_name="github".
      # It is also used by entrypoint.sh to configure HTTPS push credentials.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Git identity for commits made by the brain.
      - GIT_USER_NAME=${GIT_USER_NAME:-agent-brain}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-agent-brain@noreply.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ara/gadgetlabs:/home/agent/gadgetlabs:ro
      - /home/ara/agent-brain:/home/agent/agent-brain:rw
      - brain_snapshots:/home/agent/snapshots
      - brain_ssh:/home/agent/.ssh          # persists signing key across rebuilds
      - ./telemetry:/home/agent/telemetry
      - ./workspace:/home/agent/workspace
    depends_on:
      neo4j:
        condition: service_healthy
      searxng:
        condition: service_started
      sandbox:
        condition: service_started
      rust-sandbox:
        condition: service_started
      llamacpp:
        condition: service_started
    networks:
      - brain-internal
      - sandbox-net
      - ai-network
    restart: unless-stopped

  # Local, self-hosted Whisper transcription (OpenAI-compatible API) for the
  # Media Learning skill's caption-less fallback. No external services, no API
  # cost. Captions cover the majority of videos, so Whisper runs only
  # occasionally; the model unloads after idle TTL to free VRAM.
  #
  # GPU (cuda): host driver 535.261.03 (CUDA 12.2) satisfies the -cuda image's
  # CUDA 12.2 runtime. Shares the 8 GB RTX 3060 Ti with host Ollama — the base
  # model in float16 is ~1 GB and unloads on TTL, so contention is minimal.
  # If the -cuda image ever bumps past CUDA 12.2, either bump the host driver
  # or fall back to :latest-cpu + WHISPER__INFERENCE_DEVICE=cpu.
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-base
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float16
      - WHISPER__TTL=300   # unload the model after 5 min idle to free VRAM
    volumes:
      - whisper_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - brain-internal
    restart: unless-stopped

  # Local llama.cpp inference server (OpenAI-compatible) for all background /
  # scheduled jobs — the generation backend when LOCAL_LLM_BACKEND=llamacpp.
  # Replaces host Ollama as the *generation* backend; embeddings still run on
  # host Ollama (bge-m3), which a single-model llama-server does not serve, so
  # the brain keeps OLLAMA_LOCAL_URL pointed at host Ollama for embed() only.
  #
  # GPU (cuda): host driver 535.261.03 (CUDA 12.2) satisfies the -cuda image.
  # Shares the 8 GB RTX 3060 Ti with host Ollama's bge-m3 (~1.2 GB) and the
  # whisper sidecar (~1 GB, on-demand). Qwen3-8B Q4_K_M (~4.7 GB) fits alongside
  # them with a q8_0 KV cache and a conservative context; tune -c / -ngl below.
  #
  # -hf auto-downloads the GGUF into the mounted cache on first start (persists
  # across restarts via the llamacpp_cache volume). --reasoning-budget 0 disables
  # Qwen3's <think> output so background steps that parse JSON get clean text
  # (see CLAUDE.md — a thinking model emits into `thinking` and returns empty).
  llamacpp:
    # Built from source against CUDA 12.2 to match the host's 535 driver — the
    # upstream prebuilt image's CUDA 12.8 kernels won't load on it. See
    # llamacpp/Dockerfile.
    build:
      context: ./llamacpp
      dockerfile: Dockerfile
    # Model: Gemma-4-E4B (unsloth GGUF). Benchmarked 2026-09-10 on the RTX 3060 Ti
    # against Qwen3-8B and Ollama: E4B Q4_K_M is fully GPU-resident at ~3.3 GB /
    # ~80 tok/s — HALF the VRAM of Qwen3-8B (6.0 GB) and ~14% faster, on llama.cpp
    # ~13% faster than the same model on Ollama. The ~2.7 GB it frees takes
    # headroom to ~3.5 GB (kills the whisper-burst OOM risk). Tuning notes:
    # `-np 2` matches the queue's 2 concurrent local slots. q8_0 KV is the
    # compact option.
    #
    # ★ `-c` IS DIVIDED BY `-np`, so it is NOT the per-request context limit.
    # This server runs with `kv_unified = 'false'` (check the startup line
    # `srv load_model: initializing, n_slots = N, n_ctx_slot = M`), which
    # statically partitions the KV cache: `-c 16384 -np 2` gave each request
    # 8192 and nothing announced it. On 2026-09-11 a `reason` job sent 8956
    # tokens and took a hard `400 … exceeds the available context size (8192)`,
    # burning all 3 attempts and dead-lettering the job; the sub-agent loop was
    # already peaking at 6916 tokens_in, ~1.3k short of a ceiling nobody set.
    # So size `-c` as (per-request context × -np): 32768/2 = the 16384 per
    # request the distiller and the sub-agent loop actually need. Read
    # n_ctx_slot at startup after changing either flag — it is the only number
    # that matters, and `-c` alone does not tell you what it will be.
    #
    # `--no-mmproj` pays for the extra KV: `-hf` auto-downloads Gemma-4's BF16
    # multimodal projector and loads it into VRAM, and nothing on the background
    # path ever sends an image (vision routes to the ollama-cloud vision model —
    # see models.yaml). Skipping it frees that VRAM for context.
    #
    # ★ Gemma 4 is a THINKING model and IGNORES `--reasoning-budget 0` (Qwen's
    # flag) — it leaks its reasoning into the answer and emits no JSON. It needs
    # `--reasoning off`. A 12B does NOT fit resident here (Gemma-3-12B Q3_K_M
    # spills to CPU ~21 tok/s); E4B is the resident/fast choice.
    command: >
      -hf unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
      --alias gemma4-e4b
      --host 0.0.0.0 --port 8080
      -ngl 99
      -c 32768
      -np 2
      --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --jinja
      --reasoning off
      --no-webui
      --no-mmproj
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - llamacpp_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - brain-internal
    restart: unless-stopped

  # Self-hosted metasearch for the `search_web` tool — the first rung of the
  # engine failover ladder. Aggregates ~70 upstream engines behind one JSON API
  # with no API key and no quota, which is the whole point: the keyed engines
  # (Google CSE 100/day, SerpApi 100/month) cannot sustain the brain's ~15
  # searches/day, and an exhausted SerpApi free tier previously killed the daily
  # news brief for two days.
  #
  # Deliberately NOT published to a host port — it is reachable only on
  # brain-internal, so the disabled bot limiter in searxng/settings.yml is not
  # an exposure. Do not add a `ports:` mapping without re-enabling the limiter.
  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # Signs session cookies. Generated once and kept in .env; a rotating value
      # is harmless here (no human sessions to invalidate) but a missing one
      # makes the container refuse to start.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-agent-brain-searxng-secret}
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - brain-internal
    restart: unless-stopped

  # Sandboxed Python execution for the `execute_code` tool — the substrate for
  # tool-integrated reasoning (a step computes its numbers instead of narrating
  # them). Everything about this service is about containing LLM-written code:
  #
  #   - `sandbox-net` is `internal: true`, so it has NO route off the host.
  #     This is the only real egress boundary; per-process limits inside the
  #     container are runaway guards, not a security boundary.
  #   - No env_file and no secrets: the brain's NEO4J_PASSWORD, OLLAMA_API_KEY
  #     and GITHUB_TOKEN must never be reachable from submitted code.
  #   - No bind mounts. The repo and workspace are deliberately absent; a run
  #     gets a fresh scratch dir on tmpfs and nothing else.
  #   - read_only root + dropped capabilities + no-new-privileges.
  #
  # Do NOT put this service on brain-internal or add a `ports:` mapping — either
  # one restores the egress this design exists to remove.
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 128
    networks:
      - sandbox-net
    restart: unless-stopped

  # Offline Rust compile/test sandbox for `execute_code(language: "rust")`.
  # Same contract as `sandbox` above — sandbox-net only, no env_file, no bind
  # mounts, read-only root, no capabilities — with two measured differences:
  #
  #   - /work is tmpfs WITHOUT noexec: Rust compiles test binaries and build
  #     scripts and must run them. The network is still the boundary.
  #   - Crates are pre-fetched into the image at build time
  #     (rust-sandbox/crates/Cargo.toml) and cargo runs --offline against that
  #     read-only cache. tmpfs pages count against mem_limit, hence 4g.
  #
  # Do NOT put this service on brain-internal or add a `ports:` mapping.
  rust-sandbox:
    build:
      context: ./rust-sandbox
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /work:rw,exec,nosuid,size=2g,mode=1777
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    pids_limit: 256
    networks:
      - sandbox-net
    restart: unless-stopped

  hbi-frontend:
    build:
      context: ./hbi-frontend
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - agent-brain
    networks:
      - ai-network
    restart: unless-stopped

networks:
  brain-internal:
  # Carries only agent-brain <-> sandbox. `internal: true` removes the default
  # gateway, which is what actually denies the sandbox any egress. agent-brain
  # keeps its own internet access via brain-internal/ai-network.
  sandbox-net:
    internal: true
  ai-network:
    external: true

volumes:
  whisper_cache:
  llamacpp_cache:
  neo4j_data:
  neo4j_logs:
  brain_snapshots:
  brain_ssh:
