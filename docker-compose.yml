services:
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7689:7687"    # Bolt (7689 to avoid conflict with agent-api on 7688)
      - "7476:7474"    # Browser UI (7476 to avoid conflict with agent-api on 7475)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brain-internal
    restart: unless-stopped

  # MCP Server with HTTP transport
  agent-brain:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"    # MCP HTTP endpoint (Use 3001 to avoid conflict if agent-api runs on 3000)
    env_file:
      - .env           # Load .env directly — avoids host shell env overriding API keys
    environment:
      # Wall-clock zone for everything the brain says about time. Without this
      # the container runs UTC, and in America/Detroit that means the brain
      # rolls over to tomorrow at 20:00 local — dating notes, news searches, and
      # chat answers to the wrong day for the last four hours of every day.
      # Storage stays UTC regardless; this affects display only (services/clock.rs).
      - TZ=${TZ:-America/Detroit}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - LLM_PROVIDER=ollama-cloud
      - OLLAMA_URL=https://ollama.com
      - OLLAMA_LOCAL_URL=http://host.docker.internal:11434
      # The brain's default model — what a call with no provider_hint and no
      # required_capabilities lands on. Moved off gemma4:31b-cloud 2026-08-31.
      #
      # gemma4:31b-cloud is the one Ollama Cloud model measured to return EMPTY
      # completions — tokens counted, nothing in the stream — at ~25% on a
      # tool-calling prompt (see CLAUDE.md, "An empty completion is retried").
      # The chat loops retry that; a background job does not, so an empty
      # completion there is persisted as the step's output. It held this slot
      # for its `vision` capability, but nothing in chains/ or schedules/
      # declares `required_capabilities: ["vision"]` — grep before changing
      # this back. It stays in models.yaml as the free tier's only vision
      # model, so a future vision step still resolves to it; it is just no
      # longer what unhinted calls fall through to.
      - OLLAMA_MODEL=gpt-oss:120b-cloud
      # Human-facing /chat has its own config handle. Setting any CHAT_LLM_*
      # var means `use_model` from a chat session retargets the BRAIN only —
      # unset this to put both back on one model. Same model as the brain
      # today, but keep the handle: it is what lets the two diverge again.
      - CHAT_LLM_MODEL=gpt-oss:120b-cloud
      - OLLAMA_EMBED_MODEL=bge-m3:latest
      # Keep local models resident between chain steps. Steps run serially with
      # gaps, so at Ollama's 5m default the background model and bge-m3 are
      # routinely evicted mid-chain and reloaded per step. Override with a Go
      # duration; "-1m" pins indefinitely (whisper also wants VRAM, so 30m).
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - MCP_TOOL_PROFILE=general    # Limit tools/list to this profile for smaller MCP clients (e.g. Open WebUI)
      - CONTEXTS_DIR=/home/agent/agent-brain/contexts  # Use volume-mounted contexts so profile changes take effect without rebuild
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MCP_TRANSPORT=http
      - MCP_HTTP_BIND=0.0.0.0:3000
      - MCP_API_KEY=   # disabled: env_file would otherwise enable auth from .env
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      # search_web failover ladder. SearXNG is self-hosted and unmetered, so it
      # leads; the keyed engines below it are backstops for a sidecar outage.
      # Reorder here to change preference without a rebuild.
      - SEARCH_ENGINE_ORDER=searxng,google,serpapi,brave
      - SEARXNG_URL=http://searxng:8080
      # Sandboxed code execution. Unset => execute_code is not registered at
      # all, so a deployment without the sandbox service degrades cleanly.
      - SANDBOX_URL=http://sandbox:8000
      - TELEMETRY_DB_PATH=/home/agent/telemetry/telemetry.duckdb
      - MODEL_CATALOG_PATH=/home/agent/agent-brain/models.yaml
      - PROPOSALS_DIR=/home/agent/proposals
      - WORKSPACE_DIR=/home/agent/workspace
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - KNOWLEDGE_SNAPSHOT_DIR=/home/agent/snapshots
      - CODEBASE_DIR=/home/agent/agent-brain
      - CHAINS_DIR=/home/agent/agent-brain/chains
      - SCHEDULES_DIR=/home/agent/agent-brain/schedules
      - SOURCES_DIR=/home/agent/agent-brain/sources
      - SOURCES_MEDIA_DIR=/home/agent/agent-brain/sources-media  # MediaSource watchlist (bind-mounted)
      - YT_DLP_PATH=/usr/local/bin/yt-dlp                        # yt-dlp baked into the image
      - MEDIA_WATCH_ENABLED=true                                 # autonomous channel polling (12h schedule)
      - MEDIA_WATCH_MAX_PER_SOURCE=2                             # first-poll stampede guard: max new videos/source/poll
      - MEDIA_DISCOVERY_ENABLED=true                             # weekly autonomous watchlist curation (stages INACTIVE sources for review)
      - MEDIA_DISCOVERY_MAX=3                                    # max new sources staged per discovery run
      - WHISPER_PROVIDER=http                                    # caption-less fallback via self-hosted Whisper sidecar
      - WHISPER_BASE_URL=http://whisper:8000/v1                  # OpenAI-compatible endpoint (faster-whisper-server)
      - WHISPER_MODEL=Systran/faster-whisper-base
      # GitHub access is via the seeded `github` ApiContext + `http_request` tool.
      # GITHUB_TOKEN is auto-injected by http_request when context_name="github".
      # It is also used by entrypoint.sh to configure HTTPS push credentials.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Git identity for commits made by the brain.
      - GIT_USER_NAME=${GIT_USER_NAME:-agent-brain}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-agent-brain@noreply.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ara/gadgetlabs:/home/agent/gadgetlabs:ro
      - /home/ara/agent-brain:/home/agent/agent-brain:rw
      - brain_snapshots:/home/agent/snapshots
      - brain_ssh:/home/agent/.ssh          # persists signing key across rebuilds
      - ./telemetry:/home/agent/telemetry
      - ./proposals:/home/agent/proposals
      - ./workspace:/home/agent/workspace
    depends_on:
      neo4j:
        condition: service_healthy
      searxng:
        condition: service_started
      sandbox:
        condition: service_started
    networks:
      - brain-internal
      - sandbox-net
      - ai-network
    restart: unless-stopped

  # Local, self-hosted Whisper transcription (OpenAI-compatible API) for the
  # Media Learning skill's caption-less fallback. No external services, no API
  # cost. Captions cover the majority of videos, so Whisper runs only
  # occasionally; the model unloads after idle TTL to free VRAM.
  #
  # GPU (cuda): host driver 535.261.03 (CUDA 12.2) satisfies the -cuda image's
  # CUDA 12.2 runtime. Shares the 8 GB RTX 3060 Ti with host Ollama — the base
  # model in float16 is ~1 GB and unloads on TTL, so contention is minimal.
  # If the -cuda image ever bumps past CUDA 12.2, either bump the host driver
  # or fall back to :latest-cpu + WHISPER__INFERENCE_DEVICE=cpu.
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-base
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float16
      - WHISPER__TTL=300   # unload the model after 5 min idle to free VRAM
    volumes:
      - whisper_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - brain-internal
    restart: unless-stopped

  # Self-hosted metasearch for the `search_web` tool — the first rung of the
  # engine failover ladder. Aggregates ~70 upstream engines behind one JSON API
  # with no API key and no quota, which is the whole point: the keyed engines
  # (Google CSE 100/day, SerpApi 100/month) cannot sustain the brain's ~15
  # searches/day, and an exhausted SerpApi free tier previously killed the daily
  # news brief for two days.
  #
  # Deliberately NOT published to a host port — it is reachable only on
  # brain-internal, so the disabled bot limiter in searxng/settings.yml is not
  # an exposure. Do not add a `ports:` mapping without re-enabling the limiter.
  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # Signs session cookies. Generated once and kept in .env; a rotating value
      # is harmless here (no human sessions to invalidate) but a missing one
      # makes the container refuse to start.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-agent-brain-searxng-secret}
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - brain-internal
    restart: unless-stopped

  # Sandboxed Python execution for the `execute_code` tool — the substrate for
  # tool-integrated reasoning (a step computes its numbers instead of narrating
  # them). Everything about this service is about containing LLM-written code:
  #
  #   - `sandbox-net` is `internal: true`, so it has NO route off the host.
  #     This is the only real egress boundary; per-process limits inside the
  #     container are runaway guards, not a security boundary.
  #   - No env_file and no secrets: the brain's NEO4J_PASSWORD, OLLAMA_API_KEY
  #     and GITHUB_TOKEN must never be reachable from submitted code.
  #   - No bind mounts. The repo and workspace are deliberately absent; a run
  #     gets a fresh scratch dir on tmpfs and nothing else.
  #   - read_only root + dropped capabilities + no-new-privileges.
  #
  # Do NOT put this service on brain-internal or add a `ports:` mapping — either
  # one restores the egress this design exists to remove.
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 128
    networks:
      - sandbox-net
    restart: unless-stopped

  hbi-frontend:
    build:
      context: ./hbi-frontend
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - agent-brain
    networks:
      - ai-network
    restart: unless-stopped

networks:
  brain-internal:
  # Carries only agent-brain <-> sandbox. `internal: true` removes the default
  # gateway, which is what actually denies the sandbox any egress. agent-brain
  # keeps its own internet access via brain-internal/ai-network.
  sandbox-net:
    internal: true
  ai-network:
    external: true

volumes:
  whisper_cache:
  neo4j_data:
  neo4j_logs:
  brain_snapshots:
  brain_ssh:
