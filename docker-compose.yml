# Every variable: project-docs/env.md. Why things are this way: dev notes, subsystem
# `deploy` (scripts/dev_docs.sh search "<question>" deploy).
services:
  # Ports, and who holds the key: deploy/ports-what-listens-where-and-who-holds-the-key
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    ports:
      - "127.0.0.1:7689:7687"
      - "127.0.0.1:7476:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brain-internal
    restart: unless-stopped

  # The brain. What it is running: deploy/how-to-see-what-is-running
  agent-brain:
    build:
      context: .
      dockerfile: Dockerfile
      # What /health reports; scripts/build_identity.sh sets them.
      args:
        GIT_COMMIT: ${BRAIN_GIT_COMMIT:-}
        GIT_DIRTY: ${BRAIN_GIT_DIRTY:-}
        BUILD_TIME: ${BRAIN_BUILD_TIME:-}
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      # Display only; storage stays UTC. subsystem-rules/architecture-subsystem-rules-the-brain-s-sense-of-time
      - TZ=${TZ:-UTC}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # deploy/default-models-how-each-slot-got-where-it-is
      - LLM_PROVIDER=mistral
      - OLLAMA_URL=https://ollama.com
      - LOCAL_ENGINE=${LOCAL_ENGINE:-llamacpp}
      - LOCAL_ENGINE_URL=${LOCAL_ENGINE_URL:-http://llamacpp:8080}
      - LOCAL_ENGINE_CAPABILITIES=${LOCAL_ENGINE_CAPABILITIES:-}
      - LOCAL_MODEL=${LOCAL_MODEL:-}
      - LOCAL_EMBED_MODEL=${LOCAL_EMBED_MODEL:-}
      - LOCAL_DECISION_MODEL=${LOCAL_DECISION_MODEL:-}
      - LOCAL_GROUNDING_MODEL=${LOCAL_GROUNDING_MODEL:-}
      - CLAIM_CONTRADICTION_MODEL=${CLAIM_CONTRADICTION_MODEL:-z-ai/glm-5.3-flash}
      # deploy/local-timeout-secs-why-the-local-model-has-its-own-budget
      - LOCAL_TIMEOUT_SECS=${LOCAL_TIMEOUT_SECS:-600}
      - LLM_MODEL=ministral-14b-latest
      - CLOUD_TIER=2
      - ROUTING_BILLING=${ROUTING_BILLING:-}
      - ROUTING_PAID_FOR=${ROUTING_PAID_FOR:-}
      - CHAT_LLM_MODEL=ministral-14b-latest
      - CHAT_SYNTHESIS_PROVIDER=${CHAT_SYNTHESIS_PROVIDER-}
      - CHAT_SYNTHESIS_MODEL=${CHAT_SYNTHESIS_MODEL-}
      - SUBAGENT_ENABLED=${SUBAGENT_ENABLED:-true}
      - TOOL_ARG_CHECK=${TOOL_ARG_CHECK:-shadow}
      - HTTP_ALLOW_INTERNAL=${HTTP_ALLOW_INTERNAL:-}
      - SECRETS_INDEX=/home/agent/vault/index.yaml
      - CHAT_ROUTER=${CHAT_ROUTER:-on}
      - CHAT_ROUTER_CHECKER=${CHAT_ROUTER_CHECKER:-off}
      - GPU_LEASE_LOCAL_JOBS=${GPU_LEASE_LOCAL_JOBS:-free}
      - GPU_LEASE_EMBEDDINGS=${GPU_LEASE_EMBEDDINGS:-openrouter-paid:baai/bge-m3}
      - WIKIMEDIA_CONTACT=${WIKIMEDIA_CONTACT-}
      # deploy/the-front-door-s-profile-is-set-twice-on-purpose
      - CHAT_DEFAULT_PROFILE=${CHAT_DEFAULT_PROFILE:-GeneralDefault-Orchrestator}
      - MCP_TOOL_PROFILE=${MCP_TOOL_PROFILE:-GeneralDefault-Orchrestator}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MCP_TRANSPORT=http
      - MCP_HTTP_BIND=0.0.0.0:3000
      - MCP_API_KEY=${MCP_API_KEY:?set MCP_API_KEY in .env}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - CURRENTS_API_KEY=${CURRENTS_API_KEY:-}
      - WEBZIO_API_KEY=${WEBZIO_API_KEY:-}
      - ANAKINIO_API_KEY=${ANAKINIO_API_KEY:-}
      - ACLED_EMAIL=${ACLED_EMAIL:-}
      - ACLED_PASSWORD=${ACLED_PASSWORD:-}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - SEARCH_ENGINE_ORDER=exa,tavily,tinyfish,serper,serpapi,google,brave
      - SANDBOX_URL=http://sandbox:8000
      - RUST_SANDBOX_URL=http://rust-sandbox:8000
      - TELEMETRY_DB_PATH=/home/agent/telemetry/telemetry.duckdb
      - TRACKS_DB_PATH=/home/agent/telemetry/tracks.duckdb
      - MODEL_CATALOG_PATH=/home/agent/agent-brain/models.yaml
      - WORKSPACE_DIR=/home/agent/workspace
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - KNOWLEDGE_SNAPSHOT_DIR=/home/agent/snapshots
      - CODEBASE_DIR=/home/agent/agent-brain
      - PLUGINS_DIR=/home/agent/agent-brain/plugins
      - PLUGINS_ENABLED=${PLUGINS_ENABLED:-osint-data,media,reference,alias-judge,developer,epistemics,sandbox,research,websocket,github,maps,harness,mcp-client,apis}
      - PLUGINS_EXTRA_DIRS=/home/agent/plugins-private
      - PLUGINS_RUNTIME_DIR=/home/agent/agent-brain/plugins-runtime
      - YT_DLP_PATH=/usr/local/bin/yt-dlp
      - YT_DLP_PROXY=http://yt-proxy:8888
      # deploy/media-watch-settings-why-the-caps
      - MEDIA_WATCH_ENABLED=${MEDIA_WATCH_ENABLED:-false}
      - MEDIA_WATCH_MAX_PER_SOURCE=1
      - MEDIA_DISCOVERY_ENABLED=true
      - GAP_TASKS_DAILY_MAX=${GAP_TASKS_DAILY_MAX:-20}
      - MEDIA_DISCOVERY_MAX=3
      - WHISPER_PROVIDER=http
      - WHISPER_BASE_URL=http://whisper:8000/v1
      - WHISPER_MODEL=Systran/faster-whisper-base
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-agent-brain}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-agent-brain@noreply.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # deploy/container-dns-why-tailnet-names-need-brain-dns
    dns:
      - ${BRAIN_DNS:-8.8.8.8}
      - 8.8.8.8
    volumes:
      - ${EXTRA_CODE_HOST_DIR:-./workspace/no-extra-code}:/home/agent/gadgetlabs:ro
      - .:/home/agent/agent-brain:rw
      - brain_snapshots:/home/agent/snapshots
      - brain_ssh:/home/agent/.ssh
      - ./telemetry:/home/agent/telemetry
      - ./workspace:/home/agent/workspace
      - ${PLUGINS_PRIVATE_HOST_DIR:-../agent-brain-personal}:/home/agent/plugins-private:ro
      - ${VAULT_HOST_DIR:-${HOME}/.config/agent-brain/vault}:/home/agent/vault:ro
    depends_on:
      neo4j:
        condition: service_healthy
      sandbox:
        condition: service_started
      rust-sandbox:
        condition: service_started
      llamacpp:
        condition: service_started
      yt-proxy:
        condition: service_started
    networks:
      - brain-internal
      - sandbox-net
      - yt-link
      - ai-network
    restart: unless-stopped

  # Downloads llamacpp/models.manifest: docker compose run --rm models-fetch (install.sh does).
  models-fetch:
    profiles: [install]
    image: curlimages/curl:8.21.0
    user: root
    entrypoint: ["/fetch_models.sh", "/manifest"]
    volumes:
      - llamacpp_cache:/models
      - ./llamacpp/models.manifest:/manifest:ro
      - ./llamacpp/fetch_models.sh:/fetch_models.sh:ro

  # deploy/whisper-sidecar-gpu-and-driver
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-base
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float16
      - WHISPER__TTL=300
    volumes:
      - whisper_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - brain-internal
    restart: unless-stopped

  # Every local model on one port. Flags are in llamacpp/presets/; how they were found:
  # deploy/local-engine-flags-how-the-llama-cpp-settings-were-found
  llamacpp:
    build:
      context: ./llamacpp
      dockerfile: Dockerfile
      # From install.sh; the defaults are the 3060 Ti this was measured on.
      args:
        BUILD_IMAGE: ${LLAMA_BUILD_IMAGE:-nvidia/cuda:12.2.2-devel-ubuntu22.04}
        RUN_IMAGE: ${LLAMA_RUN_IMAGE:-nvidia/cuda:12.2.2-runtime-ubuntu22.04}
        GGML_CUDA: ${LLAMA_GGML_CUDA:-ON}
        CUDA_ARCH: ${LLAMA_CUDA_ARCH:-86}
    command: >
      --models-preset /preset.ini
      --models-max 4
      --host 0.0.0.0 --port 8080
      --no-webui
    volumes:
      - llamacpp_cache:/models
      - ./llamacpp/presets/${LOCAL_ENGINE_PRESET:-gpu-8gb}.ini:/preset.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - brain-internal
    restart: unless-stopped

  # Do NOT add brain-internal or a ports: mapping: deploy/sandboxes-what-contains-llm-written-code
  sandbox:
    build:
      context: ./plugins/sandbox/python
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 128
    networks:
      - sandbox-net
    restart: unless-stopped

  # Opt in with COMPOSE_PROFILES=ml-lab: 12 cores overnight, and it submits to Kaggle (ML_LAB_PLAN.md).
  ml-runner:
    profiles: [ml-lab]
    build:
      context: ./plugins/ml-lab/runner
      dockerfile: Dockerfile
    environment:
      - TZ=${TZ:-UTC}
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN:-}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
      - ML_RUNNER_HOURS=${ML_RUNNER_HOURS:-23-7}
      - ML_RUNNER_WORKERS=${ML_RUNNER_WORKERS:-12}
      - ML_SUBMIT=${ML_SUBMIT:-on}
      - ML_SEARCH=${ML_SEARCH:-lp}
      - ML_PLAYGROUND=${ML_PLAYGROUND:-playground-series-s6e11}
    volumes:
      - ./workspace/ml-lab/squares:/data
      - ./workspace/ml-lab/playground:/playground
    cpus: ${ML_RUNNER_WORKERS:-12}
    mem_limit: 6g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - brain-internal
    restart: unless-stopped

  # Do NOT add brain-internal or a ports: mapping: deploy/sandboxes-what-contains-llm-written-code
  rust-sandbox:
    build:
      context: ./plugins/sandbox/rust
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /work:rw,exec,nosuid,size=2g,mode=1777
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    pids_limit: 256
    networks:
      - sandbox-net
    restart: unless-stopped

  # deploy/yt-proxy-networks-and-subnets
  yt-proxy:
    build:
      context: ./plugins/media/yt-proxy
      dockerfile: Dockerfile
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    networks:
      - yt-egress
      - yt-link
    restart: unless-stopped

  hbi-frontend:
    build:
      context: ./hbi-frontend
      dockerfile: Dockerfile
    ports:
      - "${HBI_BIND:-127.0.0.1}:3002:80"
    environment:
      - BRAIN_API_KEY=${MCP_API_KEY:?set MCP_API_KEY in .env}
      - NGINX_ENVSUBST_FILTER=^BRAIN_
    volumes:
      - ./maps:/usr/share/nginx/maps:ro
    depends_on:
      - agent-brain
    networks:
      - ai-network
    restart: unless-stopped

networks:
  brain-internal:
  # internal: true is what denies the sandbox egress. Do not change it.
  sandbox-net:
    internal: true
  ai-network:
    external: true
  # Both subnets are fixed: deploy/yt-proxy-networks-and-subnets
  yt-egress:
    ipam:
      config:
        - subnet: 172.30.250.0/24
  yt-link:
    internal: true
    ipam:
      config:
        - subnet: 172.30.251.0/24

volumes:
  whisper_cache:
  llamacpp_cache:
  neo4j_data:
  neo4j_logs:
  brain_snapshots:
  brain_ssh:
