# models.yaml — Model catalog and context configuration
# This file is the single source of truth for model definitions.
# Loaded into DuckDB at startup for fast runtime queries.
# Add a model here and restart (or call reload_models) to make it available.

defaults:
  temperature: 0.7
  max_tokens: 4096
  timeout_secs: 120

# ── providers: how to reach each model's provider, and what calling it means ──
#
# Every model's `provider:` names an entry here (project-docs/PROVIDER_ROUTING_PLAN.md).
# Keys NEVER live in this file — only the NAME of the env var holding one
# (`api_key_env`). A provider whose key var is unset or empty is skipped, never
# an error.
#
#   kind         client code: ollama | llamacpp | openai_compat | anthropic | gemini.
#                Any OpenAI-wire API, free or paid, is a new `openai_compat` entry.
#   billing      local (own hardware) | free (rate-limited, $0) | paid (money).
#                Omitted ⇒ paid.
#   data_policy  no_log | may_log | may_train — what the provider may do with
#                prompts. Omitted ⇒ may_train. Private work will only ever be
#                routed to no_log providers.
#   limits       rpm / rpd / tpd / concurrency, shared by every model of the
#                provider. A model entry may also declare `limits:` (rpm/rpd/tpd),
#                counted for that model alone, on top of these.
#   spend        daily_usd / monthly_usd. A paid provider without one is reported
#                at startup and will not be routable under the policy router.
#   terms        where the billing / data_policy claim came from, and when.
#   private_ok_for  purposes (chat | subagent | background) whose PRIVATE work
#                may use this provider despite its data_policy — the owner's
#                override, kept apart from the provider's terms. Omitted ⇒ none.
#
# Every call is judged by the routing policy (services/routing.rs) against
# these declarations. A provider left out of this section falls back to the built-in table in
# services/provider_registry.rs, which matches the old hardcoded endpoints.
providers:
  ollama:
    kind: ollama
    billing: local
    data_policy: no_log
    base_url_env: OLLAMA_LOCAL_URL
    base_url_default: "http://localhost:11434"
    limits: { concurrency: 2 }
  llamacpp:
    kind: llamacpp
    billing: local
    data_policy: no_log
    base_url_env: LLAMACPP_URL
    base_url_default: "http://localhost:8080"
    limits: { concurrency: 2 }   # llama-server -np 2
  ollama-cloud:
    kind: openai_compat
    billing: free
    data_policy: no_log
    base_url_env: OLLAMA_URL
    base_url_default: "https://ollama.com"
    api_key_env: OLLAMA_API_KEY
    limits: { concurrency: 1 }
    terms: "Prompts never logged or trained on (ollama.com/pricing, checked 2026-09-12)"
  mistral:
    kind: openai_compat
    billing: free
    data_policy: may_train
    base_url_default: "https://api.mistral.ai"
    api_key_env: MISTRAL_API_KEY
    limits: { concurrency: 1 }
    terms: "Experiment (free) plan: inputs and outputs may be used to train Mistral models"
    # Owner's decision (2026-10-10): the Ollama Cloud free quota ran out, and
    # every private purpose may use Mistral rather than drop to local E4B.
    private_ok_for: [chat, subagent, background]
  openrouter:
    kind: openai_compat
    billing: free
    data_policy: may_train
    base_url_default: "https://openrouter.ai/api"
    api_key_env: OPENROUTER_API_KEY
    limits: { rpm: 20, rpd: 50, concurrency: 1 }
    terms: ":free endpoints — upstream providers may log and train on prompts; 50 requests/day without credits"
    # Owner's decision (2026-10-10), same as mistral. Sub-agents are still
    # refused here by the 50 requests/day limit, not by privacy.
    private_ok_for: [chat, subagent, background]
  anthropic:
    kind: anthropic
    billing: paid
    data_policy: no_log
    api_key_env: ANTHROPIC_API_KEY
    spend: { daily_usd: 1.00, monthly_usd: 10.00 }
    terms: "API inputs are not used for training by default. Outputs are never fine-tuning data (FINE_TUNING_PLAN)"
  gemini:
    kind: gemini
    billing: free
    data_policy: may_train
    api_key_env: GEMINI_API_KEY
    # No provider-wide rpm: Google's free-tier quotas are per model, per
    # project, so each gemini model below declares its own `limits`.
    terms: "Free tier: Google may use prompts and responses to improve its products"
    # Owner's decision (2026-09-26): private chat may use Gemini anyway — the
    # material it would see (résumé etc.) already lives in Google's cloud.
    # Chat only: background and sub-agent private work still stays on no_log.
    private_ok_for: [chat]

# ── selection_rank: which model a capability-routed step actually gets ────────
#
# `select_models` orders candidates `cost ASC, selection_rank ASC,
# context_window DESC`, and a step declaring `required_capabilities` takes the
# first row that survives the CLOUD_TIER filter. Every ollama and ollama-cloud
# entry below costs $0.0 — so for every routing decision the brain actually
# makes, cost decides nothing and **selection_rank is the choice**. Lower wins.
#
# It exists because the tiebreak used to be `context_window DESC` alone, which
# is a proxy for nothing anyone was trying to optimise. Adding
# `minimax-m3:cloud` on 2026-08-25 with a 524288 window therefore handed it
# every `reasoning` step in the system — the seven cloud-routed steps across
# chains/ and schedules/ — with no config change, no log line saying so, and no
# way to see it except in the usage ledger afterwards. It ran them at 20.2s
# against gemma4:31b-cloud's 5.6s. Nothing was misconfigured; the ordering was
# just answering a different question than the one being asked.
#
# Bands (the gaps are room to insert without renumbering):
#   0–9      free-tier Gemini treated as $0 — sits BELOW ollama-cloud so a
#            capability step prefers it at CLOUD_TIER=2. Only `gemini-2.5-flash`
#            lives here (rank 5); see the note in the Gemini block on why its
#            cost is 0.0 and how a 429 falls back down to the ollama-cloud tier.
#   10–99    ollama-cloud — the contested band, since these all tie at $0
#   100–109  free tiers that MAY TRAIN on prompts (Mistral, OpenRouter :free),
#            open to private work by `private_ok_for` (2026-10-10). Behind every
#            Ollama Cloud model, ahead of local: the cloud overflow when the
#            Ollama free quota is spent.
#   110–199  ollama local — also $0, so they compete with the above and lose at
#            tier 1 by design. Ranked anyway: three of them tie at 128000, so
#            tier 0 was previously picking between them arbitrarily.
#   210+     paid providers — cost already separates these; rank breaks ties
#            within a price point (the two gemini flash-lites are both 0.0005).
#
# Rank is global, not per-capability, so check every capability a model claims
# before moving it. The live example: `gemma4:31b-cloud` sits at 30 rather than
# lower because it is the vision winner, and at 30 the two gpt-oss entries
# still take `reasoning` ahead of it — which is what we want, since it is the
# one cloud model measured to return empty completions (1/4).
#
# Unranked entries sort behind every ranked one and keep the old
# widest-window order among themselves, so omitting the field is safe.
#
# ── orchestration: the model plans its own chat turn ─────────────────────────
#
# Not a routing capability (no step asks for it). It tells the front door's
# router (chat/route.rs) to stop helping: for a model without it, a picked
# behavior (`lookup:learned`, …) is fetched in code and `delegate` is taken
# away, because a small model ignored the rows and delegated anyway; for a
# model with it, the pick is only a hint and the model keeps `delegate`
# (2026-10-17, owner: Haiku 5.5 got a week's counts by topic and no tool to
# drill down with). Held by the Anthropic models. Give it to another model
# only after watching it run a few real front-door turns: the free fallbacks
# keep the behaviors, so a capped or failed pin still gets the help.
models:
  # ── Ollama Local (http://localhost:11434) ─────────────────────────────────────
  qwen3.5:4b:
    provider: ollama
    model: "qwen3.5:4b"
    context_window: 32768
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 140
    capabilities:
      - reasoning
      - code
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.

  nemotron-3-nano:4b:
    provider: ollama
    model: "nemotron-3-nano:4b"
    context_window: 128000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 130
    capabilities:
      - reasoning
      - tools
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.


  granite4:latest:
    provider: ollama
    model: "granite4:latest"
    context_window: 128000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 120
    capabilities:
      - reasoning
      - code
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.

  # The llama.cpp `llama-server` sidecar (LLAMACPP_URL, OpenAI-compatible), which
  # serves Gemma-4-E4B GPU-resident at ~3.3 GB (see llamacpp/Dockerfile). This is
  # the background-generation model; the entry exists so a chat/sub-agent PROFILE
  # can pin it (provider `llamacpp` → LlamaCpp @ LLAMACPP_URL, embeddings stay on
  # host Ollama). `model` is a ledger label — llama-server serves whatever GGUF it
  # launched with regardless. Local band (110–199); it never wins capability
  # routing over cloud on cost ties.
  gemma4-e4b:
    provider: llamacpp
    model: "gemma4-e4b"
    context_window: 16384
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 118
    capabilities:
      - fast

  gemma4:latest:
    provider: ollama
    model: "gemma4:latest"
    context_window: 128000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 110
    capabilities:
      - reasoning
      - code
      - vision
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.

  # Tool-integrated computation specialist. Paired with the `execute_code` tool:
  # a step that declares `required_capabilities: ["computation"]` routes here and
  # is expected to *emit Python and run it*, not narrate arithmetic in prose.
  #
  # `computation` is deliberately held by this model ALONE, which is what makes
  # its rank of 150 harmless — with one holder there is nothing to tie against.
  # Widen the capability and `selection_rank` starts deciding, and at 150 this
  # model loses to every cloud entry: a step meant to run Python would route to
  # a model that will narrate arithmetic instead. If a second model ever claims
  # `computation`, rank it above 150 only if you mean it. The capability is a
  # routing selector, not a description of aptitude.
  #
  # VRAM: 4.68 GB (Q4) on an 8 GB card that already holds gemma4 + Whisper, so
  # this model swaps rather than co-resides. That is the accepted cost of a
  # correct answer on checkable work; keep computation steps rare and batched.
  qwen2.5-coder:7b:
    provider: ollama
    model: "qwen2.5-coder:7b"
    context_window: 32768
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 150
    capabilities:
      - reasoning
      - code
      - computation
    temperature: 0.1
    system_prompt: |
      You are agent-brain's computation engine. You solve quantitative problems
      by WRITING AND RUNNING CODE, never by doing arithmetic in prose.

      For any calculation, projection, unit conversion, or data aggregation:
      call `execute_code` with a Python program that computes the result and
      prints it. Read the printed output and report that number. If the code
      errors, fix it and run again. Never state a figure you have not computed.

      State assumptions as named variables at the top of the program so the
      inputs behind a result are visible and checkable.

  # ── Ollama Cloud (https://ollama.com) ─────────────────────────────────────────
  # Every model here was verified reachable on the current (free) Ollama plan on
  # 2026-08-25 — a trial `/api/chat` call returned 200, and `/api/show` supplied
  # the context window and capabilities below rather than them being guessed.
  #
  # Models that answered `403 "this model requires a subscription"` (qwen3.5:cloud,
  # deepseek-v4-flash:cloud) or `404 "model not found"` (ministral-3:cloud,
  # nemotron-3-nano:cloud — superseded by nemotron-3-nano:30b-cloud) were removed:
  # a catalog entry that can only fail is worse than a missing one, because the
  # router will still pick it.
  #
  # `chat_fallback_ladder` at the foot of this file is what /chat walks when a
  # model produces nothing; order there is deliberate and measured, not the
  # order of this block.
  gpt-oss:120b-cloud:
    provider: ollama-cloud
    model: "gpt-oss:120b-cloud"
    context_window: 131072
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 10
    capabilities:
      - reasoning
      - code
      - fast
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.

  gpt-oss:20b-cloud:
    provider: ollama-cloud
    model: "gpt-oss:20b-cloud"
    context_window: 131072
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 20
    capabilities:
      - reasoning
      - code
      - fast
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
