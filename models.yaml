      before acting and use available tools for grounded answers.

  nemotron-3-ultra:cloud:
    provider: ollama-cloud
    model: "nemotron-3-ultra:cloud"
    context_window: 262144
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 60
    capabilities:
      - reasoning
      - code
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.

  nemotron-3-nano:30b-cloud:
    provider: ollama-cloud
    model: "nemotron-3-nano:30b-cloud"
    context_window: 262144
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 70
    capabilities:
      - reasoning
      - code
      - fast
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.

  # minimax-m3:cloud REMOVED 2026-08-31 — it left the free tier. A trial
  # /api/chat now answers `402 "this model requires a subscription or extra
  # usage"`, as do qwen3.5:397b, deepseek-v4-pro, deepseek-v4-flash,
  # mistral-large-3:675b, and every glm-5.x and kimi-k2/k3 entry that
  # /api/tags advertises. The seven models in this block are the whole of what
  # the free tier reaches, re-verified that day.
  #
  # Leaving it in the catalog was not neutral. `is_subscription_required` in
  # shared_llm.rs matches on "requires a subscription", so a 402 classifies as
  # unavailable and falls back to local gemma4:latest — the chain SUCCEEDS, the
  # weaker model writes the report, and it is stored as source_record with
  # nothing anywhere recording that the intended model was never reached. That
  # is the exact silent degradation scripts/pause_cloud_schedules.sh exists to
  # prevent, arriving through the catalog instead of through an outage.
  #
  # It was also the live routing target: the deployed binary orders candidates
  # `cost ASC, context_window DESC` with no selection_rank, and at 524288 this
  # was the widest window among the $0 models — so it won ALL SEVEN
  # `required_capabilities: ["reasoning"]` steps in chains/ and schedules/.

  gemma4:31b-cloud:
    provider: ollama-cloud
    model: "gemma4:31b-cloud"
    context_window: 262144
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 30
    capabilities:
      - reasoning
      - code
      - vision
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.

  # ── Anthropic (https://www.anthropic.com) ─────────────────────────────────
  #
  # `deep_reasoning` is held by claude-sonnet-5 ALONE, on purpose. Selection is
  # `cost ASC` first, so a paid model can never win a capability a $0 model also
  # holds — a step that should spend money must ask for a capability only the
  # paid model has. When the policy refuses it (ROUTING_PAID_FOR unset, the
  # daily/monthly spend cap reached), no candidate survives and the step falls
  # back to its own `provider_hint` (ollama-cloud → gpt-oss), so a spent budget
  # degrades the step rather than failing it. Steps that ask for it: the
  # synthesis `reason` in the five standing-investigation schedules (2026-10-02,
  # ~$0.15-0.20 per run at ~55K in / ~3K out).
  claude-sonnet-5:
    provider: anthropic
    model: "claude-sonnet-5"
    context_window: 1000000
    cost_per_1k_input: 0.002
    cost_per_1k_output: 0.010
    selection_rank: 315
    capabilities:
      - deep_reasoning
      - reasoning
      - code
      - vision
      - orchestration

  claude-sonnet-4-6:
    provider: anthropic
    model: "claude-sonnet-4-6"
    context_window: 200000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    selection_rank: 320
    capabilities:
      - reasoning
      - code
      - vision
      - fast
      - orchestration
    temperature: 0.5
    system_prompt: |
      You are agent-brain running on Claude Sonnet. Prioritize efficiency
      and tool use. Be concise.

  # Haiku 5.5 (2026-10-07; replaced Haiku 4.5 here 2026-10-17). $0.10 / $0.50
  # per MTok up to a 100K-token prompt, $0.50 / $2.50 above it, a tenth of
  # Haiku 4.5. The model reads 1M tokens, but the catalog holds one rate, so
  # context_window is the cheap tier's 100K: it sizes chat's tool-result
  # budget to stay under the step, and keeps the ledger's rate honest. Like
  # every 5-family model it rejects `temperature` (anthropic.rs NO_SAMPLING).
  claude-haiku-5-5:
    provider: anthropic
    model: "claude-haiku-5-5"
    context_window: 100000
    cost_per_1k_input: 0.0001
    cost_per_1k_output: 0.0005
    selection_rank: 310
    capabilities:
      - reasoning
      - code
      - fast
      - orchestration
    system_prompt: |
      You are agent-brain. Use tools efficiently and be concise.

  # ── Gemini (https://ai.google.dev/gemini) ─────────────────────────────────
  #
  # NOTE ON COST 0.0 FOR gemini-2.5-flash BELOW: the Gemini free tier bills
  # nothing — it caps at ~5 RPM / 1500 RPD and returns HTTP 429 rather than
  # charging (measured 2026-09-06; the per-minute cap, not the daily, is the
  # binding one). So on the free tier `cost 0.0` is *accurate*, not a fiction,
  # and it is what lets it compete with the $0 Ollama-Cloud models on
  # `selection_rank` instead of always losing on `cost ASC`. The `-lite` entries
  # below keep their real paid pricing because they are not the ones we route to.
  # If this deployment ever moves off the free tier, set a real cost on
  # `gemini-2.5-flash` or capability routing will keep billing for it ahead of
  # the free Ollama-Cloud tier. The 5 RPM cap is why Gemini is a reasoning-only
  # model here (1 call/step) and not the chat model (many calls/turn).

  # Was the reasoning winner at selection_rank 5 (below the ollama-cloud band)
  # until 2026-10-02; now 98, a fallback behind the ollama-cloud models — see
  # the note on selection_rank below. Vision is deliberately NOT claimed here so
  # vision steps stay on gemma4:31b-cloud.
  gemini-2.5-flash:
    provider: gemini
    model: "gemini-2.5-flash"
    limits: { rpm: 5 }   # per model; see the gemini provider note
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    # 2026-10-02: 98, behind every ollama-cloud model, so public reasoning goes
    # to gpt-oss:120b-cloud like private reasoning does. Measured over the week
    # to 10-02: gemini-2.5-flash failed 2 of 8 `reason` calls (503) at an
    # average 31s; gpt-oss:120b-cloud failed 0 of 79 calls, 9s on ~49K-token
    # reasoning prompts. Still ahead of local, so it remains a fallback.
    selection_rank: 98
    capabilities:
      - reasoning
      - code
      - fast
    system_prompt: |
      You are agent-brain, an autonomous AI agent backed by a persistent
      Neo4j knowledge graph. You can search notes, manage tasks, reason
      over stored knowledge, and use many other tools. Think step-by-step
      before acting and use available tools for grounded answers.

  # NOTE: gemini-3.8-flash and gemini-3.5-flash were added 2026-09-06 as the
  # /chat model and a chat-ladder step-down, then removed the same day. Gemini's
  # free tier is 5 requests/minute, and interactive chat is agentic (one model
  # call per tool round), so a single tool-using turn fired 8 Gemini calls in
  # 17s and 429'd mid-turn. Chat moved back to gpt-oss:120b-cloud (unmetered);
  # Gemini stays a background-reasoning provider (gemini-2.5-flash above, 1
  # call/step). Re-add a flash entry here only for a low-call-rate use.
  #
  # 2026-09-26: re-added for profile pinning only (chat orchestrator / voice).
  # Probed on the free-tier key that day with one tool-bearing request each:
  # 3.8-flash 4.3s, 3.6-flash 2.2s, 3.5-flash 12.9s, 3.5-flash-lite 3.9s — all
  # emitted a correct tool call. 3.7-flash answered 503 "high demand";
  # 3.1-pro-preview has a zero free-tier quota (429 on the first call);
  # 2.5-pro is closed to new users (404). selection_rank 300+ keeps them out of
  # capability routing: only a profile `model_preference` reaches them. Each
  # carries its own `rpm: 5` (per-model budget counters, 2026-09-26), so the
  # voice, the orchestrator and background reasoning no longer share one bucket.
  # 5 is 2.5-flash's measured cap applied as a guess; a 429 still sets a cooldown.
  gemini-3.8-flash:
    provider: gemini
    model: "gemini-3.8-flash"
    limits: { rpm: 5 }   # per model; see the gemini provider note
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 300
    capabilities: [reasoning, code, fast]
  gemini-3.6-flash:
    provider: gemini
    model: "gemini-3.6-flash"
    limits: { rpm: 5 }   # per model; see the gemini provider note
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 301
    capabilities: [reasoning, code, fast]
  gemini-3.5-flash:
    provider: gemini
    model: "gemini-3.5-flash"
    limits: { rpm: 5 }   # per model; see the gemini provider note
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    selection_rank: 302
    capabilities: [reasoning, code, fast]
