      # ── /chat fallback ladder ─────────────────────────────────────────────────────
# Walked in order when a chat turn produces nothing the user can see — an empty
# completion, a 403/429, a 5xx, an unreachable host. Each name must be a key in
# `models` above; unknown names are dropped with a warning at startup, and the
# active chat model is skipped if it appears here (it is always tried first).
#
# A model is only tried when the previous one streamed NOTHING. Once any token,
# tool call, or message has reached the client the turn belongs to that model —
# switching mid-turn would replay tool calls and duplicate output.
#
# Order is measured, not alphabetical. Each entry below ran the same 12k-token
# tool-calling prompt four times on 2026-08-25:
#
#   model                       empty  tool_call  avg latency
#   gpt-oss:120b-cloud           0/4      4/4        1.8s   ← now the active chat model
#   nemotron-3-super:cloud       0/4      4/4       12.4s
#   gpt-oss:20b-cloud            0/4      4/4        8.0s
#   minimax-m3:cloud             0/4      3/4       11.7s   (1/4 answered in text)
#   nemotron-3-ultra:cloud       0/4      4/4       19.4s
#   nemotron-3-nano:30b-cloud    0/4      4/4       23.4s
#   gemma4:31b-cloud             1/4      3/4        7.0s   ← the empty-completion bug
#
# nemotron-3-super sits at #2 rather than gpt-oss:20b so the first fallback is a
# different model family: gpt-oss:20b shares 120b's chat template, and the
# failure being escaped is a template-parsing bug, so it is the rung least
# likely to behave differently.
#
# Two rungs were REMOVED on 2026-08-31:
#
#   minimax-m3:cloud       left the free tier — answers 402 (see the models
#                          block above). A rung that can only fail turns one
#                          failure into two at the moment something is already
#                          broken, which is the whole point of the ladder.
#   nemotron-3-ultra:cloud too slow to be a chat rung. Re-measured 2026-08-31
#                          on a real 7.8k-char watch-report payload: **299s**,
#                          against this file's own `timeout_secs: 120`. It is
#                          kept in the catalog — on that same run it was the
#                          only model to apply the report's date gate
#                          correctly (see the table below) — but a ladder rung
#                          that stalls past the timeout is worse than none,
#                          because the user is already waiting on a turn that
#                          failed once.
#
# ── Second measurement, 2026-08-31: a real `reason` payload, not a chat prompt
#
# The table above measures chat tool-calling. The eight cloud steps in chains/
# and schedules/ are all `reason` over a distilled research payload — different
# work, so it was measured separately: the live off-grid watch prompt plus its
# real prior report and three live SearXNG sweeps (7776 chars in), one run each.
#
#   model                      sec    out_chars  urls  date gate
#   nemotron-3-ultra:cloud    299.3      5319     24   PASS
#   gpt-oss:120b-cloud        276.5      8233     14   fail (passed on a rerun)
#   nemotron-3-super:cloud    122.5      3584     11   fail
#   gpt-oss:20b-cloud          75.2      6090     18   fail
#   nemotron-3-nano:30b-cloud  24.9      5128     14   fail
#   gemma4:31b-cloud           17.6      2757      7   fail (thinnest output)
#
# "date gate" = did MOVERS contain only items dated after the prior report.
# Read it as a prompt finding, not a model ranking. The prompt states the
# 12-month recency gate explicitly and EVERY model applied that one correctly;
# the "newer than the prior report" rule is only implied by the section being
# called DELTA, and most models did not infer it. Fix the prompt before
# swapping models over this. Sample size is 1–2 runs per model — enough to
# rule nemotron-3-ultra out on latency, not enough to rank the rest on quality.
#
# Latency here tracks how much each model chose to write far more than raw
# speed (gpt-oss:120b was slowest-but-one and also longest). Production
# `reason` calls have historically averaged ~6s, so these are upper bounds on
# a deliberately long report, not typical step latency.
#
# gemma4:31b-cloud is deliberately absent — it is the model that produces the
# empty completions this ladder exists to survive. It stays in the catalog
# because it is the only free-tier vision model and may still be chosen
# explicitly, but it is never a destination for a failed turn.
#
# granite4:latest is last and is local: it is slower and weaker than every cloud
# rung, and it is the only one that still answers when ollama.com is down. It is
# granite4 (not gemma4) because granite4 is the model that fits this 8 GB GPU;
# gemma4:latest is 9.86 GB and thrashes. The local rung is given a real num_ctx
# in resolve_chat_fallback_ladder (Ollama defaults to 4096, which truncates a
# real ~20k-token chat turn to a fragment and produces a degraded answer — the
# 2026-09-09 "apply to #N gave a generic refusal" incident).
#
# No Gemini rungs here on purpose: the active chat model is gpt-oss:120b-cloud
# (unmetered), and Gemini's free tier is 5 requests/minute — a single agentic
# chat turn makes one model call per tool round and would blow that cap, so a
# Gemini rung is more likely to 429 than to rescue a turn. Gemini stays a
# background-reasoning model (1 call/step), not a chat rung. See docker-compose
# CHAT_LLM_MODEL for the 2026-09-06 measurement.
#
# Mistral and OpenRouter rungs (2026-10-10): the Ollama Free usage limit is
# account-wide, so when it is spent every ollama-cloud rung above 429s at once
# (the budget then benches the whole provider, see services/budget.rs) and the
# turn used to land on granite4. The may_train rungs sit between the two; their
# owner's `private_ok_for` override is what lets a private turn use them.
# OpenRouter's 50 requests/day is metered by the budget and refused for
# sub-agent loops, so it is the last cloud rung.
chat_fallback_ladder:
  - gpt-oss:120b-cloud
  - nemotron-3-super:cloud
  - gpt-oss:20b-cloud
  - nemotron-3-nano:30b-cloud
  - ministral-14b-latest
  - codestral-latest
  - "nvidia/nemotron-3-super-120b-a12b:free"
  - granite4:latest

# ── Background fallback ladder ────────────────────────────────────────────────
# Cloud rungs a background `generate()` (queue steps, `reason`, capability-
# routed calls) walks after its primary and the active model fail as
# unavailable (429, 5xx, transport) or are refused, before it drops to the
# local model. Each rung is judged by the routing policy for the step's purpose
# and data_class, like every other rung. Before 2026-10-10 the chain went
# straight from Ollama Cloud to local E4B.
background_fallback_ladder:
  - ministral-14b-latest
  - codestral-latest
  - "nvidia/nemotron-3-super-120b-a12b:free"
  - "google/gemma-4-31b-it:free"
