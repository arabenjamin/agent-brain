# models.yaml — Model catalog and context configuration
# This file is the single source of truth for model definitions.
# Loaded into DuckDB at startup for fast runtime queries.
# Add a model here and restart (or call reload_models) to make it available.

defaults:
  temperature: 0.7
  max_tokens: 4096
  timeout_secs: 120

# ── selection_rank: which model a capability-routed step actually gets ────────
#
# `select_models` orders candidates `cost ASC, selection_rank ASC,
# context_window DESC`, and a step declaring `required_capabilities` takes the
# first row that survives the CLOUD_TIER filter. Every ollama and ollama-cloud
# entry below costs $0.0 — so for every routing decision the brain actually
# makes, cost decides nothing and **selection_rank is the choice**. Lower wins.
#
# It exists because the tiebreak used to be `context_window DESC` alone, which
# is a proxy for nothing anyone was trying to optimise. Adding
# `minimax-m3:cloud` on 2026-08-25 with a 524288 window therefore handed it
# every `reasoning` step in the system — the seven cloud-routed steps across
# chains/ and schedules/ — with no config change, no log line saying so, and no
# way to see it except in the usage ledger afterwards. It ran them at 20.2s
# against gemma4:31b-cloud's 5.6s. Nothing was misconfigured; the ordering was
# just answering a different question than the one being asked.
#
# Bands (the gaps are room to insert without renumbering):
#   10–99    ollama-cloud — the contested band, since these all tie at $0
#   110–199  ollama local — also $0, so they compete with the above and lose at
#            tier 1 by design. Ranked anyway: three of them tie at 128000, so
#            tier 0 was previously picking between them arbitrarily.
#   210+     paid providers — cost already separates these; rank breaks ties
#            within a price point (the two gemini flash-lites are both 0.0005).
#
# Rank is global, not per-capability, so check every capability a model claims
# before moving it. The live example: `gemma4:31b-cloud` sits at 30 rather than
# lower because it is the vision winner, and at 30 the two gpt-oss entries
# still take `reasoning` ahead of it — which is what we want, since it is the
# one cloud model measured to return empty completions (1/4).
#
# Unranked entries sort behind every ranked one and keep the old
# widest-window order among themselves, so omitting the field is safe.
models:
  # ── Ollama Local (http://localhost:11434) ─────────────────────────────────────
