# Retrieval golden set — the ground truth for `cargo run -- eval-retrieval`.
#
# WHY THIS FILE EXISTS
#   Every knob in KnowledgeService::search_notes_inner — the 0.7/0.3 freshness
#   weights, RRF k=60, chunk→parent resolution, the candidate pool size, and the
#   choice of embedding model — is set by intuition. This file is how a change to
#   any of them becomes a NUMBER instead of an argument: run the eval, change one
#   thing, run it again, watch recall@k and MRR move.
#
# HOW A CASE IS SCORED
#   A case is a HIT if ANY of its `expect_ids` or `expect_substrings`
#   (case-insensitive) appears in the top-k results for its `query`. Each case
#   below carries BOTH on purpose: the id is exact but churns if the note is ever
#   re-ingested; the substring survives id churn and re-embeds, which is exactly
#   the change (e.g. swapping the embedding model) you most want to keep
#   measuring across.
#
# HOW TO GROW / REFRESH IT
#   `cargo run -- eval-retrieval --bootstrap 25 > /tmp/proposed.yaml`
#   samples 25 notes and writes proposed cases whose query is a phrase lifted
#   from the note (that only tests the retrieval FLOOR). Rewrite each `query`
#   into what a person would actually ask, then paste the good ones below.
#
# GROUND TRUTH IS HUMAN. The brain must never generate these labels itself — it
# would be grading retrieval against what retrieval already surfaced, which is
# circular and scores 1.0 forever. The cases below were curated against the live
# graph on 2026-08-31; re-verify ids after any migration that rewrites notes.

cases:
  # ── Supply-chain / hardware standing reports (source_record) ───────────────
  - query: "What is the current status of HBM memory and CoWoS advanced packaging supply?"
    expect_ids: ["0572fc54-e557-4b8b-9190-cbb74246adfe"]
    expect_substrings: ["Hardware tripwire"]
    note: "Should surface a hardware-tripwire report, not an unrelated note."

  - query: "What tier-2 and tier-3 supply-chain dependencies are we tracking for AI accelerators?"
    expect_ids: ["dadd040b-9e96-44ce-a662-6b099598e7f2"]
    expect_substrings: ["Secondary Supply Chain"]

  - query: "Which small language models are moving on the benchmark leaderboards?"
    expect_ids: ["3e9a6be6-3e68-469f-aece-e95cf94e59d3"]
    expect_substrings: ["Intelligence Index"]
    note: "SLM benchmark watch. Any slm_benchmark_watch note is a valid hit."

  - query: "Is there a proven correlation between HBM/CoWoS shortages and small-model adoption?"
    expect_substrings: ["INSUFFICIENT EVIDENCE"]
    note: >
      The documented failure: the synthesis concluded INSUFFICIENT EVIDENCE, and
      an unsourced note later inverted it to "clear correlation" at high
      confidence. Retrieval must surface the sourced synthesis, not the
      free-associated one. The hard, contested case.

