# Routing golden set (GRAPH_CONTEXT_PLAN Phase 3): which agent or tool a chat
# turn should go to.
#
# WHERE THE CASES COME FROM
#   Real chat turns, verbatim, mined from DuckDB `interactions` 2026-06-12 to
#   2026-10-12 (324 turns, 149 distinct questions). A turn runs from its
#   push_context (role user) to the "Chat turn [session: …]" note the chat
#   stores; model_usage `subagent:<agent>` rows in that window name the agents.
#   Dropped: pings ("Say OK", "PONG"), turns that name the tool to call, and
#   wording repeats beyond a few variants. Scratch harness: phase3/mine_turns.py.
#
# FIELDS
#   question   the owner's words, verbatim.
#   after      for a follow-up: the turn before it, which the router sees too.
#   source     when it was asked, and how often (xN).
#   brain_did  agents and tools from the last time it was asked (profile in
#              brackets; `general` held every tool itself, before the front door
#              delegated).
#   route      where it should go first: an agent (knowledge-worker, researcher,
#              deep-diver, code-analyst, schedule-author, scribe, api-integrator,
#              api-scout, job-applicant, toolsmith), the front door's own tool
#              (self:manage_todo, self:manage_workflow, self:create_task,
#              self:list_tasks), or answer (no tool: talk, arithmetic, opinion
#              on what is already in the conversation).
#   first_tool inside the agent: the tool it should call first (lookup with
#              its view, search_notes, search_web, list_capabilities, ...).
#   always     a check that runs whatever the confidence (the part about us).
#   then       the next step when the first comes back thin: the order for a
#              loose question (the brain's own names, then what is stored, then
#              the web).
#   check      for `route: answer` on a factual question (the owner's rule,
#              2026-10-14): answer from what the model knows with a confidence;
#              below `below` (0.85, to be calibrated on this set), check `then`
#              in order. A question about us, or about facts that change (news,
#              versions, prices, "latest"), always checks.
#   readings   for an ambiguous turn: the plausible readings, most likely first.
#   decide     a choice the owner makes while grading.
#   status     draft | accepted | fixed | dropped.
#
# GROUND TRUTH IS HUMAN: the owner grades every case.

agents_seen_2026_10_14: [api-integrator, api-scout, code-analyst, deep-diver, deep-diver-hard, job-applicant, knowledge-worker, researcher, schedule-author, scribe, toolsmith]

