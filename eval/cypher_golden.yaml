      SELECT engine, count(*) AS searches FROM search_usage
      WHERE timestamp >= now() - INTERVAL 3 DAY GROUP BY engine ORDER BY searches DESC
    decide: keep telemetry cases in this set so the gate learns a fourth answer
    status: draft

