  - id: where-semantic-notes-went
    question: "can you check the database and see where all our semantic notes went"
    source: chat 2026-03-30
    context: graph
    brain_did: []
    reference: |
      MATCH (n:Note)
      WHERE n.retyped_from = 'semantic' OR n.original_note_type = 'semantic'
      RETURN n.note_type AS now, n.retyped_reason AS why, count(*) AS notes
      ORDER BY notes DESC
    decide: the 2026-03 answer was a pruning bug; today the trail is the retype fields
    status: draft

  # ── Sources: videos, news briefs, monitors ─────────────────────────────────
  - id: videos-today
    question: "Can you summarize all the Youtube videos you watched today?"
    source: chat 2026-09-11
    context: graph
    brain_did: [describe_graph, neo4j_query, reason, recall_recent]
    reference: |
      MATCH (m:Media)-[:FROM_SOURCE]->(s:MediaSource)
      WHERE m.ingested_at >= datetime({date: date({timezone: 'America/Detroit'}), timezone: 'America/Detroit'})
        AND m.url CONTAINS 'youtube.com'
      OPTIONAL MATCH (c:Note {note_type: 'claim'}) WHERE c.source_url = m.url
      WITH s, m, collect(c.content)[..3] AS claims
      ORDER BY m.ingested_at
      RETURN s.name AS channel, m.title AS title, m.url AS url, claims
    status: draft

  - id: video-notes-today
    question: "Can you Summarize all notes from the video_learning source context today ?"
    source: chat 2026-09-12
    context: graph
    brain_did: [recall_recent, search_notes]
    reference: |
      MATCH (n:Note {source_context: 'video_learning'})
      WHERE n.created_at >= datetime({date: date({timezone: 'America/Detroit'}), timezone: 'America/Detroit'})
      RETURN n.note_type AS type, n.source_title AS video, n.content AS content
      ORDER BY n.created_at
    status: draft

  - id: latest-news-brief
    question: "Can you look in the graph and get the latest daily news brief?"
    source: chat, asked 15+ times 2026-04 (no logging then)
    context: graph
    brain_did: []
    reference: |
      MATCH (n:Note {source_context: 'scheduled_daily_news_brief', note_type: 'news'})
      RETURN n.created_at AS at, n.content AS brief
      ORDER BY n.created_at DESC LIMIT 1
    status: draft

  - id: news-brief-on-date
    question: "Is there a news brief for April 16, 2026"
    source: chat 2026-04-16
    context: graph
    brain_did: []
    reference: |
      MATCH (n:Note {source_context: 'scheduled_daily_news_brief', note_type: 'news'})
      WHERE n.created_at >= datetime({year: 2026, month: 4, day: 16, timezone: 'America/Detroit'})
        AND n.created_at < datetime({year: 2026, month: 4, day: 17, timezone: 'America/Detroit'})
      RETURN n.created_at AS at, left(n.content, 300) AS brief
    decide: the right answer is empty (briefs exist for 2026-04-14 and -15 only), and saying so is the test
    status: draft

  - id: all-news-briefs
    question: "Can you look at all of the news briefs in the graph and summarize them for me?"
    source: chat 2026-06-09, 2026-06-18, 2026-07-17
    context: graph
    brain_did: [search_notes]
    reference: |
      MATCH (n:Note {source_context: 'scheduled_daily_news_brief', note_type: 'news'})
      RETURN n.created_at AS at, n.content AS brief
      ORDER BY n.created_at
    decide: all 128 briefs is a map-reduce job, not one context; the query is right, the size is not
    status: draft

