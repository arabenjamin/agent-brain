      ORDER BY c.verified_at DESC
    status: draft

  - id: claims-2d
    question: "Yeah lets see all claim notes from the last 2 days"
    source: chat 2026-09-12
    context: graph
    brain_did: [describe_graph, neo4j_query, recall_recent, search_notes]
    reference: |
      MATCH (c:Note {note_type: 'claim'})
      WHERE c.created_at >= datetime() - duration('P2D')
      RETURN c.created_at AS at, c.content AS claim, c.claim_status AS status, c.source_context AS from
      ORDER BY c.created_at DESC
    status: draft

  - id: claim-evidence-shutdown-button
    question: 'Biden administration now requires an "emergency-shutdown button" for powerful AI models. Can you tell me more about that, and what evidence do we have to support that?'
    source: chat 2026-09-20
    context: both
    brain_did: [search_notes]
    reference: |
      MATCH (c:Note {note_type: 'claim'})
      WHERE toLower(c.content) CONTAINS 'emergency' AND toLower(c.content) CONTAINS 'shutdown'
      OPTIONAL MATCH (c)-[r:CORROBORATED_BY|CONTRADICTED_BY]->(e:Note)
      RETURN c.content AS claim, c.claim_status AS status, type(r) AS edge, e.source_url AS evidence
    decide: finding the claim is by meaning (here a word match stands in); its evidence is structure. The stored claims name Governor Newsom (California), not the Biden administration, so the right context corrects the question
    status: draft

  - id: nhi-mj12-true
    question: "Can you tell me more about we have learned about NHI/MJ-12 ? Is any of that true?"
    source: chat 2026-09-24
    context: both
    brain_did: [search_notes]
    reference: |
      MATCH (e:Entity)<-[:MENTIONS]-(c:Note {note_type: 'claim'})
      WHERE e.name IN ['mj-12', 'nhi/mj-12']
      RETURN e.name AS entity, c.content AS claim, c.claim_status AS status, c.corroborating_count AS corroborated_by
    decide: the stored entities are mj-12 and nhi/mj-12; matching by entity misses claims that only say it in words
    status: draft

