# Cypher golden set (GRAPH_CONTEXT_PLAN Phase 0): what context a question needs,
# and the query that fetches it.
#
# WHERE THE CASES COME FROM
#   Real chat questions, verbatim from WorkingMemory (2026-02 to 2026-10). Workflow
#   cases are the purpose of a workflow query that the logs show running.
#   `brain_did` is what the chat turn called, from DuckDB `interactions`
#   (retrieval tools only, from the 10 minutes after the turn; logging starts
#   2026-06-12, so earlier turns show nothing).
#
# FIELDS
#   context    graph | meaning | both | telemetry | none: what the question
#              needs. graph = a structural query answers it; meaning = vector/BM25
#              retrieval; both = one anchors the other; telemetry = DuckDB, not the
#              graph; none = no stored context.
#   reference  the query that fetches the right context (graph and both cases).
#              It is scored by its rows, not its text: a candidate passes when
#              it returns the same rows (column names and order aside).
#   decide     a choice the owner makes while grading (what counts as "learned",
#              which statuses are "running").
#   status     draft (proposed, not graded) | accepted | fixed | dropped.
#
# GROUND TRUTH IS HUMAN: the owner grades every case. Times are UTC in the graph;
# "today" is the local day (TZ America/Detroit), as the clock service says it.

cases:
  # ── What did we learn (time windows over notes) ────────────────────────────
  - id: learned-today
    question: "What have we learned today?"
    source: chat, asked 40+ times 2026-08 to 2026-10
    context: graph
    brain_did: [recall_recent] # also search_notes, neo4j_query, list_notes on other days
    reference: |
      MATCH (n:Note)
      WHERE n.created_at >= datetime({date: date({timezone: 'America/Detroit'}), timezone: 'America/Detroit'})
        AND n.note_type IN ['semantic', 'claim', 'source_record', 'news', 'reflection', 'inference']
      RETURN n.note_type AS type, n.source_context AS from, n.content AS content
      ORDER BY n.created_at DESC
    decide: which note types count as "learned" (episodic, outcome and unsourced_synthesis are left out here); the context is the notes, not counts of them
    status: draft

  - id: learned-24h
    question: "What have we learned in the last 24 hrs?"
    source: chat 2026-10-02
    context: graph
    brain_did: [recall_recent]
    reference: |
      MATCH (n:Note)
      WHERE n.created_at >= datetime() - duration('PT24H')
        AND n.note_type IN ['semantic', 'claim', 'source_record', 'news', 'reflection', 'inference']
      RETURN n.note_type AS type, n.source_context AS from, n.content AS content
      ORDER BY n.created_at DESC
    status: draft

  - id: learned-two-weeks
    question: "What have we learned in the last two weeks?"
    source: chat 2026-08-31
    context: graph
    brain_did: [neo4j_query, search_notes]
    reference: |
      MATCH (n:Note)-[:IN_TOPIC]->(t:Topic)
      WHERE n.created_at >= datetime() - duration('P14D')
        AND n.note_type IN ['semantic', 'claim', 'source_record', 'news', 'reflection', 'inference']
      RETURN t.name AS topic, count(DISTINCT n) AS notes
      ORDER BY notes DESC
    decide: by topic (as here) or by source; two weeks is thousands of notes, so the context has to be a summary shape (counts here), and a candidate returning notes scores 0 against it
    status: draft

  - id: learned-this-month
    question: "Can you tell me what you have learned this month?"
    source: chat 2026-08-16
    context: graph
    brain_did: [list_tasks, neo4j_query, search_notes]
    reference: |
      WITH date({timezone: 'America/Detroit'}) AS today
      MATCH (n:Note)-[:IN_TOPIC]->(t:Topic)
      WHERE n.created_at >= datetime({year: today.year, month: today.month, day: 1, timezone: 'America/Detroit'})
        AND n.note_type IN ['semantic', 'claim', 'source_record', 'news', 'reflection', 'inference']
      RETURN t.name AS topic, count(DISTINCT n) AS notes
      ORDER BY notes DESC
    status: draft

  - id: learned-september
    question: "IS there nothing new we have learned in september?"
    source: chat 2026-09-24
    context: graph
    brain_did: [neo4j_query]
    reference: |
      MATCH (n:Note)
      WHERE n.created_at >= datetime({year: 2026, month: 9, day: 1, timezone: 'America/Detroit'})
        AND n.created_at < datetime({year: 2026, month: 10, day: 1, timezone: 'America/Detroit'})
        AND n.note_type IN ['semantic', 'claim', 'source_record', 'news', 'reflection', 'inference']
      RETURN n.note_type AS type, count(*) AS notes
      ORDER BY notes DESC
    status: draft

  - id: notes-stored-today
    question: "In one sentence: how many notes did we store today?"
    source: chat 2026-09-24
