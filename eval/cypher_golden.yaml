      WHERE n.created_at >= datetime({date: date({timezone: 'America/Detroit'}), timezone: 'America/Detroit'})
      RETURN count(n) AS notes
    status: draft

  - id: notes-stored-by-type
    question: "Can you tell me what notes we have stored?"
    source: chat 2026-03-29
    context: graph
    brain_did: []
    reference: |
