      RETURN n.created_at AS at, n.note_type AS type, n.source_context AS from, left(n.content, 300) AS content
      ORDER BY n.created_at DESC LIMIT 30
    decide: also list the NIA workflows (topic nia) and their last runs?
    status: draft

  # ── The brain itself ───────────────────────────────────────────────────────
  - id: tool-count
    question: "How many tools does the brain have right now?"
    source: chat 2026-09-12, 2026-10-02, 2026-10-06
    context: graph
    brain_did: [list_capabilities]
    reference: |
      MATCH (t:ToolDef)
      RETURN count(t) AS tools
    decide: ToolDef is synced from the live registry at startup; list_capabilities is the tool for this
    status: draft

  - id: agent-count
