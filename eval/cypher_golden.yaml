    source: chat 2026-09-12
    context: graph
    brain_did: [search_notes]
    reference: |
      MATCH (p:ContextProfile {spawnable: true})
      RETURN p.name AS agent, p.specialty AS specialty
      ORDER BY agent
    status: draft

  - id: apis-known
    question: "Can you tell me what Api's we have in the graph?"
    source: chat 2026-09-10, 2026-09-12
    context: graph
    brain_did: [search_notes]
    reference: |
      MATCH (a:ApiContext)
      OPTIONAL MATCH (a)-[:EXPOSES]->(e:ApiEndpoint)
      RETURN a.name AS api, a.base_url AS base_url, count(e) AS endpoints
      ORDER BY api
    status: draft

  - id: homeassistant-endpoints
    question: "What endpoints do we have for HomeAssistant"
    source: chat 2026-09-11
    context: graph
    brain_did: [list_apis, neo4j_query]
    reference: |
      MATCH (:ApiContext {name: 'home_assistant'})-[:EXPOSES]->(e:ApiEndpoint)
      RETURN e.method AS method, e.path AS path, e.summary AS summary
      ORDER BY path
    decide: the stored name is home_assistant; "HomeAssistant" as typed matches nothing
    status: draft

  - id: consolidation-schedule
    question: "How often do the consolidation tasks run?"
    source: chat 2026-04-03
    context: graph
    brain_did: []
    reference: |
      MATCH (w:Workflow {name: 'consolidate'})
      RETURN w.interval_seconds AS every_seconds, w.enabled AS enabled, w.last_run_at AS last_run, w.next_run_at AS next_run, w.description AS what
    decide: consolidate has no interval or run times stored; it runs from idle sleep, which the graph does not say
    status: draft

  - id: daily-news-fired
    question: "Can you look and see if the daily news brief task fired yet?"
    source: chat 2026-04-14
    context: graph
    brain_did: []
    reference: |
      MATCH (t:Task {workflow: 'daily-news'})
      RETURN t.created_at AS at, t.status AS status
      ORDER BY t.created_at DESC LIMIT 3
    status: draft

  - id: last-5-tasks
    question: "Can you tell me the last 5 tasks that ran?"
    source: chat 2026-09-11
    context: graph
    brain_did: [search_notes]
    reference: |
      MATCH (t:Task)
      RETURN t.updated_at AS at, coalesce(t.workflow, left(t.goal, 80)) AS task, t.status AS status
      ORDER BY t.updated_at DESC LIMIT 5
    status: draft

  - id: stuck-tasks
    question: "There seems to be a task stuck in progress, can you look and see whats holding it up?"
    source: chat 2026-04-16
    context: graph
    brain_did: []
    reference: |
      MATCH (j:AgentJob)
      WHERE j.status IN ['running', 'queued', 'parked']
      RETURN j.status AS status, j.tool_name AS tool, j.started_at AS started, j.attempt_count AS attempts, j.error AS error
      ORDER BY j.created_at
    decide: which statuses mean stuck; today the graph holds only completed, dead and dead_letter jobs
    status: draft

  - id: jobs-in-queue
    question: "Can you tell me what tasks are in the queue?"
    source: chat 2026-03-30
    context: graph
    brain_did: []
    reference: |
      MATCH (j:AgentJob)
      WHERE NOT j.status IN ['completed', 'dead', 'dead_letter']
      RETURN j.status AS status, j.tool_name AS tool, j.priority AS priority, j.created_at AS queued
      ORDER BY j.priority, j.created_at
    status: draft

  - id: workflows-broken-tools
    question: "Audit all scheduled tasks for broken tool names."
    source: chat 2026-04-19
    context: graph
    brain_did: []
    reference: |
      MATCH (w:Workflow)
      WITH w, [m IN split(w.steps, '"tool_name":"')[1..] | split(m, '"')[0]] AS tools
      UNWIND tools AS tool
      WITH w, tool WHERE NOT EXISTS { MATCH (:ToolDef {name: tool}) }
      RETURN w.name AS workflow, collect(DISTINCT tool) AS unknown_tools
    decide: steps is a JSON string (key tool_name) and there is no APOC; this string split is fragile (the spec should own it)
    status: draft

  # ── Todos (workflow queries that ran for months) ───────────────────────────
  - id: todos-open
    question: "Can you see the todo list?"
    source: chat 2026-08-12; todo-snapshot workflow
    context: graph
    brain_did: []
    reference: |
      MATCH (t:Todo)
      WHERE t.status IN ['pending', 'in_progress']
      RETURN t.title AS title, t.priority AS priority, t.due_at AS due, t.status AS status
      ORDER BY t.priority, t.due_at
    status: draft

  - id: todos-overdue
    question: "Which of my todos are overdue?"
    source: overdue-todo-review workflow; its query compared due_at to toString(date()) from 2026-06 to 2026-09 and returned nothing 172 of 179 times
    context: graph
    brain_did: [neo4j_query]
    reference: |
      MATCH (t:Todo)
      WHERE t.status IN ['pending', 'in_progress']
        AND t.due_at IS NOT NULL
        AND date(t.due_at) < date({timezone: 'America/Detroit'})
      RETURN t.title AS title, t.due_at AS due
      ORDER BY t.due_at
    status: draft

  # ── Telemetry, not the graph ───────────────────────────────────────────────
