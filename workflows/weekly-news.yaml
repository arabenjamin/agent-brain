name: weekly-news
description: "Weekly synthesis of major news themes across world, technology, and business."
# topic: none — spans topics on purpose
kind: brief
every: 1w
steps:
  - tool_name: search_web
    arguments:
      query: "latest major world news (site:apnews.com OR site:reuters.com OR site:bbc.com)"
      recency: week
      news: true
      count: 10
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest AI technology breakthroughs (site:techcrunch.com OR site:wired.com)"
      recency: week
      news: true
      count: 10
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest business economy politics news (site:ft.com OR site:bloomberg.com)"
      recency: week
      news: true
      count: 10
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: reason
    arguments:
      question: "Write a weekly news synthesis with top 3 stories per category (world, technology, business/politics), emerging themes across categories, and one trend to watch next week. Cite sources with URLs."
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    provider_hint: ollama

  - tool_name: store_note
    arguments:
      content: "{{_prev}}"
      note_type: news
      source_context: scheduled_weekly_news_brief
    priority: 1
    max_attempts: 2
    provider_hint: ollama
