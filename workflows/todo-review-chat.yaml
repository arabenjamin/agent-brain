name: todo-review-chat
description: "Reviews pending todos daily, asks the user clarifying questions, and opens a dedicated chat session for follow-up."
# topic: none — spans topics on purpose
kind: brief
# Why: dev_docs get yaml/schedules-todo-review-chat-1
enabled: false
every: 1d
steps:
  # Why: dev_docs get yaml/schedules-todo-review-chat-2
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (t:Todo) WHERE t.status IN ['pending','in_progress'] RETURN t.id AS id, t.title AS title, t.description AS description, t.priority AS priority, t.status AS status, t.due_at AS due_at ORDER BY t.priority ASC, t.created_at ASC LIMIT 15"
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: reason
    arguments:
      question: |
        You are reviewing the user's outstanding todos for {{date}}. Here is the current list:

        {{_prev}}

        Write a friendly, concise message to the user (under 250 words) that:
        1. Opens with a brief summary of what's on their plate (number of items, any urgent/overdue ones).
        2. Picks the 1-2 highest-priority or most unclear todos and asks a specific clarifying question for each — e.g. what does completion look like, are there blockers, should you start on it now?
        3. Closes with an offer to help with any of them.

        If there are no outstanding todos, say so warmly and ask if the user wants to add anything.

        Write directly to the user (second person). Do not use bullet-point headers for the questions — keep it conversational.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    provider_hint: ollama

  - tool_name: notify_user
    arguments:
      message: "{{_prev}}"
      context: "Todo Review {{date}}"
      related_session_id: "todos-{{date}}"
    priority: 2
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "todos-{{date}}"
      content: "{{_prev}}"
      role: assistant
    priority: 1
    max_attempts: 2
    provider_hint: ollama
