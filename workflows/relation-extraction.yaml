# Why: dev_docs get yaml/schedules-relation-extraction-1
name: relation-extraction
description: "Every 30 minutes: reads up to 30 claims that name two or more entities and proposes the relationships they state (works for, leads, member of, …) for the user's review. Rejected ones are never proposed again."
kind: maintenance
# topic: none — spans topics on purpose
every: 30m
steps:
  - tool_name: extract_relations
    arguments:
      limit: 30
    model: gpt-oss:120b-cloud
    provider_hint: ollama-cloud
    priority: 3
    max_attempts: 1
    description: "Propose the relationships 30 claims state"
