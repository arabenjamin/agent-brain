# ReliefWeb (UN OCHA) reports — ETL configuration (read at runtime from DATASETS_DIR).
#
# Situation reports, assessments, maps and news from UN agencies, governments
# and NGOs on humanitarian crises. Keyless: every call carries a pre-approved
# `appname` (env var named below). Quotas: 1,000 calls/day, 1,000 entries/call.
# The sync stays far below that so interactive use never meets the ceiling.
name: reliefweb
api_url: https://api.reliefweb.int/v2/reports
appname_env: RELIEFWEB_APPNAME
retention_days: 365
initial_backfill_days: 30
page_size: 1000
# Calls one sync run may make; a backlog clears over successive runs.
max_calls_per_run: 5
# Hard ceiling for all syncs in a UTC day (ReliefWeb's own limit is 1,000).
max_calls_per_day: 300
# Characters of each report's body kept for search and context.
body_excerpt_chars: 2000
