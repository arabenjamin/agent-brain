# Example secrets index (VAULT_PLAN.md Phase 0). The real one lives OUTSIDE
# the repo (the brain's container mounts the repo read-write), at
# ${VAULT_HOST_DIR:-$HOME/.config/agent-brain/vault}/index.yaml, mounted
# read-only at /home/agent/vault; SECRETS_INDEX overrides the container path.
#
# A secret named by an :ApiContext or :McpServer (`auth_env_var`) is sent only
# to a host its entry lists. Not listed, wrong host, or no index: refused with
# the reason, nothing sent. Names and hosts only, never values (they stay in
# .env until the vault backend of Phase 2). Read on every call.
secrets:
  GITHUB_TOKEN:
    hosts: [api.github.com]
    description: GitHub REST
  EXA_API_KEY:
    hosts: ['*.exa.ai']          # subdomains of exa.ai, not exa.ai itself
    description: Exa MCP
  HOME_ASSISTANT_TOKEN:
    hosts: [ha.your-tailnet.ts.net]
    description: Home Assistant on the tailnet
