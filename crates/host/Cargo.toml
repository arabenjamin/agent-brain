[package]
name = "agent-brain-host"
version.workspace = true
edition.workspace = true
description = "Agent Brain's plugin host: compiled plugins, bundle seeds, manage_plugin, self-model"

[dependencies]
agent-brain-models = { path = "../models" }
agent-brain-repository = { path = "../repository" }
agent-brain-protocol = { path = "../protocol" }
agent-brain-plugin-api = { path = "../plugin-api" }
agent-brain-llm = { path = "../llm" }
agent-brain-graph = { path = "../graph" }
agent-brain-knowledge = { path = "../knowledge" }
agent-brain-work = { path = "../work" }
agent-brain-scheduler = { path = "../scheduler" }
agent-brain-retrieve = { path = "../retrieve" }
# In-tree plugin crates, compiled in and enabled at runtime (plugins.rs).
agent-brain-plugin-osint-data = { path = "../../plugins/osint-data/crate" }
agent-brain-plugin-research = { path = "../../plugins/research/crate" }
agent-brain-plugin-media = { path = "../../plugins/media/crate" }
agent-brain-plugin-alias-judge = { path = "../../plugins/alias-judge/crate" }
agent-brain-plugin-reference = { path = "../../plugins/reference/crate" }
agent-brain-plugin-developer = { path = "../../plugins/developer/crate" }
agent-brain-plugin-epistemics = { path = "../../plugins/epistemics/crate" }
agent-brain-plugin-sandbox = { path = "../../plugins/sandbox/crate" }
agent-brain-plugin-websocket = { path = "../../plugins/websocket/crate" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true }
neo4rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
