[package]
name = "agent-brain-plugin-api"
version.workspace = true
edition.workspace = true

# The only brain crate an in-process plugin may depend on (with external
# crates). scripts/check_plugin_deps.sh enforces it in CI.
[dependencies]
agent-brain-protocol = { path = "../protocol" }
agent-brain-decision = { path = "../decision" }
agent-brain-engine = { path = "../engine" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
serde = { workspace = true }

[features]
# For a plugin's seed-schema test: plugins reach protocol only through here.
seed-schema-check = ["agent-brain-protocol/seed-schema-check"]

[lints]
workspace = true
