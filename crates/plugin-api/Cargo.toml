[package]
name = "agent-brain-plugin-api"
version.workspace = true
edition.workspace = true

# The only brain crate an in-process plugin may depend on (with external
# crates). scripts/check_plugin_deps.sh enforces it in CI.
[dependencies]
agent-brain-protocol = { path = "../protocol" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
serde = { workspace = true }
