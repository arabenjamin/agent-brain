[package]
name = "agent-brain-retrieve"
version.workspace = true
edition.workspace = true
description = "Agent Brain's retrieval tools: web search, HTTP and API ingest, MCP client, graph and telemetry queries"

[dependencies]
agent-brain-repository = { path = "../repository" }
agent-brain-protocol = { path = "../protocol" }
agent-brain-llm = { path = "../llm" }
agent-brain-graph = { path = "../graph" }
agent-brain-knowledge = { path = "../knowledge" }
agent-brain-work = { path = "../work" }
async-trait = { workspace = true }
chrono = { workspace = true }
neo4rs = { workspace = true }
regex = "1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true }

[dev-dependencies]
# Seed-schema test (CODEBASE_SPLIT_PLAN Phase 1).
schemars = { workspace = true }
agent-brain-protocol = { path = "../protocol", features = ["seed-schema-check"] }
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true
