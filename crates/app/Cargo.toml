[package]
name = "agent-brain"
version.workspace = true
edition.workspace = true
description = "Autonomous AI agent brain — persistent memory, background jobs, reasoning, and self-improvement via MCP"

[lib]
name = "agent_brain"
path = "src/lib.rs"

[[bin]]
name = "agent-brain"
path = "src/main.rs"

[dependencies]
agent-brain-models = { path = "../models" }
agent-brain-repository = { path = "../repository" }
agent-brain-protocol = { path = "../protocol" }
agent-brain-plugin-api = { path = "../plugin-api" }
agent-brain-llm = { path = "../llm" }
agent-brain-host = { path = "../host" }
agent-brain-api = { path = "../api", optional = true }
agent-brain-skills = { path = "../skills" }
agent-brain-retrieve = { path = "../retrieve" }
agent-brain-scheduler = { path = "../scheduler" }
agent-brain-chat = { path = "../chat" }
agent-brain-work = { path = "../work" }
agent-brain-knowledge = { path = "../knowledge" }
agent-brain-graph = { path = "../graph" }

# Async runtime
tokio = { workspace = true }

# Neo4j graph database
neo4rs = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Serialization
serde_json = { workspace = true }

# Date/time and UUIDs
chrono = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Configuration
dotenvy = "0.15"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP transport — Axum-based MCP server (optional — enable with 'http-transport' feature)
axum = { version = "0.8", features = ["http2"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
async-stream = { version = "0.3", optional = true }
async-trait = "0.1"
futures-util = "0.3"

[features]
http-transport = ["dep:agent-brain-api", "dep:axum", "dep:tower-http", "dep:tower",
                  "dep:tokio-stream", "dep:async-stream"]
telemetry      = ["agent-brain-repository/telemetry"]
default        = ["http-transport", "telemetry"]
