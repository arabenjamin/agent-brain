[package]
name = "agent-brain"
version.workspace = true
edition.workspace = true
description = "Autonomous AI agent brain — persistent memory, background jobs, reasoning, and self-improvement via MCP"

[lib]
name = "agent_brain"
path = "src/lib.rs"

[[bin]]
name = "agent-brain"
path = "src/main.rs"

[dependencies]
agent-brain-models = { path = "../models" }
agent-brain-repository = { path = "../repository" }
agent-brain-protocol = { path = "../protocol" }
agent-brain-plugin-api = { path = "../plugin-api" }
# In-tree plugin crates, compiled in and enabled at runtime (services/plugins.rs).
agent-brain-plugin-osint-data = { path = "../../plugins/osint-data/crate" }
agent-brain-plugin-media = { path = "../../plugins/media/crate" }
agent-brain-plugin-alias-judge = { path = "../../plugins/alias-judge/crate" }
agent-brain-plugin-reference = { path = "../../plugins/reference/crate" }

# Async runtime
tokio = { workspace = true }

# Neo4j graph database
neo4rs = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# URL parsing
url = "2"

# Regular expressions
regex = "1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

jsonschema = { workspace = true }

# Date/time and UUIDs
chrono = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Configuration
dotenvy = "0.15"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# YAML parsing (model catalog)
serde_yaml = { workspace = true }

# HTTP transport — Axum-based MCP server (optional — enable with 'http-transport' feature)
axum = { version = "0.8", features = ["http2"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
async-stream = { version = "0.3", optional = true }
async-trait = "0.1"
futures-util = "0.3"


# Gzip compression for snapshot files
flate2 = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[features]
http-transport = ["dep:axum", "dep:tower-http", "dep:tower",
                  "dep:tokio-stream", "dep:async-stream"]
telemetry      = ["agent-brain-repository/telemetry"]
default        = ["http-transport", "telemetry"]

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
