[package]
name = "agent-brain-graph"
version.workspace = true
edition.workspace = true
description = "Agent Brain's knowledge base layer: plugin bundles, clock, entity resolution, topics, snapshots"

[dependencies]
agent-brain-repository = { path = "../repository" }
agent-brain-llm = { path = "../llm" }
anyhow = { workspace = true }
chrono = { workspace = true }
flate2 = "1"
neo4rs = { workspace = true }
regex = "1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "rustls", "tracing", "ureq"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Seed-schema test (CODEBASE_SPLIT_PLAN Phase 1).
schemars = { workspace = true }
agent-brain-protocol = { path = "../protocol", features = ["seed-schema-check"] }
async-trait = { workspace = true }
sentry = { version = "0.49", default-features = false, features = ["test"] }
tempfile = "3"

[lints]
workspace = true
