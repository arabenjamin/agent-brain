name: fill-knowledge-gap
pattern: "fill knowledge gap:"
priority: 100
description: "Curiosity engine: search for information to fill a specific knowledge gap, reason over findings, then store a synthesis note."
steps:
  - tool_name: search_notes
    arguments:
      query: "{{goal}}"
      limit: 10
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Gap fill: search existing knowledge"

  - tool_name: reason
    arguments:
      # action=structured has no context support — use the default grounded path.
      question: "{{goal}}\n\nThe CONTEXT contains existing notes related to this gap. Synthesize what is known, state what remains unknown, and answer the gap as concretely as the evidence allows."
      context: "{{_prev}}"
      store_inference: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Gap fill: structured reasoning over findings"

  - tool_name: store_note
    arguments:
      content: "## Gap synthesis: {{goal}}\n\n{{_prev}}"
      note_type: semantic
      provenance: synthesis_inference
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Gap fill: store synthesis note"

  - tool_name: update_task
    arguments:
      task_id: "{{task_id}}"
      status: completed
    priority: 1
    max_attempts: 3
    provider_hint: ollama
