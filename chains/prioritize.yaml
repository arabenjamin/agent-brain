name: prioritize
pattern: "prioriti"
patterns:
  - "roadmap"
  - "plan"
priority: 40
description: "Planning / prioritisation: search context, reason twice over it, then distill into a durable plan note."
steps:
  - tool_name: search_notes
    arguments:
      query: "{{goal}}"
      limit: 10
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  # Draft → refine: the first reason drafts a plan from the retrieved notes,
  # the second critiques and finalises it. Previously both steps were the
  # identical ungrounded question, run twice.
  - tool_name: reason
    arguments:
      question: "Draft a prioritised plan for: {{goal}}\n\nThe CONTEXT contains related notes from the knowledge graph — use them as your evidence."
      context: "{{_prev}}"
      store_inference: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: reason
    arguments:
      question: "The CONTEXT contains a draft prioritised plan for: {{goal}}. Critique it for missing dependencies, wrong ordering, and vague items, then produce the final improved plan."
      context: "{{_prev}}"
      store_inference: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: synthesize_knowledge
    arguments:
      topic: "{{goal}}"
      limit: 8
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: update_task
    arguments:
      task_id: "{{task_id}}"
      status: completed
    priority: 1
    max_attempts: 3
    provider_hint: ollama
