name: git-history
pattern: "git history"
patterns:
  - "recent changes"
  - "what changed"
  - "commit history"
priority: 70
description: "Git history analysis: fetch recent commits, diff, reason over changes, distill into semantic knowledge."
steps:
  - tool_name: get_git_log
    arguments:
      n: 20
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    confidence_threshold: 0.5

  - tool_name: get_git_diff
    arguments:
      from_ref: "HEAD~10"
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: reason
    arguments:
      question: "{{goal}}\n\nThe CONTEXT contains the recent git diff. Base your analysis ONLY on the CONTEXT."
      context: "{{_prev}}"
      store_inference: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    # Distilled handoff: a 10-commit diff routinely runs to tens of thousands of
    # characters, most of it unchanged context lines and whitespace. The local
    # model reads a change summary instead of the raw patch.
    distill_prev: true
    distill_max_chars: 3000
    distill_focus: >-
      which files changed and what changed in each — new/removed functions,
      types, and behaviour — keeping identifiers and file paths verbatim;
      drop unchanged context lines and pure formatting churn

  - tool_name: synthesize_knowledge
    arguments:
      topic: "{{goal}}"
      limit: 8
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: update_task
    arguments:
      task_id: "{{task_id}}"
      status: completed
    priority: 1
    max_attempts: 3
    provider_hint: ollama
