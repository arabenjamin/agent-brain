name: learn
pattern: "learn"
patterns:
  - "research"
  - "study"
  - "understand"
priority: 50
description: "Learning / research: search the web for current information, reason over the gathered material, persist a sourced semantic note."
# Topics come from goals you set, so this chain is private: its reasoning step
# only reaches no_log providers (gpt-oss:120b-cloud), never a free tier that
# trains on prompts. See project-docs/PROVIDER_ROUTING_PLAN.md §3.
data_class: private
steps:
  # Step flow and {{_prev}} chain:
  #   1. search_web → external results (the graph can't answer a research goal
  #                   about material it doesn't contain — re-chewing internal
  #                   notes produced meta-commentary the evaluator rejected)
  #   2. reason     → facts grounded ONLY in the gathered results
  #                   (context pins the prompt; without it reason RAGs the graph)
  #   3. store_note → durable semantic note that satisfies research
  #                   success_criteria ("concrete, verifiable facts")
  - tool_name: search_web
    arguments:
      # goal_topic, not goal: strips any routing prefix so the query carries the
      # subject alone. Identical to {{goal}} for goals with no prefix.
      query: "{{goal_topic}}"
      count: 8
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: reason
    arguments:
      question: |
        Research goal: {{goal}}

        The CONTEXT contains web search results gathered for this goal. Based
        ONLY on the CONTEXT, answer the goal in at most 6 bullets, each one
        concrete fact (a name, number, date, mechanism, or version) with its
        source URL. Name the topic explicitly. No introduction, no summary,
        no description of the sources or the task.

        If the CONTEXT does not answer the goal, write exactly
        "NO FINDINGS — " followed by one line naming what was missing, and
        nothing else.
      context: "{{_prev}}"
      store_inference: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    # Higher-order step: synthesis over web results benefits from a stronger
    # model. The router picks the best catalog match within CLOUD_TIER
    # (tier 1 default → free Ollama Cloud models; tier 0 → largest local).
    required_capabilities: ["reasoning"]
    # Distilled handoff: raw SERP payloads are mostly boilerplate (ranks, snippet
    # duplication, tracking params) and this is the step that routes to a cloud
    # model — so it is where compressing {{_prev}} actually buys something. The
    # focus keeps URLs intact because the prompt above requires citations.
    distill_prev: true
    distill_max_chars: 3000
    distill_focus: >-
      every factual claim with its source URL attached, plus any dates, figures,
      version numbers, and names; drop ranking metadata and duplicated snippets

  - tool_name: store_note
    arguments:
      content: "## Research: {{goal}}\n\n{{_prev}}"
      note_type: semantic
      source_context: learn_chain
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  # Chained directly off store_note. `{{_prev}}` is the note body (the queue
  # unwraps the result envelope's `answer`); `{{_prev.id}}` reaches into that
  # same envelope for the note id, giving each claim an ASSERTED_IN edge back
  # to the note it was extracted from.
  - tool_name: claim
    arguments:
      action: extract
      text: "{{_prev}}"
      source_note_id: "{{_prev.id}}"
      source_context: learn_chain
      limit: 4
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Extract checkable claims from the research findings"

  - tool_name: update_task
    arguments:
      task_id: "{{task_id}}"
      status: completed
    priority: 1
    max_attempts: 3
    provider_hint: ollama
