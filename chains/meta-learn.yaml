name: meta-learn
pattern: "meta-learn:"
patterns:
  - "hypothesize root cause"
priority: 10
description: "Meta-Learning Loop: Analyze → Hypothesize → Test → Integrate. Triggered by perception_scan on repeated failure patterns."
steps:
  - tool_name: search_notes
    arguments:
      query: "{{goal}}"
      limit: 10
      entity_expansion: true
    priority: 2
    max_attempts: 3
    provider_hint: ollama
    description: "Meta-learn: gather failure evidence"

  - tool_name: reason
    arguments:
      question: |
        You are a meta-learning system running the Analyze→Hypothesize→Test→Integrate cycle.

        GOAL: {{goal}}

        Based on the search results above:
        1. ANALYZE: What failure pattern is emerging? What do the failures have in common?
        2. HYPOTHESIZE: Form a specific, testable hypothesis about the root cause.
        3. TEST: Propose a concrete, observable test that would confirm or refute the hypothesis.
        4. INTEGRATE: What change to tooling, documentation, or procedure would prevent recurrence?

        Structure your response clearly with these four headings.
      store_inference: true
    priority: 2
    max_attempts: 3
    provider_hint: ollama
    description: "Meta-learn: form hypothesis and propose test"

  - tool_name: store_note
    arguments:
      content: "{{_prev}}"
      note_type: hypothesis
      source_context: "{{goal}}"
      provenance: synthesis_inference
    priority: 2
    max_attempts: 3
    provider_hint: ollama
    description: "Meta-learn: store hypothesis note for review"

  - tool_name: synthesize_knowledge
    arguments:
      topic: "{{goal}}"
      limit: 10
    priority: 2
    max_attempts: 3
    provider_hint: ollama
    description: "Meta-learn: integrate findings into semantic memory"

  - tool_name: update_task
    arguments:
      task_id: "{{task_id}}"
      status: completed
    priority: 1
    max_attempts: 3
    provider_hint: ollama
