# Crates available OFFLINE to code submitted to the rust sandbox.
#
# This manifest is never built. The image runs `cargo fetch` over it at build
# time so the registry cache is populated, and every run afterwards is
# `cargo --offline` against that read-only cache. A submission that depends on
# a crate not listed here fails with cargo's own "no matching package" error.
#
# To add a crate: add it below and rebuild the image. Keep versions to the
# major line submissions will ask for; offline resolution picks the cached one.
[package]
name = "sandbox-crate-seed"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Required by the Exercism / Aider polyglot Rust exercises.
anyhow = "1.0"
pretty_assertions = "1"
rand = "0.8"
time = "0.3"

# Common idioms generated Rust reaches for.
itertools = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Cryptography and encodings (2026-10-05). Protocol questions (Reticulum's
# destination hash, age's recipient stanza) cannot be answered with a passing
# test without real primitives: two deep-dive agents reached for sha2 and
# ed25519-dalek, could not compile, and earlier runs hand-rolled SHA-256 instead.
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hex = "0.4"
base64 = "0.22"

# The brain's own idioms (2026-10-23). A deep-diver asked to write a module for
# this codebase (a YAML rule file loaded once, an error logged) could not
# compile it here: two runs, `serde_yaml` and `tracing` missing, so
# `rerun_answer_code` failed on the environment, not the code.
serde_yaml = "0.9"
tracing = "0.1"
