[package]
name = "agent-brain-plugin-epistemics"
version.workspace = true
edition.workspace = true

# A plugin crate depends on agent-brain-plugin-api and external crates only
# (scripts/check_plugin_deps.sh).
[dependencies]
agent-brain-plugin-api = { path = "../../../crates/plugin-api" }
anyhow = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Seed-schema test (CODEBASE_SPLIT_PLAN Phase 1).
schemars = { workspace = true }
agent-brain-plugin-api = { path = "../../../crates/plugin-api", features = ["seed-schema-check"] }
tokio = { workspace = true }

[lints]
workspace = true
