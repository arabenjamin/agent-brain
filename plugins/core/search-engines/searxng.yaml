# Self-hosted SearXNG: keyless, the flagged last resort. It fans out to Google,
# Bing, DuckDuckGo…, which read `site:`, quotes and `-` but not `after:`. No
# `time_range`: SearXNG drops every backend that cannot filter by date, which
# left Naver alone for general queries and 2 news results (vs 54, 45 dated,
# without it). The window is enforced from each result's own date instead.
name: searxng
rank: 6
request:
  method: get
  base_url_env: SEARXNG_URL
  base_url_default: "http://searxng:8080"
  url: "{base}/search"
  query: { param: q, syntax: google_undated }
  fixed: { format: json, language: en, safesearch: "0" }
  news: { categories: news }
  timeout_secs: 20
response:
  shape: searxng
  items: results
  link: url
  snippet: [content]
  date: publishedDate
