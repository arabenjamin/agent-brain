# Exa: a neural ranker. $10 of credit a month free, refills, no card. It reads
# no operators (`site:` there was the word "site"): domains, dates, news and a
# short exact phrase are parameters. Without `contents` it returns no snippet.
# News + a one-day window returned CNBC, Al Jazeera, France24, Politico dated
# that day (2026-10-02).
name: exa
rank: 1
key_env: EXA_API_KEY
# Each answer prices itself (`costDollars.total`, $0.007 for an auto search
# with highlights, 2026-10-16): ~1,430 searches on the $10 monthly credit,
# which the ladder alone spent in two weeks.
budget:
  free: 10.0
  unit: usd
  per: month
  cost_field: costDollars.total
  cost_default: 0.007
# Claim verification searches the claim's own sentence; a neural ranker
# finds coverage of it where keyword engines return pages that share words.
# The same 37 claims (2026-10-22), judged the same way: Exa corroborated 26,
# Tavily 13, Serper 10, TinyFish 9 (since the rotation began on 10-16, claims
# went 65% → 25% corroborated). Exa leads them while on pace, so the credit
# still lasts the month.
lead_for: [claim]
request:
  method: post
  url: https://api.exa.ai/search
  auth: { header: x-api-key }
  query: { param: query, syntax: plain }
  count: { param: numResults }
  fixed:
    type: auto
    contents: { highlights: { maxCharacters: 400 } }
  news: { category: news }
  sites: includeDomains
  exclude_sites: excludeDomains
  dialect: exa
response:
  items: results
  link: url
  snippet: [highlights, text]
  date: publishedDate
  spent_status: [402]
  spent_words: [credits]
