# Serper: Google results, 2,500 free queries ONCE (no refill), no card. Its
# /news endpoint answers `news` instead of `organic`.
name: serper
rank: 4
key_env: SERPER_API_KEY
# The grant is per account, not per period; usage before the ledger existed
# is not counted, so its spent-quota answer ("Not enough credits") is the
# real end.
budget: { free: 2500, per: once }
request:
  method: post
  url: https://google.serper.dev/search
  news_url: https://google.serper.dev/news
  auth: { header: X-API-KEY }
  query: { param: q, syntax: google }
  count: { param: num }
  dialect: google_tbs
response:
  items: organic
  news_items: news
  spent_status: [402]
  spent_words: [credits]
