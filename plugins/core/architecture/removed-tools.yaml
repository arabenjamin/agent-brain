# Tools the brain no longer has. self_model.rs writes each as a (:RemovedTool)
# tombstone so the brain remembers what is gone and what replaces it: a profile
# or prompt naming one is flagged at startup, and list_capabilities(kind=tools)
# lists them under `removed`.
#
# `commit` is the last commit that still had the tool: `git show <commit>:<path>`
# recovers it. Evidence for each removal: CORE_AND_PLUGINS_PLAN.md §4 (tool-call
# history in telemetry since 2026-06-12; zero or near-zero calls).

tools:
  # Phase 0, 2026-10-10 — never called
