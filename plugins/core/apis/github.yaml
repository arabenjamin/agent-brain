# GitHub REST API v3 (codebase tools, http_request). The token stays in env.
name: github
description: GitHub REST API v3
base_url: https://api.github.com
auth_scheme: bearer
auth_param: Authorization
auth_env_var: GITHUB_TOKEN
default_headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"
kind: code-hosting
