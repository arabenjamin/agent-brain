# Why: dev_docs get yaml/schedules-tech-dependency-synthesis-1
name: tech-dependency-synthesis
description: "Monthly correlation pass over accumulated hardware tripwire and SLM benchmark reports. Tests the asymmetric-advantage hypothesis, records a verdict with its confidence, and spawns a research task on the weakest link in the argument."
topic: semiconductors
kind: brief
every: 30d
# Public web research on public topics: its reasoning step may use free tiers
# that train on prompts (gemini-2.5-flash). See PROVIDER_ROUTING_PLAN.md §3.
data_class: public

steps:
  # 1. Hard layer — the last ~4 weekly tripwire reports (one month of signal).
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (n:Note) WHERE n.source_context = 'hardware_tripwire' AND NOT (n)-[:PART_OF]->() RETURN n.content AS content ORDER BY n.created_at DESC LIMIT 4"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Fetch hard-layer reports"

  - tool_name: push_context
    arguments:
      session_id: "synthesis-{{task_id}}"
      content: "## HARD LAYER — HARDWARE TRIPWIRE REPORTS\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank hard-layer evidence"

  # 2. Soft layer — the last ~2 bi-weekly benchmark reports (one month).
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (n:Note) WHERE n.source_context = 'slm_benchmark_watch' AND NOT (n)-[:PART_OF]->() RETURN n.content AS content ORDER BY n.created_at DESC LIMIT 2"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Fetch soft-layer reports"

  - tool_name: push_context
    arguments:
      session_id: "synthesis-{{task_id}}"
      content: "## SOFT LAYER — SLM BENCHMARK REPORTS\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank soft-layer evidence"

  # 3. Prior synthesis, so the verdict can move rather than reset each month.
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (n:Note) WHERE n.source_context = 'tech_dependency_synthesis' AND NOT (n)-[:PART_OF]->() RETURN n.content AS content ORDER BY n.created_at DESC LIMIT 1"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Fetch prior synthesis verdict"

  - tool_name: push_context
    arguments:
      session_id: "synthesis-{{task_id}}"
      content: "## PRIOR SYNTHESIS VERDICT (may be empty on first run)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank prior verdict"

  # 4. Reassemble all three layers.
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'synthesis-{{task_id}}'}) RETURN w.content AS content ORDER BY w.turn_index"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Reassemble hard + soft + prior verdict"

  # 5. The correlation pass. Evidence goes in `context`, never in `question`.
  - tool_name: reason
    arguments:
      question: |
        The CONTEXT contains three blocks: HARD LAYER supply-chain tripwire
        reports, SOFT LAYER small-model benchmark reports, and the PRIOR
        SYNTHESIS VERDICT.

        The standing hypothesis under test is:
        "Scarcity in AI accelerator hardware is a primary driver of adoption of
        small, efficient models — creating an asymmetric advantage for operators
        who can run capable models on constrained hardware."

        Write a synthesis with exactly these sections:

        ## EVIDENCE FOR
        Specific, dated observations from the CONTEXT that support the
        hypothesis. Each must cite which report it came from.

        ## EVIDENCE AGAINST
        Observations that undercut it, including cases where small-model progress
        is clearly driven by something other than scarcity (architecture,
        distillation, training data, licensing). Do not leave this section empty
        for the sake of a tidy story — if you found nothing, say what you looked
        for and did not find.

        ## CORRELATION OR COINCIDENCE
        State plainly whether the CONTEXT actually establishes a causal link, a
        mere correlation, or neither. Name the confound that would most likely
        explain the pattern without the hypothesis being true.

        ## VERDICT
        One of: SUPPORTED / PARTIALLY SUPPORTED / NOT SUPPORTED / INSUFFICIENT
        EVIDENCE — followed by a confidence level (low/medium/high) and one
        sentence of justification. If the CONTEXT has few or no reports, the
        verdict is INSUFFICIENT EVIDENCE; do not reason from general knowledge
        about the AI industry to fill the gap.

        ## MOVEMENT SINCE PRIOR VERDICT
        How and why the verdict changed, or "unchanged" with the reason.

        ## WEAKEST LINK
        The single question whose answer would most change this verdict. Write it
        as one concise, specific, researchable phrase.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    # Paid synthesis: `deep_reasoning` is held only by claude-sonnet-5. When the
    # spend cap or ROUTING_PAID_FOR refuses it, the step runs on this
    # provider_hint (gpt-oss) instead — see the note in models.yaml.
    provider_hint: ollama-cloud
    required_capabilities: ["deep_reasoning"]
    description: "Correlate hard vs soft layer, issue verdict"

  # 6. Persist the synthesis — this is the note step 3 reads next month.
  - tool_name: store_note
    arguments:
      content: "# Tech dependency synthesis — {{date}}\n\n{{_prev}}"
      note_type: semantic
      source_context: tech_dependency_synthesis
      provenance: synthesis_inference
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Store the synthesis verdict"

  # 7. Extract the WEAKEST LINK as a research question. Kept as its own step so
  #    the extraction stays mechanical — the same idiom as workflows/news-analysis.yaml.
  - tool_name: reason
    arguments:
      question: |
        From this synthesis, find the "WEAKEST LINK" section.
        Output it as a single line: <the weakest link question>

        Output nothing else — no prefix, no explanation, no punctuation around it.
      context: "{{_prev}}"
      store_inference: false
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Extract the research goal"

  # 8. Run fill-knowledge-gap on it (dispatched on the next tick).
  - tool_name: create_task
    arguments:
      goal: "fill knowledge gap: {{_prev}}"
      workflow: fill-knowledge-gap
      inputs:
        topic: "{{_prev}}"
      context: "Auto-generated from the monthly tech dependency synthesis. Research this and store findings as semantic knowledge — it is the weakest link in the asymmetric-advantage hypothesis."
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Spawn research task on the weakest link"

  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'synthesis-{{task_id}}'}) DETACH DELETE w"
      readonly: false
    # priority 1, not 0 — the queue is a max-heap, so 0 is the lowest priority
    # and starves under a fed queue. See workflows/fill-knowledge-gap.yaml.
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Delete scratch session"
