name: surveillance-privacy-watch
description: "Weekly: new surveillance and digital-privacy developments (spyware and state surveillance, privacy lawsuits and regulators, police and commercial tracking) from three news sweeps, written as a dated, cited delta against the prior report and stored as a source_record with claims extracted."
topic: cybersecurity
kind: monitor
every: 1w
enabled: false   # seeded off; turned on after a verified manual run
data_class: public
steps:
  # Built 2026-10-19 from the Cybersecurity & Privacy program review (todo
  # a54ce4bd): the charter names surveillance and digital privacy and no
  # workflow covered either. Sweep queries measured that day on the
  # cybersecurity list; "privacy law ... fine" phrasings returned mostly noise.
  - id: prior
    tool_name: neo4j_query
    arguments:
      cypher: "MATCH (n:Note) WHERE n.source_context = 'surveillance_privacy_watch' AND n.note_type = 'source_record' AND NOT (n)-[:PART_OF]->() RETURN n.content AS content ORDER BY n.created_at DESC LIMIT 1"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Fetch the prior report for the delta"

  - id: spyware
    needs: { kind: news-feed, topic: cybersecurity }
    tool_name: search_web
    arguments:
      query: "spyware government surveillance investigation"
      recency: week
      count: 8
      source_list: cybersecurity
      prior_knowledge: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: spyware and state surveillance"

  - id: privacy
    needs: { kind: news-feed, topic: cybersecurity }
    tool_name: search_web
    arguments:
      query: "privacy lawsuit data collection regulators"
      recency: week
      count: 8
      source_list: cybersecurity
      prior_knowledge: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: privacy lawsuits and regulators"

  - id: tracking
    needs: { kind: news-feed, topic: cybersecurity }
    tool_name: search_web
    arguments:
      query: "police facial recognition data broker location tracking"
      recency: week
      count: 8
      source_list: news
      prior_knowledge: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: police and commercial tracking"

  # Outlet RSS feeds (folded in 2026-10-23, owner): a trial run of the
  # surveillance-privacy-watch-rss draft found an item the sweeps missed (the
  # FCC's HiSilicon device ban, via The Record). Optional: a feed that is down
  # leaves the sweeps to carry the report.
  - id: feed_bleepingcomputer
    needs: { kind: news-feed, topic: cybersecurity }
    tool_name: http_request
    arguments:
      context_name: bleepingcomputer_rss
      method: GET
      url: "feed/"
    optional: true
    max_attempts: 2
    provider_hint: ollama
    description: "Outlet feed: bleepingcomputer_rss (RSS)"

  - id: feed_therecord
    needs: { kind: news-feed, topic: cybersecurity }
    tool_name: http_request
    arguments:
      context_name: therecord_rss
      method: GET
      url: "feed"
    optional: true
    max_attempts: 2
    provider_hint: ollama
    description: "Outlet feed: therecord_rss (RSS)"

  - id: feed_securityweek
    needs: { kind: news-feed, topic: cybersecurity }
    tool_name: http_request
    arguments:
      context_name: securityweek_rss
      method: GET
      url: "feed/"
    optional: true
    max_attempts: 2
    provider_hint: ollama
    description: "Outlet feed: securityweek_rss (RSS)"

  - id: rss
    tool_name: execute_code
    arguments:
      language: python
      timeout_ms: 30000
      code: |
        import json, datetime, email.utils, xml.etree.ElementTree as ET
        FEEDS = {"bleepingcomputer_rss": r"""{{steps.feed_bleepingcomputer.body}} """, "therecord_rss": r"""{{steps.feed_therecord.body}} """, "securityweek_rss": r"""{{steps.feed_securityweek.body}} """}
        KEYWORDS = ["spyware", "surveillance", "privacy", "tracking", "facial recognition", "data broker", "biometric", "lawsuit", "gdpr", "ftc", "location data", "stalkerware"]
        cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=7)
        out, seen, errors = [], 0, []
        for name, xml in FEEDS.items():
            try:
                root = ET.fromstring(xml.strip())
            except ET.ParseError as e:
                errors.append(f"{name}: not RSS ({e})")
                continue
            for it in root.iter("item"):
                seen += 1
                title = (it.findtext("title") or "").strip()
                desc = (it.findtext("description") or "").strip()
                when = it.findtext("pubDate") or ""
                try:
                    dt = email.utils.parsedate_to_datetime(when)
                except Exception:
                    dt = None
                if dt is not None and dt < cutoff:
                    continue
                text = (title + " " + desc).lower()
                if not any(k in text for k in KEYWORDS):
                    continue
                out.append({"title": title, "link": (it.findtext("link") or "").strip(),
                            "date": dt.date().isoformat() if dt else "", "snippet": desc[:300], "source": name})
        print(json.dumps(out, indent=1))
        print(f"(RSS: {len(out)} of {seen} feed items kept: last 7 days, beat keywords" + (f"; errors: {errors}" if errors else "") + ")")
    optional: true
    max_attempts: 2
    provider_hint: ollama
    description: "Parse the feeds: last 7 days, beat keywords (code, no model)"

  - id: report
    tool_name: reason
    arguments:
      question: |
        The CONTEXT holds a PRIOR REPORT (its title line carries its date),
        then three news sweeps: spyware and state surveillance, privacy
        lawsuits and regulators, police and commercial tracking. Today is
        {{date}}.

        Write a weekly watch report with exactly these sections:

        Answer in plain markdown under these headings: no code fences, never
        a JSON object or the headings as keys.

        ## NEW SINCE THE PRIOR REPORT
        One line per item: `<date> — <who> — <what happened> — <outlet> — <URL>`.
        Gates, applied in order:
        1. DATE OR DROP. An item needs a date from the CONTEXT. A relative date
           ("4 days ago") is counted back from {{date}}. No date: leave it out.
        2. LAST 7 DAYS, and newer than the prior report's date. An item the
           prior report already lists is known: leave it out.
        3. ON TOPIC. Surveillance of people (by states, police, employers or
           companies), spyware, or the collection, sale or protection of
           personal data, including the laws, rulings and fines about it.
           Banking supervision, general AI regulation and product launches are
           not items unless personal data is the point.
        4. ATTRIBUTE. "X reports / alleges / rules that Y"; name who says so.
           An advocacy group's finding (EFF, Citizen Lab) is its claim, not a
           fact; a court ruling or a regulator's fine is a fact.
        If nothing passes, write "Nothing new since the prior report." That is
        a valid result; do not pad it.

        ## PATTERNS
        Two or three sentences at most: a vendor, government, technique or
        legal theory that recurs across several independent outlets. Name the
        outlets. If there is no pattern, write "None."

        Ground every line in the CONTEXT and cite its URL. If a sweep came back
        empty or off-topic, say so plainly.
      context: "## PRIOR REPORT (may be empty on first run)\n{{steps.prior}}\n\n## SWEEP — SPYWARE AND STATE SURVEILLANCE\n{{steps.spyware}}\n\n## SWEEP — PRIVACY LAWSUITS AND REGULATORS\n{{steps.privacy}}\n\n## SWEEP — POLICE AND COMMERCIAL TRACKING\n{{steps.tracking}}\n\n## OUTLET RSS FEEDS (last 7 days, beat keywords; JSON list: title, link, date, snippet, source)\n{{steps.rss.stdout}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    provider_hint: ollama-cloud
    description: "Dated delta report with attributed claims"

  - id: record
    tool_name: store_note
    arguments:
      content: "# Surveillance & privacy watch — {{date}}\n\n{{steps.report}}"
      note_type: source_record
      source_context: surveillance_privacy_watch
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Store the watch report"

  - tool_name: claim
    arguments:
      action: extract
      text: "{{steps.report}}"
      source_note_id: "{{_prev.id}}"
      source_context: surveillance_privacy_watch
      asserted_by: "Surveillance & privacy watch (news sources as cited)"
      limit: 8
    optional: true
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Extract claims as checkable, attributed propositions"
