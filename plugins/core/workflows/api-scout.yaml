# Why: dev_docs get yaml/schedules-api-scout-1
name: api-scout
description: "Weekly: runs the api-scout sub-agent to find free REST APIs in the brain's interest areas; ingests keyless specs via ingest_api and notifies the human about APIs that require a key. Seeded disabled for review."
# topic: none — spans topics on purpose
kind: learning
every: 1w
enabled: false
steps:
  - tool_name: run_agent
    arguments:
      agent: api-scout
      task: >-
        Scout for genuinely useful, FREE public REST APIs in ONE or TWO of the
        brain's interest areas this run (off-grid/mesh networking; local/small
        language models and open AI-ML research; hardware; news and
        Michigan/Detroit civic open data; weather). Follow your profile procedure
        exactly: first neo4j_query the existing ApiContexts so you do not
        re-propose one; ingest a candidate with ingest_api ONLY if it publishes an
        OpenAPI/Swagger spec reachable without a key; for anything that needs an
        account or API key, do NOT sign up — notify_user with the API, its docs
        URL, why it is useful to us, and that it needs a key. At most ~2 ingests
        and ~3 notifications this run. An empty run is fine; do not fabricate.
    priority: 2
    max_attempts: 2
    provider_hint: ollama-cloud
