# Why: dev_docs get yaml/chains-deep-dive-hard-1
name: deep-dive-hard
description: "PAID drill-down on Claude Sonnet for a question you marked hard. Answer one specific question with cited facts and, for technical topics, a sandbox-tested Rust example placed in this codebase."
inputs:
  - name: question
    description: "The one specific question to answer."
data_class: private
steps:
  - tool_name: run_agent
    arguments:
      agent: deep-diver-hard
      max_rounds: 16
      # Why: dev_docs get yaml/chains-deep-dive-hard-2
      verify:
        # It must have read a page (read_page; before 2026-10-16, mcp_call to
        # Exa's paid web_fetch_exa).
        require_tools: [read_page]
        code_requires_tests: true
        code_requires_clippy_clean: true
        # The verifier compiles, tests and lints the code SHOWN in the answer
        # itself; the agent's own sandbox runs are not trusted for this.
        rerun_answer_code: true
        cited_paths_exist: true
        question: "{{inputs.question}}"
        require_code_if_question_mentions: [rust]
      task: |
        Question: {{inputs.question}}

        Answer this one question concretely, in the ANSWER / RUST / IN
        AGENT-BRAIN / NEXT format. If the topic is technical, write and run a
        minimal Rust example in the sandbox and find where it would fit in
        agent-brain. Today is {{date}}.
    priority: 1
    # One attempt: a retry repeats a paid run.
    max_attempts: 1
    provider_hint: anthropic
    description: "Deep dive (hard): investigate, prototype, place"

  - tool_name: store_note
    arguments:
      content: "## Deep dive: {{inputs.question}}\n\n{{_prev}}"
      note_type: semantic
      source_context: deep_dive
      provenance: synthesis_inference
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Deep dive: store the answer"

  - tool_name: update_task
    arguments:
      task_id: "{{task_id}}"
      status: completed
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Deep dive: complete the task"
