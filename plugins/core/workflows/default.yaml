name: default
description: "Default fallback chain: search context, reason, self-reflect, distill into semantic knowledge."
# A Task that names no workflow (a free-text goal from chat) runs this one.
default: true
steps:
  - tool_name: search_notes
    arguments:
      query: "{{goal}}"
      limit: 10
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: reason
    arguments:
      question: "{{goal}}\n\nThe CONTEXT contains related notes retrieved from the knowledge graph. Use them as your primary evidence; say so explicitly if they are insufficient."
      context: "{{_prev}}"
      store_inference: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  # The gate: a score under 2.5 cancels the steps below and marks the run
  # failed, so "the notes do not cover this" is not reported as completed and
  # synthesize_knowledge does not store it as knowledge (2026-10-25: IBM API
  # research scored 1/5, was marked completed, and left a "no information"
  # semantic note). No retry: this chain can only read the same notes again.
  - tool_name: reflect_on_work
    arguments:
      goal: "{{goal}}"
      current_state: "{{_prev}}"
      task_id: "{{task_id}}"
    is_evaluator: true
    min_score: 2.5
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: synthesize_knowledge
    arguments:
      topic: "{{goal}}"
      limit: 10
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: update_task
    arguments:
      task_id: "{{task_id}}"
      status: completed
    priority: 1
    max_attempts: 3
    provider_hint: ollama
