# AI Dev Board — AI/ML job board with a full agentic apply flow.
# Search/match/analyze/compile are free; approve+submit are gated server-side on
# a human-approved artifact hash (the brain cannot submit on its own).
name: aidevboard
url: https://aidevboard.com/mcp
description: >
  AI/ML developer job board. Tools: search_jobs, match_jobs, get_job,
  analyze_application_readiness, compile_job_specific_resume,
  approve_compiled_application, apply_to_job, plus company/salary/stats.
auth_scheme: header
auth_param: X-API-Key
auth_env_var: AIDEVEBOARD_KEY
enabled: true
