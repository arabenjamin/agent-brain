# Why: dev_docs get yaml/chains-video-learning-1
name: video-learning
description: "Watch/ingest a video: fetch transcript, map-reduce summarize, compare against existing knowledge, and store a sourced semantic note linked to its :Media node."
inputs:
  - name: url
    description: "The video URL."
  - name: session
    required: false
    description: "The chat session that handed it over; given, the run ends with the hand-off steps and reports back there."
  - name: note
    required: false
    description: "What the person said about it, for the hand-off."
steps:
  # Why: dev_docs get yaml/chains-video-learning-2
  - id: watch
    tool_name: ingest_media
    arguments:
      # Why: dev_docs get yaml/chains-video-learning-3
      url: "{{inputs.url}}"
      source_context: video_learning
      store: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Fetch transcript + map-reduce summary"

  # Hand-off: what the brain itself already does about this video (its
  # workflows and programs), for the answer step below. Here, before this
  # run stores its own notes; `reason` with a context does no graph search,
  # so without this the answer saw only the video (2026-10-26: asked whether
  # to apply Harness² to our brain, it never named our harness-improve loop).
  - id: known
    when: "{{inputs.session}}"
    tool_name: neo4j_query
    arguments:
      cypher: |
        WITH [w IN split(toLower(replace(replace(replace(replace(replace(replace($t, '?', ''), '(', ''), ')', ''), '²', ''), ':', ''), ',', '')), ' ') WHERE size(w) > 4 AND NOT w IN ['about', 'every', 'these', 'there', 'their', 'which', 'tested', 'video', 'explained', 'would', 'should', 'could', 'after', 'before', 'first', 'still', 'other', 'while', 'really', 'things', 'thing', 'better', 'never', 'actually', 'everything', 'nobody', 'people', 'world', 'today', 'engineering']] AS words
        MATCH (x) WHERE (x:Workflow OR x:Program) AND coalesce(x.enabled, true) AND any(w IN words WHERE toLower(coalesce(x.name, '') + ' ' + coalesce(x.label, '') + ' ' + coalesce(x.description, '') + ' ' + coalesce(x.charter, '')) CONTAINS w)
        RETURN labels(x)[0] AS kind, x.name AS name, left(coalesce(x.description, x.charter, ''), 240) AS what LIMIT 8
      params:
        t: "{{steps.watch.title}}"
    priority: 1
    max_attempts: 2
    optional: true
    provider_hint: ollama
    description: "Hand-off: the brain's own workflows and programs on this subject"

  # 2. Bank the summary so it survives past the reason step below.
  - tool_name: push_context
    arguments:
      session_id: "video-{{task_id}}"
      content: "## VIDEO SUMMARY\n{{steps.watch}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank the summary in working memory"

  # 3. Reassemble the banked summary so it can be passed as `context` (not the
  #    push confirmation that {{_prev}} now holds).
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'video-{{task_id}}'}) RETURN w.content AS content ORDER BY w.turn_index"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Reassemble summary for the reason step"

  # 4. Compare the new material against what the brain already knows. context =
  #    the summary (NEVER restate it inside `question` — scheduled reason RAGs the
  #    graph off the question and would eat its own output → garbage loop). The
  #    reason tool's internal RAG surfaces topically-related existing notes.
  - tool_name: reason
    arguments:
      question: |
        The CONTEXT contains a summary of a video the brain just watched.
        Compare it against what is already known and write three sections:
        ## NEW — concepts/claims genuinely new to the brain
        ## CHANGED — where this updates or contradicts prior understanding
        ## FOLLOW UP — at most TWO questions worth knowing a year from now,
        each one line, each answerable with facts a few web searches can settle:
        what something is, how it works, who makes or decides it, when, or how
        much. Name the concrete thing (a technology, law, product, organisation,
        method). Good: "How does CATL's Naxtra sodium-ion cell compare to LFP on
        energy density and cost per kWh?" Bad: "What are the long-term
        implications of sodium batteries for society?" It must make sense to
        someone who has NOT seen this video: never a scene, a remark, a person's
        reaction, "this practice", or anything needing "(Context: …)". No sports.
        If nothing qualifies, write "NONE".
        Ground every point in the CONTEXT. If nothing is new, say so plainly.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    # Why: dev_docs get yaml/chains-video-learning-4
    provider_hint: ollama
    # Distilled handoff: this is the one cloud-routed step in the chain, and its
    # {{_prev}} is the full reassembled transcript summary. Safe to compress here
    # because the *durable* note (step 7) reassembles from working memory again,
    # so the stored artifact keeps full fidelity — only the prompt shrinks.
    distill_prev: true
    distill_max_chars: 3000
    distill_focus: >-
      the concepts, claims, and technical specifics the video actually asserts,
      with names, tools, versions, and figures kept verbatim; drop narration,
      asides, and sponsor/housekeeping segments
    description: "New-vs-known comparison"

  # Why: dev_docs get yaml/chains-video-learning-5
  - tool_name: spawn_gap_tasks
    arguments:
      text: "{{_prev}}"
      max: 2
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Spawn gap tasks from FOLLOW UP concepts"

  # 5. Bank the analysis alongside the summary.
  - tool_name: push_context
    arguments:
      session_id: "video-{{task_id}}"
      content: "## NEW vs KNOWN ANALYSIS\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank the analysis in working memory"

  # 6. Reassemble summary + analysis into one blob for the stored note.
  - id: notes
    tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'video-{{task_id}}'}) RETURN w.content AS content ORDER BY w.turn_index"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Reassemble summary + analysis for storage"

  # 7. Persist the durable semantic note. store_note's async pipeline runs entity
  #    extraction + similarity linking, so key concepts become :Entity nodes and
  #    connect to existing knowledge automatically.
  - tool_name: store_note
    arguments:
      content: "# Video learning: {{goal}}\n\n{{_prev}}"
      # source_record, NOT semantic: this is a record of what one channel said,
      # not knowledge the brain has established. Typing it 'semantic' put it in
      # the context window indistinguishable from a verified fact, which is why
      # `reason` synthesised credulously from single-source video content.
      note_type: source_record
      source_context: video_learning
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Store the sourced summary note"

  # Why: dev_docs get yaml/chains-video-learning-6
  - tool_name: claim
    arguments:
      action: extract
      text: "{{_prev}}"
      source_note_id: "{{_prev.id}}"
      source_context: video_learning
      # 3, not 5: verification capacity is ~80 claims/day and ~16 videos/day
      # arrive; at 5 the unverified backlog grew without bound.
      limit: 3
    # Optional: with the epistemics plugin off there is no `claim` tool, and
    # the run goes on without claims (nothing after this reads its result).
    optional: true
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Extract checkable claims from the video"

  # Hand-off: answer what the person asked (2026-10-26: "which model should
  # we run on an 8 GB card?" got a video summary and a program, never an
  # answer). In every hand-off run, not `when: {{inputs.note}}`: a step left
  # out of the run would render as a marker in the notification below.
  - id: answer
    when: "{{inputs.session}}"
    tool_name: reason
    arguments:
      question: |
        A person handed the brain this video and said: "{{inputs.note}}"
        "The brain", "our brain" and "we" mean agent-brain, this AI system
        and its owner, never a human brain: relate it to what the brain
        already does.
        If that asks a question or for advice, write "Answer:" on its own
        line, then at most eight short bullets that answer it from the CONTEXT
        (what the video says). Where WHAT THE BRAIN ALREADY RUNS bears on it,
        name that workflow or program; ignore the ones that do not. Mark
        anything you add from your own knowledge "(not from the video)". Check that each figure makes sense and say so
        when one does not. If they asked nothing, write "Gist:" and the two
        points most worth knowing. Do not invent figures.
        Auto-captions run names and numbers together ("Qwen 3.635B" is likely
        Qwen 3.6 35B, "Gemma 412B" likely Gemma 4 12B): write the likely name
        and add "(captions: <as heard>)".
      context: "{{steps.notes}}\n\n## WHAT THE BRAIN ALREADY RUNS (its workflows and programs)\n{{steps.known.rows}}"
      store_inference: false
    priority: 1
    max_attempts: 2
    optional: true
    provider_hint: ollama-cloud
    description: "Hand-off: answer what the person asked"

  # Hand-off (only when a person handed this video over in chat: the run was
  # given `session`; the media watcher's runs never are, so they skip
  # the hand-off steps). The intake agent finds the article or paper it is based on and
  # starts reading it, places it in a program, and files a todo only if there
  # is something to act on; its report goes back into the person's chat.
  - when: "{{inputs.session}}"
    tool_name: run_agent
    arguments:
      agent: intake
      max_rounds: 10
      # A source it names must be one it started reading; once more if not
      # (2026-10-23: about one run in four named it and never queued it).
      verify:
        answer_requires:
          - when: '(?i)^\W*source:\W*https?://'
            tools: [create_task]
        retry: true
      task: |
        A person handed the brain this video in chat: {{inputs.url}}
        What they said about it: {{inputs.note}}
        The brain has read it (do not start it again). Its video summary and new-vs-known analysis:

        {{steps.notes}}
    priority: 1
    max_attempts: 2
    optional: true
    description: "Hand-off: find and read its source, place it, act or file"

  - when: "{{inputs.session}}"
    tool_name: notify_user
    arguments:
      message: "Read {{inputs.url}}.\n\n{{steps.answer}}\n\n{{_prev}}"
      related_session_id: "{{inputs.session}}"
      context: "Hand-off: {{inputs.url}}"
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Hand-off: report back in the person's chat"

  # 8. Mark the video Task done.
  - tool_name: update_task
    arguments:
      task_id: "{{task_id}}"
      status: completed
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Complete the task"

  # 9. Clean up the scratch working-memory session.
  #    priority 1, not 0 — the queue is a max-heap, so 0 is the lowest priority
  #    and starves under a fed queue. See the full note on the equivalent step
  #    in workflows/fill-knowledge-gap.yaml.
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'video-{{task_id}}'}) DETACH DELETE w"
      readonly: false
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Delete scratch session"
