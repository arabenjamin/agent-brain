# YouTube egress proxy. The host routes this container's network (yt-egress,
# 172.30.250.0/24) out of the LAN instead of the Tailscale exit node, because
# YouTube's bot check blocks the VPN exits (2026-10-17). The filter is what
# keeps the bypass to YouTube: any other host is refused.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 16
LogLevel Connect
# Only the brain, over yt-link.
Allow 172.30.251.0/24
ConnectPort 443
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/filter"
DisableViaHeader Yes
