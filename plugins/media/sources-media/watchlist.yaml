# MediaSource watchlist — user-curated channels (news, commentary, tech).
#
# Seeded ON CREATE only (graph-owned after first seed). To tweak later: edit via
# `manage_media_source` (persists) or delete a node to re-seed it from here.
# Autonomous polling is gated by MEDIA_WATCH_ENABLED and capped per source by
# MEDIA_WATCH_MAX_PER_SOURCE (the first-poll stampede guard).
#
# channel_id (ref) values resolved from the channel URLs via yt-dlp.
#
# source_type is the channel's tier (SOURCE_QUALITY_PLAN.md § 3a: primary >
# reporting > analysis > commentary), the owner's call of 2026-11-05. It sets
# how many claims each video yields; unset counts as commentary. Seeded on
# create only: change it with manage_media_source retype, which keeps history.
