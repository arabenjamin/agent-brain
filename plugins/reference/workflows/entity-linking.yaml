# Why: dev_docs get yaml/schedules-entity-linking-1
name: entity-linking
description: "Hourly: looks up to 20 entities named in claims on Wikidata, picks the item their claims describe (or none), and proposes it as the entity's reference link for the user to confirm. A 'no article' answer is checked again after 90 days."
kind: maintenance
# Shipped off, then turned on (2026-10-09) once the final prompt was measured
# on a fresh held-out set: 18 of 20 proposals right, 1 close, 1 wrong.
# Paused 2026-10-12 (owner): the monthly Ollama Cloud free quota is spent (the
# 10-10/11 refactor and testing weekend used 70% of it on top of 30% already
# used), and these two are its largest background callers (1,228 gpt-oss calls
# on 10-10). Off until the quota resets and background sharing is decided;
# while it is spent their runs only dead-letter. See the dev note on this pause.
# Back on 2026-10-21 (owner, MAP_PLAN §5.3) on ministral-14b (the free Mistral
# key, 30 requests/min): linking is what grows the set of entities with a point
# on the map. The pinned model decides the provider; `enabled` is graph-owned.
enabled: false
# topic: none — spans topics on purpose
every: 1h
steps:
  - tool_name: link_entities
    arguments:
      limit: 20
    model: ministral-14b-latest
    priority: 3
    max_attempts: 1
    description: "Propose reference links for 20 entities"
