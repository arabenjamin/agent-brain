; llama-server router for a card with 24 GB or more: every model whole on the GPU.
; NOT MEASURED: the box this was written on has 8 GB. Sizes are the files' own (E4B
; 5.0 GB, bge-m3 1.2 GB, Nimble 9.5 GB, Guardian 6.9 GB), about 23 GB with contexts.
; On that 8 GB card 26 of Nimble's layers took a decision from 2.3 s to 0.76 s.

[gemma4-e4b]
model = /models/gguf/gemma4-e4b.gguf
n-gpu-layers = 99
ctx-size = 32768
parallel = 2
flash-attn = on
jinja = true
reasoning = off
no-mmproj = true
load-on-startup = true

[bge-m3]
model = /models/gguf/bge-m3.gguf
embedding = true
n-gpu-layers = 99
ctx-size = 4608
batch-size = 4608
ubatch-size = 4608
parallel = 1
load-on-startup = true

[nimble]
model = /models/gguf/nimble.gguf
n-gpu-layers = 99
ctx-size = 8194
parallel = 1
jinja = true
reasoning = off
load-on-startup = true

[guardian]
model = /models/gguf/guardian.gguf
n-gpu-layers = 99
ctx-size = 8192
parallel = 1
load-on-startup = true
