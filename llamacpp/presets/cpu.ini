; llama-server router with no GPU. Slow, but every feature works; the brain gives a
; local call 600 s. Measured on the GPU box with the GPU hidden: a decision takes
; 17.5 s and a grounding check 21.8 s on 8 threads, and more threads help
; (LOCAL_ENGINE_PLAN.md Phase 2). File names are the manifest's.

[gemma4-e4b]
model = /models/gguf/gemma4-e4b.gguf
; One slot, so a request still gets the 16384 tokens the 8 GB preset gives it.
ctx-size = 16384
parallel = 1
jinja = true
reasoning = off
no-mmproj = true
load-on-startup = true

[bge-m3]
model = /models/gguf/bge-m3.gguf
embedding = true
ctx-size = 4608
batch-size = 4608
ubatch-size = 4608
parallel = 1
load-on-startup = true

[nimble]
model = /models/gguf/nimble.gguf
ctx-size = 8194
parallel = 1
jinja = true
reasoning = off

[guardian]
model = /models/gguf/guardian.gguf
ctx-size = 8192
parallel = 1
