; llama-server router: one engine, one port, the models the brain runs locally.
; A request's `model` field picks the section. The file names live in the
; llamacpp_cache volume (LOCAL_ENGINE_PLAN.md Phase 1).

[gemma4-e4b]
model = /models/models--unsloth--gemma-4-E4B-it-GGUF/snapshots/bfc15c382204943c3a8fff0c750b94ae2364d7a3/gemma-4-E4B-it-Q4_K_M.gguf
n-gpu-layers = 99
; Divided by parallel: 32768 / 2 = 16384 tokens a request.
ctx-size = 32768
parallel = 2
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning = off
no-mmproj = true
load-on-startup = true

[bge-m3]
model = /models/gguf/bge-m3.gguf
embedding = true
n-gpu-layers = 99
; The brain caps a text at 4000 chars (MAX_EMBED_CHARS), about 4003 tokens at worst
; measured. 4608 takes 930 MiB of VRAM; 8192 took 1142.
ctx-size = 4608
batch-size = 4608
ubatch-size = 4608
parallel = 1
load-on-startup = true
