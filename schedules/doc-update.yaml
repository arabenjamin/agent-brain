name: "Doc update: review recent git changes and sync project-docs"
description: "Writes a dated, commit-grounded changelog digest into the '## Recent Changes (auto)' section of project-docs/STATUS.md. Fully deterministic: get_git_log format=digest renders the markdown directly from commit history and section mode confines the write to that one section. (Redesigned 2026-06-12 — no LLM in the loop after the local model proved unable to produce grounded doc content.)"
interval_seconds: 43200
steps:
  # Step flow and {{_prev}} chain:
  #   1. get_git_log format=digest → dated markdown changelog from the last 15 commits
  #   2. write_codebase_doc        → replaces '## Recent Changes (auto)' section in STATUS.md

  - tool_name: get_git_log
    arguments:
      n: 15
      format: digest
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: write_codebase_doc
    arguments:
      path: "project-docs/STATUS.md"
      section: "## Recent Changes (auto)"
      content: "{{_prev}}"
    priority: 1
    max_attempts: 2
    provider_hint: ollama
