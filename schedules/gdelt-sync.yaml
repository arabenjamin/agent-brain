# GDELT 2.0 events ETL — one extract → transform → load pass every 15 minutes.
#
# GDELT publishes an export file every 15 minutes; dataset_sync loads every
# file published since the last one recorded (max_files_per_run per pass, so a
# backlog — or the 7-day first backfill — clears over successive passes), then
# prunes past 90 days. Config: datasets/gdelt.yaml. No LLM is involved.
#
# The `name` is the Neo4j MERGE key — do not change it without deleting the old
# (:ScheduledTask) node.
name: "GDELT sync: load new 15-minute event files"
description: "ETL pass for GDELT 2.0 events into the datasets DuckDB: downloads each export file published since the last load, loads it, prunes past retention, and logs the run to etl_runs."
topic: geopolitics
kind: dataset
interval_seconds: 900
# Retired as a source 2026-10-06 (user decision). A week of loaded data was
# ~98% outlets on none of our lists, much of it tabloid or regional, and the
# coding is noisy: counts measure coverage, not events. The ETL code stays
# (tested, dormant); set true to resume. gdelt_events is in no agent allowlist.
enabled: false
steps:
  - tool_name: dataset_sync
    arguments:
      dataset: gdelt
    priority: 1
    max_attempts: 2
    provider_hint: ollama
