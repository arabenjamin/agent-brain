name: "Brain health monitor: review scheduler state, queue metrics, and failure patterns"
description: "Periodic brain health check — reviews scheduler state, queue depth, and failure trends."
interval_seconds: 43200
steps:
  - tool_name: neo4j_query
    arguments:
      # created_at is stored as an RFC3339 string — convert before comparing, or the
      # string >= datetime comparison is null and the query always returns 0 rows.
      cypher: "MATCH (j:AgentJob) WHERE j.created_at >= datetime() - duration('P1D') RETURN j.status, count(j) AS cnt ORDER BY cnt DESC"
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: dead_letter
    arguments:
      action: list
      limit: 20
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: list_tasks
    arguments:
      status: failed
      limit: 10
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # The reason step stores the analysis as an inference note; no separate
  # boilerplate outcome note is needed (it only added graph noise).
  # context carries the live data so the RAG path is bypassed — without it,
  # reason retrieves previous health notes and critiques them instead of
  # analysing the fresh metrics.
  - tool_name: reason
    arguments:
      question: "The CONTEXT contains recent failed tasks from the previous chain step. Summarise the current health of the brain based ONLY on the CONTEXT. Note any failure patterns, queue backlogs, or regressions."
      context: "{{_prev}}"
      store_inference: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama
