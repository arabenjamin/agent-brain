# Intelligence agency claims monitor — daily.
#
# Replaces the runtime-authored GDELT version (disabled 2026-09-26): it called
# https://api.gdeltproject.org/api/v2/events/events, which does not exist, so 14
# of 15 runs since 09-08 reasoned over a 404 page and were recorded "completed".
# See project-docs/BRAIN_ASSESSMENT_FIXES_PLAN.md, step 5.
#
# Sources, both already free and keyed:
#   - ApiTube (`apitube` ApiContext, 100 req/day; 3 calls/run). `title=` is the
#     only topical filter that works, and it is AND-ed: `title=CIA OR Mossad`
#     returned only titles naming BOTH (verified 2026-09-26), so each keyword is
#     its own call. `sort.by=published_at` returns newest first; ApiTube defaults
#     the window to the last 31 days. ~17 KB per article, so per_page stays at 2.
#   - SearXNG via search_web, restricted to the `news` SourceList.
#
# Every search passes `prior_knowledge: false`. The graph-first block would quote
# our own earlier notes, and the report would restate them as today's news. The
# prior report is supplied separately, labelled as such, for the delta.
#
# The first run (2026-09-26) reached back to 2016 because an empty prior report
# was read as "everything is new", and a spy-museum travel piece matched
# `espionage`. Gates 2 and 4 of the report prompt exist for those two cases.
#
# This is public news, so the report runs as data_class: public.
name: "intelligence-agency-claims-monitor"
description: "Daily sweep of news about intelligence agencies (CIA, NSA, FBI, Mossad, GRU/FSB/SVR, MI6, MSS) making or facing claims, via ApiTube + SearXNG news. Dated delta against the prior report, stored as a source_record with claims extracted."
interval_seconds: 86400
data_class: public
steps:
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (n:Note) WHERE n.source_context = 'intelligence_agency_watch' AND NOT (n)-[:PART_OF]->() RETURN n.content AS content ORDER BY n.created_at DESC LIMIT 1"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Fetch prior report for delta analysis"

  - tool_name: push_context
    arguments:
      session_id: "intel-{{task_id}}"
      content: "## PRIOR REPORT (may be empty on first run)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank prior report"

  # ── ApiTube: dated, structured articles (results[]: title, href, published_at, source.domain) ──
  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.apitube.io/v1/news/everything?title=CIA&language.code=en&sort.by=published_at&per_page=2"
      context_name: apitube
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "ApiTube: CIA headlines"

  - tool_name: push_context
    arguments:
      session_id: "intel-{{task_id}}"
      content: "## APITUBE — title contains CIA (JSON results[]: title, href, published_at, source.domain)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank CIA articles"

  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.apitube.io/v1/news/everything?title=Mossad&language.code=en&sort.by=published_at&per_page=2"
      context_name: apitube
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "ApiTube: Mossad headlines"

  - tool_name: push_context
    arguments:
      session_id: "intel-{{task_id}}"
      content: "## APITUBE — title contains Mossad (JSON results[]: title, href, published_at, source.domain)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank Mossad articles"

  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.apitube.io/v1/news/everything?title=espionage&language.code=en&sort.by=published_at&per_page=2"
      context_name: apitube
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "ApiTube: espionage headlines"

  - tool_name: push_context
    arguments:
      session_id: "intel-{{task_id}}"
      content: "## APITUBE — title contains espionage (JSON results[]: title, href, published_at, source.domain)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank espionage articles"

  # ── SearXNG news sweeps (approved domains only) ──
  - tool_name: search_web
    arguments:
      query: "CIA NSA FBI intelligence agency claims allegations report"
      recency: week
      count: 8
      source_list: news
      prior_knowledge: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: US agencies"

  - tool_name: push_context
    arguments:
      session_id: "intel-{{task_id}}"
      content: "## SWEEP — US AGENCIES (search results: title, link, snippet)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank US sweep"

  - tool_name: search_web
    arguments:
      query: "Russian intelligence GRU FSB SVR operation accused"
      recency: week
      count: 8
      # national-security, not news (2026-10-06): adds the cyber/intel
      # specialists (The Record, CyberScoop) where Russian-service operations
      # are reported; the other two sweeps stay on the general news list.
      source_list: national-security
      prior_knowledge: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: Russian services"

  - tool_name: push_context
    arguments:
      session_id: "intel-{{task_id}}"
      content: "## SWEEP — RUSSIAN SERVICES (search results: title, link, snippet)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank Russia sweep"

  - tool_name: search_web
    arguments:
      query: "Mossad MI6 Chinese Ministry of State Security spy agency claims"
      recency: week
      count: 8
      source_list: news
      prior_knowledge: false
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: Israeli, British and Chinese services"

  - tool_name: push_context
    arguments:
      session_id: "intel-{{task_id}}"
      content: "## SWEEP — ISRAELI / BRITISH / CHINESE SERVICES (search results: title, link, snippet)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank other-services sweep"

  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'intel-{{task_id}}'}) RETURN w.content AS content ORDER BY w.turn_index"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Reassemble prior report + sources"

  - tool_name: reason
    arguments:
      question: |
        The CONTEXT holds a PRIOR REPORT, then three ApiTube article lists and
        three news-search sweeps about intelligence agencies. Today is {{date}}.

        Write a daily watch report with exactly these sections:

        ## NEW SINCE THE PRIOR REPORT
        One line per item: `<date> — <agency> — <who claims what> — <outlet> — <URL>`.
        Gates, applied in order:
        1. DATE OR DROP. An item needs a publication date from the CONTEXT
           (ApiTube `published_at`, or a date in the search result). No date,
           it goes under UNDATED, never here.
        2. LAST 7 DAYS. Only items dated within 7 days before {{date}}. This
           holds on the first run too: an empty PRIOR REPORT does not make a
           2016 article new. News searches return evergreen coverage; older
           items go nowhere.
        3. NEWER THAN THE PRIOR REPORT. Only items dated after the prior
           report's date; anything at or before it is already known.
        4. AN AGENCY MUST BE AN ACTOR OR TARGET. The item reports something an
           intelligence agency did, claimed, or is accused of. A museum, film,
           book review, travel piece or retrospective is not an item.
        5. ATTRIBUTE, DON'T ASSERT. Write "X claims / alleges / reports that
           Y", naming who makes the claim. Never restate an allegation as
           fact. Say when an agency denies it or when the only source is the
           claimant's own outlet or a partisan one.
        If nothing passes, write "Nothing new since the prior report." That is
        a valid, useful result; do not pad it with older items.

        ## PATTERNS
        Two or three sentences at most: a recurring agency, target or
        accusation across several independent outlets. Name the outlets. If
        there is no pattern, write "None."

        ## UNDATED
        Items worth re-checking whose date could not be established.

        Ground every line in the CONTEXT and cite its URL. If the sources came
        back empty or off-topic, say so plainly rather than answering from
        general knowledge.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    # Paid synthesis: `deep_reasoning` is held only by claude-sonnet-5. When the
    # spend cap or ROUTING_PAID_FOR refuses it, the step runs on this
    # provider_hint (gpt-oss) instead — see the note in models.yaml.
    provider_hint: ollama-cloud
    required_capabilities: ["deep_reasoning"]
    description: "Dated delta report with attributed claims"

  - tool_name: push_context
    arguments:
      session_id: "intel-{{task_id}}"
      content: "## REPORT\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank the finished report"

  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'intel-{{task_id}}'}) WHERE w.content STARTS WITH '## REPORT' RETURN w.content AS content ORDER BY w.turn_index DESC LIMIT 1"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Re-read the report alone"

  - tool_name: store_note
    arguments:
      content: "# Intelligence agency watch — {{date}}\n\n{{_prev}}"
      note_type: source_record
      source_context: intelligence_agency_watch
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Store the watch report"

  - tool_name: claim
    arguments:
      action: extract
      text: "{{_prev}}"
      source_note_id: "{{_prev.id}}"
      source_context: intelligence_agency_watch
      asserted_by: "Intelligence agency watch (news sources as cited)"
      limit: 8
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Extract claims as checkable, attributed propositions"

  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'intel-{{task_id}}'}) DETACH DELETE w"
      readonly: false
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Delete scratch session"
