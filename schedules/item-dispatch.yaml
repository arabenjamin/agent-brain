# Why: dev_docs get yaml/schedules-item-dispatch-1
name: "Item dispatch: run the user's items assigned to an agent when they are due"
description: "Hourly: offers every due item assigned to an agent a run (read-only agents start, the rest wait for approval in the Feed), and hands failed runs back for a retry or for review."
kind: maintenance
# topic: none — spans topics on purpose
interval_seconds: 3600
steps:
  - tool_name: dispatch_due_todos
    arguments: {}
    provider_hint: ollama
    priority: 1
    max_attempts: 1
    description: "Start or ask about every due agent item"
