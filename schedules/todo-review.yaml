name: "Daily todo review: check outstanding tasks, reflect on blockers, and store a prioritised action summary"
description: "Reviews pending and in-progress Tasks daily, reasons about blockers and next steps, and stores a prioritised action note in the knowledge graph."
interval_seconds: 86400
steps:
  # Step flow and {{_prev}} chain:
  #   1. list_tasks   → pending/in_progress tasks as JSON
  #   2. reason       → prioritised review with blockers + recommended next steps
  #   3. store_note   → persists the review as an episodic note for spaced repetition
  - tool_name: list_tasks
    arguments:
      status: created
      limit: 20
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: reason
    arguments:
      question: |
        Today is {{date}}. Here is the current list of pending and in-progress tasks:

        {{_prev}}

        Write a concise daily task review (under 300 words) that:
        1. Summarises the overall workload — how many tasks, any clear blockers or dependencies.
        2. Identifies the 2–3 highest-priority tasks and briefly explains why they should come first.
        3. Flags any tasks that appear stalled or whose goal is ambiguous, and suggests a concrete next action for each.
        4. Notes any tasks that look complete based on their description but are still marked open.

        Be direct and analytical — this is an internal brain review, not a message to the user.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    provider_hint: ollama

  - tool_name: store_note
    arguments:
      content: "Daily task review {{date}}:\n\n{{_prev}}"
      note_type: episodic
      source_context: scheduled_todo_review
    priority: 1
    max_attempts: 2
    provider_hint: ollama
