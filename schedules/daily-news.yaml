# Daily news briefing — expanded coverage (metro Detroit, Michigan, national,
# world, tech, business, markets, weather).
#
# Pattern note: {{_prev}} only carries the IMMEDIATELY PRECEDING step's output,
# so each search_web step is followed by a push_context step that banks the
# results into the date-scoped working-memory session "news-raw-{{date}}".
# A neo4j_query step then collects every section at once and hands the full
# bundle to the reason step. The final step deletes the raw session entries.
#
# The `name` is the Neo4j MERGE key — do not change it without deleting the
# old (:ScheduledTask) node, or the old chain keeps running alongside this one.
name: "Daily news aggregation and briefing: aggregate headlines from world, tech, and business, then write and store a daily briefing"
description: "Aggregates metro Detroit, Michigan, national, world, tech, and business headlines plus a stock-market recap and Detroit weather, then writes and stores a structured daily briefing."
interval_seconds: 86400
steps:
  # ── Collect: search each topic, bank results in working memory ──────────
  - tool_name: search_web
    arguments:
      query: "metro Detroit news headlines"
      count: 6
      source_list: michigan-news
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## METRO DETROIT — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "Michigan state news headlines"
      count: 6
      source_list: michigan-news
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## MICHIGAN — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "top US national news headlines"
      count: 8
      source_list: news
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## NATIONAL — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "top world news headlines"
      count: 8
      source_list: news
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## WORLD — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "AI technology science news"
      count: 6
      source_list: news
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## TECHNOLOGY & AI — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "business economy politics news"
      count: 6
      source_list: news
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## BUSINESS & POLITICS — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "stock market today S&P 500 Dow Jones Nasdaq close summary"
      count: 5
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## MARKETS — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "Detroit Michigan weather forecast today"
      count: 4
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## WEATHER — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Assemble: pull every banked section out of working memory ───────────
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'news-raw-{{date}}'}) RETURN w.content AS content ORDER BY w.turn_index"
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  # ── Write the briefing from the assembled sections ──────────────────────
  - tool_name: reason
    arguments:
      question: |
        Write a structured daily news brief for {{date}} with the following sections:
        ## EXECUTIVE SUMMARY for {{date}}
        ## METRO DETROIT
        ## MICHIGAN
        ## NATIONAL
        ## WORLD NEWS
        ## TECHNOLOGY & AI
        ## BUSINESS & POLITICS
        ## MARKETS
        ## WEATHER
        ## STORY TO WATCH

        2-3 bullets per section, drawn only from the raw search results in the
        context (the context contains one "## <SECTION> — raw search results"
        block per topic). Cite sources with the URLs from that source not just the site. Flag notable spin or framing
        with ⚠️. For MARKETS, lead with index levels/direction if present. For
        WEATHER, give today's Detroit forecast in one or two bullets.
        If a section has no usable results, write "No results collected today."
        Do not output JSON or any code fences. Write in plain prose with Markdown headings only.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    # Write the brief on a cloud model; searches/cleanup stay local below.
    #
    # `provider_hint: ollama-cloud` alone only means "not the weak local
    # model" — it selects nothing, it just falls through to the active config
    # (OLLAMA_MODEL). That was gemma4:31b-cloud, which is the one free-tier
    # model measured to return EMPTY COMPLETIONS (~25% on a tool-calling
    # prompt; 1/4 in the catalog's own trial table). The chat loops retry an
    # empty completion, but a background job has no such guard — SharedLlm
    # sees a successful call returning "", and this step's output is what
    # store_note persists and notify_user delivers. An empty brief would read
    # as a quiet news day.
    #
    # `required_capabilities` makes the choice explicit instead of inherited,
    # so this step routes with the other seven cloud `reason` steps to the
    # selection_rank winner rather than to whatever OLLAMA_MODEL happens to be.
    required_capabilities: ["reasoning"]
    provider_hint: ollama-cloud

  - tool_name: store_note
    arguments:
      content: "{{_prev}}"
      note_type: news
      source_context: scheduled_daily_news_brief
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # Extract checkable assertions from the brief before it is presented. News is
  # the highest-volume external source the brain ingests, and a daily brief that
  # reads as settled fact is exactly how framing becomes belief.
  # `{{_prev.id}}` reaches into store_note's result envelope for the note id, so
  # each claim gets an ASSERTED_IN edge back to the brief it came from. The
  # claim tool echoes its input as `answer`, so the brief still flows unchanged
  # to notify_user and push_context below.
  - tool_name: claim
    arguments:
      action: extract
      text: "{{_prev}}"
      source_note_id: "{{_prev.id}}"
      source_context: daily_news
      limit: 6
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: notify_user
    arguments:
      message: "{{_prev}}"
      context: "Daily News Brief {{date}}"
      related_session_id: "news-{{date}}"
    priority: 2
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-{{date}}"
      content: "{{_prev}}"
      role: assistant
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Clean up the raw working-memory session ──────────────────────────────
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'news-raw-{{date}}'}) DETACH DELETE w"
      readonly: false
    # priority 1, not 0 — the queue is a max-heap, so 0 is the lowest priority
    # and starves under a fed queue. See chains/fill-knowledge-gap.yaml.
    priority: 1
    max_attempts: 2
    provider_hint: ollama
