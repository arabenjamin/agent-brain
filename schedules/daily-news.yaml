# Why: dev_docs get yaml/schedules-daily-news-1
name: "Daily news aggregation and briefing: aggregate headlines from world, tech, and business, then write and store a daily briefing"
description: "Aggregates metro Detroit, Michigan, national, world, tech, and business headlines plus a stock-market recap and Detroit weather, then writes and stores a structured daily briefing."
# topic: none — spans topics on purpose
kind: brief
interval_seconds: 86400
steps:
  # Why: dev_docs get yaml/schedules-daily-news-2
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'news-raw-{{date}}'}) DETACH DELETE w"
      readonly: false
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # Why: dev_docs get yaml/schedules-daily-news-3
  - tool_name: search_web
    arguments:
      query: "latest Detroit metro news -sports"
      count: 6
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## METRO DETROIT — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest Michigan government politics news -sports"
      count: 6
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## MICHIGAN — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest US national news headlines"
      count: 8
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## NATIONAL — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest world news headlines"
      count: 8
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## WORLD — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest artificial intelligence technology news"
      count: 6
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## TECHNOLOGY & AI — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest US economy business news"
      count: 6
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## BUSINESS & POLITICS — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest stock market close S&P 500 Dow Nasdaq"
      count: 5
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## MARKETS — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # Why: dev_docs get yaml/schedules-daily-news-4
  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.weather.gov/gridpoints/DTX/66,34/forecast"
      headers:
        User-Agent: "agent-brain (ara.benjamin@gmail.com)"
        Accept: "application/geo+json"
    priority: 1
    max_attempts: 3
    optional: true   # enrichment: a failed fetch must not cancel the brief (2026-09-30)
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## WEATHER — NWS api.weather.gov forecast for Detroit, MI (authoritative, not a web search)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # Why: dev_docs get yaml/schedules-daily-news-5
  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.apitube.io/v1/news/everything?title=Michigan&language.code=en&per_page=2"
      context_name: apitube
    priority: 1
    max_attempts: 3
    optional: true   # enrichment: a failed fetch must not cancel the brief (2026-09-30)
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## MICHIGAN — ApiTube articles (structured, dated JSON results[]: title, href, published_at, source.domain, description). Prefer these for exact dates and citations in the MICHIGAN / METRO DETROIT sections.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.apitube.io/v1/news/everything?title=artificial%20intelligence&language.code=en&per_page=2"
      context_name: apitube
    priority: 1
    max_attempts: 3
    optional: true   # enrichment: a failed fetch must not cancel the brief (2026-09-30)
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## TECHNOLOGY & AI — ApiTube articles (structured, dated JSON results[]: title, href, published_at, source.domain, description). Prefer these for exact dates and citations in the TECHNOLOGY & AI section.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # Why: dev_docs get yaml/schedules-daily-news-6
  - tool_name: recall_recent
    arguments:
      window: "1d"
      sample_limit: 20
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## BRAIN ACTIVITY (last 24h) — recall_recent JSON: total_notes, by_note_type, by_source_context, and a sample[]. This is what the brain actually did and learned: video_learning = videos it watched, fill_knowledge_gap = gaps it researched, claim/source_record = things it logged, news = briefs. Summarise the shape (counts) and call out anything genuinely new.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── System status: open work, recent job health, active schedules ─────────
  - tool_name: neo4j_query
    arguments:
      cypher: >-
        MATCH (t:Task) WHERE t.updated_at >= datetime() - duration('P1D')
          AND t.status IN ['completed', 'failed']
        WITH t.status AS k, count(*) AS c
        RETURN 'tasks_finished_24h: ' + k + ' = ' + toString(c) AS line
        UNION ALL
        MATCH (t:Task) WHERE t.status IN ['created', 'in_progress', 'blocked']
        WITH t.status AS k, count(*) AS c
        RETURN 'tasks_open_now: ' + k + ' = ' + toString(c) AS line
        UNION ALL
        MATCH (j:AgentJob) WHERE j.created_at >= datetime() - duration('P1D')
        WITH j.status AS k, count(*) AS c
        RETURN 'jobs_24h_by_status: ' + k + ' = ' + toString(c) AS line
        UNION ALL
        MATCH (s:ScheduledTask) WITH s.enabled AS k, count(*) AS c
        RETURN 'scheduled_tasks_enabled=' + toString(k) + ': ' + toString(c) AS line
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## SYSTEM STATUS — live counts from the graph: tasks completed/failed in the LAST 24h, tasks open right now, AgentJob statuses over the last 24h, and enabled/disabled ScheduledTask totals. There are no all-time totals here; never describe a count as anything but the window its label names. Report open/failed work plainly; a non-zero failed/dead count is worth flagging.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Your items: what waits on the user (HBI plan Phase 13) ──────────────
  # Replaces the daily Todo Review chat: overdue and soon-due items, and agent
  # results or runs waiting for the user, as one block in the brief. Dates are
  # compared as dates (a DATETIME against a string is null in Cypher).
  - tool_name: neo4j_query
    arguments:
      cypher: >-
        MATCH (t:Todo) WHERE t.status <> 'done'
          AND (t.assignee IS NULL OR t.assignee = 'user' OR t.status IN ['awaiting_approval', 'awaiting_review'])
          AND (t.snoozed_until IS NULL OR t.snoozed_until <= datetime())
        WITH t, CASE
          WHEN t.status = 'awaiting_review' THEN 'result to review'
          WHEN t.status = 'awaiting_approval' THEN 'agent run to approve'
          WHEN t.due_at IS NOT NULL AND date(t.due_at) < date('{{date}}') THEN 'overdue'
          WHEN t.due_at IS NOT NULL AND date(t.due_at) <= date('{{date}}') + duration('P3D') THEN 'due soon'
          ELSE null END AS why
        WHERE why IS NOT NULL
        RETURN why + ': ' + t.title + coalesce(' (due ' + toString(date(t.due_at)) + ')', '') AS line
        ORDER BY CASE why WHEN 'overdue' THEN 0 WHEN 'result to review' THEN 1 WHEN 'agent run to approve' THEN 2 ELSE 3 END
        LIMIT 15
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## YOUR ITEMS — the user's open items that want them now: overdue, due within 3 days, an agent result to review, or an agent run to approve (at most 15). An empty list means nothing is waiting.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Assemble: pull every banked section out of working memory ───────────
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'news-raw-{{date}}'}) RETURN w.content AS content ORDER BY w.turn_index"
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  # ── Write the briefing from the assembled sections ──────────────────────
  - tool_name: reason
    arguments:
      question: |
        Write a structured DAILY BRIEF for {{date}}. This is not only a news
        digest — it covers BOTH the brain's own day (what it did, learned, and
        its current state) AND the outside world. Use these sections in order:

        ## EXECUTIVE SUMMARY for {{date}}
        ## WHAT I DID & LEARNED (last 24h)
        ## SYSTEM STATUS
        ## YOUR ITEMS
        ## METRO DETROIT
        ## MICHIGAN
        ## NATIONAL
        ## WORLD NEWS
        ## TECHNOLOGY & AI
        ## BUSINESS & POLITICS
        ## MARKETS
        ## WEATHER
        ## STORY TO WATCH

        Draw ONLY from the blocks in the context; do not invent. Cite source URLs
        (the actual article URL, not just the site). Flag notable spin/framing ⚠️.

        SPORTS FILTER — hard rule: EXCLUDE sports and athletics entirely (game
        scores, results, previews, recruiting, coaching/athletic-department hires
        and departures, player transfers). This holds for EVERY section. The ONLY
        exception is a sports item that genuinely intersects politics, government,
        or public policy — e.g. public/stadium funding or a tax vote, legislation
        or a court ruling (Title IX, NIL law), a labor/antitrust action, or an
        athlete/team's political act with policy consequences. When a section's
        usable results are all sports, drop them and say "No non-sports results
        usable for today." Do not fill a section with sports to avoid an empty one.

        Avoid duplication: the EXECUTIVE SUMMARY should synthesise across the day,
        not restate the section bullets verbatim — a headline appears in its
        section OR the summary, not both word-for-word.

        SELF SECTIONS (lead with these — they are the point of a *daily* brief):
        - EXECUTIVE SUMMARY: 3-5 bullets spanning BOTH the brain's own day AND the
          day's news — what the brain did/learned first, then the headlines.
        - WHAT I DID & LEARNED: read the "## BRAIN ACTIVITY (last 24h)" block
          (recall_recent JSON). Summarise the shape from the counts — how many
          videos it watched (source_context video_learning), gaps it researched
          (fill_knowledge_gap), claims/source_records it logged, briefs (news) —
          and name anything genuinely new from the sample[]. If total_notes is
          genuinely low, say it was a quiet night; do not inflate.
        - SYSTEM STATUS: read the "## SYSTEM STATUS" block. Report open vs
          completed/failed tasks, AgentJob health over the last 24h, and how many
          schedules are enabled. Flag any failed/dead jobs explicitly.
        - YOUR ITEMS: read the "## YOUR ITEMS" block. One bullet per line, overdue
          first, in its words; end with "They are in the Feed (Work → Feed)." If the
          block lists nothing, write "Nothing is waiting on you." Do not invent items.

        NEWS SECTIONS: each has a "## <SECTION> — raw search results" block and/or
        a "## <SECTION> — ApiTube articles" block; prefer the ApiTube articles for
        exact publication dates and source names. 2-3 bullets each. For MARKETS,
        lead with index levels/direction if present. For WEATHER, the context
        holds a National Weather Service JSON response, not search results: read
        `properties.periods` and report the FIRST TWO periods (today and tonight)
        as one bullet each, giving `name`, `temperature` + `temperatureUnit`,
        `shortForecast`, `windSpeed`/`windDirection`, and
        `probabilityOfPrecipitation.value` when non-null. Cite
        https://api.weather.gov. Ignore the remaining periods.

        If a news section's results are missing or unusable (off topic, or dated
        well before {{date}}), do not silently write it off as a quiet day — say
        which: "No results collected today." when empty, or "Search returned N
        results but none were usable for {{date}} — <one-line reason>." when not.
        A reader must be able to tell a slow news day from a broken search. (This
        applies to the news sections; the self sections above always have data.)
        Do not output JSON or any code fences. Write in plain prose with Markdown headings only.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    # Why: dev_docs get yaml/schedules-daily-news-7
    provider_hint: ollama-cloud

  - tool_name: store_note
    arguments:
      content: "{{_prev}}"
      note_type: news
      source_context: scheduled_daily_news_brief
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # Why: dev_docs get yaml/schedules-daily-news-8
  - tool_name: claim
    arguments:
      action: extract
      text: "{{_prev}}"
      source_note_id: "{{_prev.id}}"
      source_context: daily_news
      limit: 6
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: notify_user
    arguments:
      message: "{{_prev}}"
      context: "Daily Brief {{date}}"
      related_session_id: "news-{{date}}"
    priority: 2
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-{{date}}"
      content: "{{_prev}}"
      role: assistant
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Clean up the raw working-memory session ──────────────────────────────
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'news-raw-{{date}}'}) DETACH DELETE w"
      readonly: false
    # priority 1, not 0 — the queue is a max-heap, so 0 is the lowest priority
    # and starves under a fed queue. See chains/fill-knowledge-gap.yaml.
    priority: 1
    max_attempts: 2
    provider_hint: ollama
