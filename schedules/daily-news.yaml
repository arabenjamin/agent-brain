# Daily news briefing — expanded coverage (metro Detroit, Michigan, national,
# world, tech, business, markets, weather).
#
# Engine note (2026-10-02): the seven news searches request `engine: exa` with
# `recency: day` and `news: true` — see the note above the first search step.
# The history below is why google_news was used until then; it ranked by
# relevance and returned stale stories once the queries said "today".
#
# Earlier engine note: the seven news searches requested `engine: google_news`, which
# routes to SerpApi's Google News engine. `engine` only PROMOTES that engine to
# the head of the failover ladder — SearXNG and the rest remain as fallbacks —
# so once SerpApi's shared monthly quota is spent, the brief degrades to SearXNG
# automatically instead of failing (see skills/search.rs). General/background
# data mining does NOT set `engine`, so it keeps leading with the unmetered
# self-hosted SearXNG.
#
# Outage + recovery (resolved 2026-09-08): from 2026-09-05 SerpApi's Google News
# engine returned `503 "We couldn't get valid results … Please try again later."`
# after a 90s timeout (4 of 7 news searches failed on 2026-09-05), which dropped
# every failed section through to SearXNG's news-incapable engine set and made
# the brief read "no news." As a stopgap the steps were switched to plain
# `engine: serpapi` (Google organic). That stopgap under-delivered: organic
# results are undated evergreen pages, so on 2026-09-08 the reason step could not
# date-verify them and the brief came back near-empty (weather + one 3-month-old
# story). google_news was re-tested live on 2026-09-08 and answers again with
# dated, source-named stories, so the steps are reverted to it here — that is the
# correct engine for a dated daily brief. If it 503s again, the ladder still
# falls through, but the right stopgap is to fix the query freshness, not to drop
# to organic. `source_list` is intentionally omitted: news queries already return
# usable metro/Michigan results without a site: restriction, and the
# site-restricted SearXNG queries were what produced the junk-results problem.
#
# Pattern note: {{_prev}} only carries the IMMEDIATELY PRECEDING step's output,
# so each search_web step is followed by a push_context step that banks the
# results into the date-scoped working-memory session "news-raw-{{date}}".
# A neo4j_query step then collects every section at once and hands the full
# bundle to the reason step. The final step deletes the raw session entries.
#
# The `name` is the Neo4j MERGE key — do not change it without deleting the
# old (:ScheduledTask) node, or the old chain keeps running alongside this one.
name: "Daily news aggregation and briefing: aggregate headlines from world, tech, and business, then write and store a daily briefing"
description: "Aggregates metro Detroit, Michigan, national, world, tech, and business headlines plus a stock-market recap and Detroit weather, then writes and stores a structured daily briefing."
interval_seconds: 86400
steps:
  # ── Clear any leftover raw session FIRST (self-healing) ──────────────────
  # The cleanup step at the END only runs if the whole chain succeeds. If a
  # later step dies (e.g. the writer hits a provider error), its banked blocks
  # survive in news-raw-{{date}}, and the NEXT run's gather pulls the
  # accumulation — which compounds until the writer's context overflows
  # (observed 2026-09-08: four failed runs stacked to ~306K tokens and every
  # subsequent run 400'd on context length). Deleting at the start makes each
  # run idempotent regardless of how the previous one ended.
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'news-raw-{{date}}'}) DETACH DELETE w"
      readonly: false
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Collect: search each topic, bank results in working memory ──────────
  # 2026-10-02: Exa news + recency:day, not google_news. Google News ranks by
  # relevance, so "… today" returned months-old pages (0 of 8 current for the
  # world query); Exa with a one-day window returned CNBC, Al Jazeera, France24
  # and Politico from that day. ~210 Exa searches/month of the $10 credit. The
  # ladder still falls back to SearXNG and Tavily with the same recency/news
  # filters. Queries say "latest", never a date: a literal date over-constrains.
  # "-sports": the user does not want sports in the brief.
  - tool_name: search_web
    arguments:
      query: "latest Detroit metro news -sports"
      count: 6
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## METRO DETROIT — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest Michigan government politics news -sports"
      count: 6
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## MICHIGAN — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest US national news headlines"
      count: 8
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## NATIONAL — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest world news headlines"
      count: 8
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## WORLD — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest artificial intelligence technology news"
      count: 6
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## TECHNOLOGY & AI — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest US economy business news"
      count: 6
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## BUSINESS & POLITICS — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: search_web
    arguments:
      query: "latest stock market close S&P 500 Dow Nasdaq"
      count: 5
      engine: exa
      recency: day
      news: true
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## MARKETS — raw search results\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Weather: an API, not a web search ───────────────────────────────────
  # This was `search_web "Detroit Michigan weather forecast today"` until
  # 2026-09-01, and it never once produced a forecast. A forecast is
  # structured, perishable data; a search returns *links to pages that render
  # it*, and a result snippet almost never contains the numbers. With the
  # mainstream SearXNG engines CAPTCHA-blocked (see searxng/settings.yml) the
  # four results on 09-01 were: the Detroit-Windsor tunnel Wikipedia article,
  # a Michigan weather blog last updated January 2023, a Detroit nostalgia
  # site, and a Czech forecast page. The model then correctly wrote "No results
  # collected today" — the brief was honest, the input was junk.
  #
  # Because that is 4 results and not 0, `search_web`'s ladder counted rung one
  # as having answered and never fell through to a keyed engine. Zero-result
  # fall-through cannot catch this; only using the right source can.
  #
  # api.weather.gov (US NWS) is free, needs no key, and has no quota. The
  # gridpoint URL is stable for a fixed location and was derived once from
  # https://api.weather.gov/points/42.3314,-83.0458 (Detroit, MI) ->
  # .properties.forecast. Re-derive it that way if the location changes.
  # NWS requires a descriptive User-Agent and 403s without one.
  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.weather.gov/gridpoints/DTX/66,34/forecast"
      headers:
        User-Agent: "agent-brain (ara.benjamin@gmail.com)"
        Accept: "application/geo+json"
    priority: 1
    max_attempts: 3
    optional: true   # enrichment: a failed fetch must not cancel the brief (2026-09-30)
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## WEATHER — NWS api.weather.gov forecast for Detroit, MI (authoritative, not a web search)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── ApiTube: TOPICAL structured, dated articles (supplements google_news) ──
  # Additive, not a replacement: if ApiTube is unreachable, these blocks are
  # simply absent and the google_news sections above still carry the brief. Auth
  # (X-API-Key) is injected from the seeded `apitube` ApiContext, so no key
  # appears here. Free tier is 100 req/day; these are 2 calls/run.
  #
  # Verified live 2026-09-08: `title=<keyword>` is the only reliable topical
  # filter — `category` and `source.country.code` returned unrelated/global
  # results, so they are NOT used. `title=Michigan` and `title=artificial
  # intelligence` both return today-dated, on-topic articles with source + date.
  # Response: results[] with title, href, published_at, source.domain, description.
  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.apitube.io/v1/news/everything?title=Michigan&language.code=en&per_page=2"
      context_name: apitube
    priority: 1
    max_attempts: 3
    optional: true   # enrichment: a failed fetch must not cancel the brief (2026-09-30)
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## MICHIGAN — ApiTube articles (structured, dated JSON results[]: title, href, published_at, source.domain, description). Prefer these for exact dates and citations in the MICHIGAN / METRO DETROIT sections.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: http_request
    arguments:
      method: GET
      url: "https://api.apitube.io/v1/news/everything?title=artificial%20intelligence&language.code=en&per_page=2"
      context_name: apitube
    priority: 1
    max_attempts: 3
    optional: true   # enrichment: a failed fetch must not cancel the brief (2026-09-30)
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## TECHNOLOGY & AI — ApiTube articles (structured, dated JSON results[]: title, href, published_at, source.domain, description). Prefer these for exact dates and citations in the TECHNOLOGY & AI section.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── The brain's OWN day: what it watched / researched / learned (24h) ──────
  # recall_recent is the deterministic time-window count (by note_type +
  # source_context, plus a sample) — this is the "what has the system been doing
  # all night / did it learn anything new" section. Local-day-aware; window=1d
  # covers overnight.
  - tool_name: recall_recent
    arguments:
      window: "1d"
      sample_limit: 20
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## BRAIN ACTIVITY (last 24h) — recall_recent JSON: total_notes, by_note_type, by_source_context, and a sample[]. This is what the brain actually did and learned: video_learning = videos it watched, fill_knowledge_gap = gaps it researched, claim/source_record = things it logged, news = briefs. Summarise the shape (counts) and call out anything genuinely new.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── System status: open work, recent job health, active schedules ─────────
  - tool_name: neo4j_query
    arguments:
      cypher: >-
        MATCH (t:Task) WHERE t.updated_at >= datetime() - duration('P1D')
          AND t.status IN ['completed', 'failed']
        WITH t.status AS k, count(*) AS c
        RETURN 'tasks_finished_24h: ' + k + ' = ' + toString(c) AS line
        UNION ALL
        MATCH (t:Task) WHERE t.status IN ['created', 'in_progress', 'blocked']
        WITH t.status AS k, count(*) AS c
        RETURN 'tasks_open_now: ' + k + ' = ' + toString(c) AS line
        UNION ALL
        MATCH (j:AgentJob) WHERE j.created_at >= datetime() - duration('P1D')
        WITH j.status AS k, count(*) AS c
        RETURN 'jobs_24h_by_status: ' + k + ' = ' + toString(c) AS line
        UNION ALL
        MATCH (s:ScheduledTask) WITH s.enabled AS k, count(*) AS c
        RETURN 'scheduled_tasks_enabled=' + toString(k) + ': ' + toString(c) AS line
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-raw-{{date}}"
      content: "## SYSTEM STATUS — live counts from the graph: tasks completed/failed in the LAST 24h, tasks open right now, AgentJob statuses over the last 24h, and enabled/disabled ScheduledTask totals. There are no all-time totals here; never describe a count as anything but the window its label names. Report open/failed work plainly; a non-zero failed/dead count is worth flagging.\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Assemble: pull every banked section out of working memory ───────────
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'news-raw-{{date}}'}) RETURN w.content AS content ORDER BY w.turn_index"
    priority: 1
    max_attempts: 3
    provider_hint: ollama

  # ── Write the briefing from the assembled sections ──────────────────────
  - tool_name: reason
    arguments:
      question: |
        Write a structured DAILY BRIEF for {{date}}. This is not only a news
        digest — it covers BOTH the brain's own day (what it did, learned, and
        its current state) AND the outside world. Use these sections in order:

        ## EXECUTIVE SUMMARY for {{date}}
        ## WHAT I DID & LEARNED (last 24h)
        ## SYSTEM STATUS
        ## METRO DETROIT
        ## MICHIGAN
        ## NATIONAL
        ## WORLD NEWS
        ## TECHNOLOGY & AI
        ## BUSINESS & POLITICS
        ## MARKETS
        ## WEATHER
        ## STORY TO WATCH

        Draw ONLY from the blocks in the context; do not invent. Cite source URLs
        (the actual article URL, not just the site). Flag notable spin/framing ⚠️.

        SPORTS FILTER — hard rule: EXCLUDE sports and athletics entirely (game
        scores, results, previews, recruiting, coaching/athletic-department hires
        and departures, player transfers). This holds for EVERY section. The ONLY
        exception is a sports item that genuinely intersects politics, government,
        or public policy — e.g. public/stadium funding or a tax vote, legislation
        or a court ruling (Title IX, NIL law), a labor/antitrust action, or an
        athlete/team's political act with policy consequences. When a section's
        usable results are all sports, drop them and say "No non-sports results
        usable for today." Do not fill a section with sports to avoid an empty one.

        Avoid duplication: the EXECUTIVE SUMMARY should synthesise across the day,
        not restate the section bullets verbatim — a headline appears in its
        section OR the summary, not both word-for-word.

        SELF SECTIONS (lead with these — they are the point of a *daily* brief):
        - EXECUTIVE SUMMARY: 3-5 bullets spanning BOTH the brain's own day AND the
          day's news — what the brain did/learned first, then the headlines.
        - WHAT I DID & LEARNED: read the "## BRAIN ACTIVITY (last 24h)" block
          (recall_recent JSON). Summarise the shape from the counts — how many
          videos it watched (source_context video_learning), gaps it researched
          (fill_knowledge_gap), claims/source_records it logged, briefs (news) —
          and name anything genuinely new from the sample[]. If total_notes is
          genuinely low, say it was a quiet night; do not inflate.
        - SYSTEM STATUS: read the "## SYSTEM STATUS" block. Report open vs
          completed/failed tasks, AgentJob health over the last 24h, and how many
          schedules are enabled. Flag any failed/dead jobs explicitly.

        NEWS SECTIONS: each has a "## <SECTION> — raw search results" block and/or
        a "## <SECTION> — ApiTube articles" block; prefer the ApiTube articles for
        exact publication dates and source names. 2-3 bullets each. For MARKETS,
        lead with index levels/direction if present. For WEATHER, the context
        holds a National Weather Service JSON response, not search results: read
        `properties.periods` and report the FIRST TWO periods (today and tonight)
        as one bullet each, giving `name`, `temperature` + `temperatureUnit`,
        `shortForecast`, `windSpeed`/`windDirection`, and
        `probabilityOfPrecipitation.value` when non-null. Cite
        https://api.weather.gov. Ignore the remaining periods.

        If a news section's results are missing or unusable (off topic, or dated
        well before {{date}}), do not silently write it off as a quiet day — say
        which: "No results collected today." when empty, or "Search returned N
        results but none were usable for {{date}} — <one-line reason>." when not.
        A reader must be able to tell a slow news day from a broken search. (This
        applies to the news sections; the self sections above always have data.)
        Do not output JSON or any code fences. Write in plain prose with Markdown headings only.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    # Write the brief on the active cloud model (OLLAMA_MODEL), which is now
    # `gpt-oss:120b-cloud` — it follows the "plain Markdown, no JSON, no code
    # fences" instruction and does not empty-complete on this prompt.
    #
    # DELIBERATELY NOT `required_capabilities: ["reasoning"]`. That routes to the
    # selection_rank winner for `reasoning`, which at CLOUD_TIER 2 is
    # `gemini-2.5-flash` (rank 5) — and on 2026-09-08 it wrapped the whole brief
    # in a ```json {"answer": "..."} fence despite the instruction, so the
    # envelope never unwrapped and store_note/notify_user persisted a JSON blob
    # instead of the Markdown brief. Plain `provider_hint: ollama-cloud` lands on
    # gpt-oss directly and renders clean Markdown. (The earlier worry that
    # ollama-cloud fell through to empty-completing `gemma4:31b-cloud` is stale:
    # OLLAMA_MODEL is gpt-oss now. If OLLAMA_MODEL ever changes back to a weak
    # model, pin this step explicitly rather than re-adding the reasoning route.)
    provider_hint: ollama-cloud

  - tool_name: store_note
    arguments:
      content: "{{_prev}}"
      note_type: news
      source_context: scheduled_daily_news_brief
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # Extract checkable assertions from the brief before it is presented. News is
  # the highest-volume external source the brain ingests, and a daily brief that
  # reads as settled fact is exactly how framing becomes belief.
  # `{{_prev.id}}` reaches into store_note's result envelope for the note id, so
  # each claim gets an ASSERTED_IN edge back to the brief it came from. The
  # claim tool echoes its input as `answer`, so the brief still flows unchanged
  # to notify_user and push_context below.
  - tool_name: claim
    arguments:
      action: extract
      text: "{{_prev}}"
      source_note_id: "{{_prev.id}}"
      source_context: daily_news
      limit: 6
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  - tool_name: notify_user
    arguments:
      message: "{{_prev}}"
      context: "Daily Brief {{date}}"
      related_session_id: "news-{{date}}"
    priority: 2
    max_attempts: 2
    provider_hint: ollama

  - tool_name: push_context
    arguments:
      session_id: "news-{{date}}"
      content: "{{_prev}}"
      role: assistant
    priority: 1
    max_attempts: 2
    provider_hint: ollama

  # ── Clean up the raw working-memory session ──────────────────────────────
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'news-raw-{{date}}'}) DETACH DELETE w"
      readonly: false
    # priority 1, not 0 — the queue is a max-heap, so 0 is the lowest priority
    # and starves under a fed queue. See chains/fill-knowledge-gap.yaml.
    priority: 1
    max_attempts: 2
    provider_hint: ollama
