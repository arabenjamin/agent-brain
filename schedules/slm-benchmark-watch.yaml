# schedules/slm-benchmark-watch.yaml
#
# The "Soft layer" of the Critical Tech Dependency Mapping project: track small
# language models (roughly 1B-7B) that reach frontier-equivalent capability on a
# task class, and keep a current "Tier 2" recommendation list.
#
# This one has teeth for agent-brain specifically: the models it surfaces are
# candidates for OLLAMA_LOCAL_MODEL and for the models.yaml catalog, so the final
# section is written as an actionable recommendation rather than a news summary.
#
# Same banking idiom as hardware-tripwire.yaml — {{_prev}} carries only the
# previous step, so sweeps are banked in "slmwatch-{{task_id}}" and reassembled.
name: "Bi-weekly SLM benchmark watch: track frontier-equivalent small models in the 1B-7B range"
description: "Bi-weekly sweep of new small-model releases and benchmark results, compared against the previous run, ending in an updated Tier 2 recommendation list for local deployment."
interval_seconds: 1209600

steps:
  # 1. Prior run (or the original hand-written BASELINE note on the first run).
  #    `NOT (n)-[:PART_OF]->()` excludes store_note's semantic chunks, which
  #    inherit source_context and would otherwise return a partial section.
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (n:Note) WHERE (n.source_context = 'slm_benchmark_watch' OR n.content STARTS WITH 'BASELINE: State of SLMs') AND NOT (n)-[:PART_OF]->() RETURN n.content AS content ORDER BY n.created_at DESC LIMIT 2"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Fetch prior Tier 2 list for delta analysis"

  - tool_name: push_context
    arguments:
      session_id: "slmwatch-{{task_id}}"
      content: "## PRIOR TIER 2 LIST (may be empty on first run)\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank prior list"

  # 2-4. Release sweep, benchmark sweep, quantization/serving sweep.
  - tool_name: search_web
    arguments:
      query: "new small language model release 1B 3B 7B parameters Qwen Phi Gemma DeepSeek Mistral weights open"
      count: 10
      source_list: ml-research
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: new releases"

  - tool_name: push_context
    arguments:
      session_id: "slmwatch-{{task_id}}"
      content: "## SWEEP — NEW RELEASES\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank releases sweep"

  - tool_name: search_web
    arguments:
      query: "small language model benchmark results MMLU GPQA coding math arXiv evaluation 7B frontier parity"
      count: 10
      source_list: ml-research
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: benchmark results"

  - tool_name: push_context
    arguments:
      session_id: "slmwatch-{{task_id}}"
      content: "## SWEEP — BENCHMARKS\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank benchmark sweep"

  - tool_name: search_web
    arguments:
      query: "quantization GGUF local inference VRAM requirements small model Ollama llama.cpp throughput"
      count: 10
      source_list: ml-research
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Sweep: local deployability"

  - tool_name: push_context
    arguments:
      session_id: "slmwatch-{{task_id}}"
      content: "## SWEEP — LOCAL DEPLOYABILITY\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank deployability sweep"

  # 5. Reassemble everything for the reason step.
  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'slmwatch-{{task_id}}'}) RETURN w.content AS content ORDER BY w.turn_index"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Reassemble prior list + sweeps"

  # 6. Material goes in `context`, not `question` (RAG contamination guard).
  - tool_name: reason
    arguments:
      question: |
        The CONTEXT contains a PRIOR TIER 2 MODEL LIST followed by three fresh
        sweeps: new small-model releases, benchmark results, and local
        deployability notes.

        Write a benchmark watch report with exactly these sections:

        ## MOVERS
        Models that NEWLY qualify as frontier-equivalent on a specific task
        class. Name the model, the parameter count, the task class, the
        benchmark evidence, and — required — the model's RELEASE DATE.

        Apply these gates before listing anything here. They exist because a
        prior run promoted a model released in September 2023 as a new mover,
        quoting its original launch comparison as if it were current:

        1. NEWER THAN THE PRIOR REPORT. This section is a DELTA. A model
           belongs here only if its date is AFTER the date of the PRIOR LIST
           in the CONTEXT. Anything at or before that date was already on the
           list — it is not a mover, however strong its numbers. If that
           leaves MOVERS empty, say so plainly; an empty MOVERS is a valid
           result and is far better than re-promoting last cycle's entries.
        2. RECENCY. Today is {{date}}. A model whose release or publication
           date is more than 12 months before today is NOT a mover, however
           good its numbers. It has already been absorbed by the field.
        3. DATE OR DEMOTE. If you cannot establish a release date from the
           CONTEXT, it does not go here — put it under WATCH and say the date
           is unknown. Never infer a date from the fact that a source
           mentioned it recently; reposts of old releases are common.
        4. COMPARISONS AGE. A claim like "beats the top open-source model by
           N%" is relative to the date it was written. Report it as
           "+N% vs. the SOTA of <date>", never as a current standing.
        5. EVIDENCE. A model with no benchmark evidence in the CONTEXT belongs
           under WATCH, not here.

        ## DELTA vs PRIOR LIST
        What changed since the prior list: additions, removals, and demotions,
        each with a reason. If the CONTEXT contains no prior list, say so and
        treat this run as the initial list.

        ## UPDATED TIER 2 LIST
        The current recommendation, one line per model:
        `<model> — <params> — <best task class> — <VRAM/quant note>`
        Only include models that can plausibly run on a single consumer GPU.

        ## RELEVANCE TO THIS BRAIN
        Whether any listed model is a better candidate than the current
        OLLAMA_LOCAL_MODEL for background jobs, and why. Say "no change
        warranted" if that is the honest answer.

        ## WATCH
        Promising but unproven models to re-check next cycle.

        Ground every claim in the CONTEXT and cite source URLs where present.
        If the sweeps returned nothing usable, say so rather than answering from
        general knowledge or repeating the prior list as if it were fresh.
      context: "{{_prev}}"
      store_inference: false
    priority: 2
    max_attempts: 3
    provider_hint: ollama-cloud
    required_capabilities: ["reasoning"]
    description: "Delta analysis + updated Tier 2 list"

  # 7. Bank the report, then re-query it alone. store_note returns a JSON blob
  #    ({"id":…,"answer":…}), so a step chained directly off it receives that
  #    wrapper rather than the report. Banking and re-reading keeps both the
  #    stored note and the claim extractor on clean report text.
  - tool_name: push_context
    arguments:
      session_id: "slmwatch-{{task_id}}"
      content: "## REPORT\n{{_prev}}"
      role: observation
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Bank the finished report"

  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'slmwatch-{{task_id}}'}) WHERE w.content STARTS WITH '## REPORT' RETURN w.content AS content ORDER BY w.turn_index DESC LIMIT 1"
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Re-read the report alone"

  # 8. Persist under the retrieval key used by the next run and the monthly audit.
  #
  #    note_type is `source_record`, not `semantic`. Nothing in this report is
  #    knowledge the brain established — every figure in it is a benchmark
  #    number some external page asserted, unverified. Typed `semantic` it came
  #    back out of retrieval unlabelled and was relayed in chat as settled fact
  #    ("ToRA-7B has emerged as a powerhouse"). As `source_record`, label_claims
  #    prefixes it on retrieval with an explicit not-verified marker.
  - tool_name: store_note
    arguments:
      content: "# SLM benchmark watch — {{date}}\n\n{{_prev}}"
      note_type: source_record
      source_context: slm_benchmark_watch
    priority: 1
    max_attempts: 3
    provider_hint: ollama
    description: "Store the benchmark watch report"

  # 9. Break the report into individually checkable claims. A benchmark score is
  #    exactly the shape the claims layer exists for: attributable, dated, and
  #    corroborable against an independent domain. Without this the whole report
  #    is one undifferentiated blob that retrieval can only accept or reject.
  #
  #    Chained directly off store_note: `{{_prev}}` is the stored report and
  #    `{{_prev.id}}` is that note's id, so every claim carries an ASSERTED_IN
  #    edge back to the run that produced it.
  - tool_name: claim
    arguments:
      action: extract
      text: "{{_prev}}"
      source_note_id: "{{_prev.id}}"
      source_context: slm_benchmark_watch
      asserted_by: "SLM benchmark watch"
      limit: 8
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Extract benchmark claims as checkable, attributed propositions"

  - tool_name: neo4j_query
    arguments:
      cypher: "MATCH (w:WorkingMemory {session_id: 'slmwatch-{{task_id}}'}) DETACH DELETE w"
      readonly: false
    # priority 1, not 0 — the queue is a max-heap, so 0 is the lowest priority
    # and starves under a fed queue. See chains/fill-knowledge-gap.yaml.
    priority: 1
    max_attempts: 2
    provider_hint: ollama
    description: "Delete scratch session"
