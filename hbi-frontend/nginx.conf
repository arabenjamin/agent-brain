# A template: the nginx image fills in BRAIN_API_KEY from the environment at
# start (NGINX_ENVSUBST_FILTER=^BRAIN_ in docker-compose.yml), so nginx's own
# $variables pass through untouched.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Self-hosted map tiles (MAP_PLAN): PMTiles archives read by HTTP range
    # requests, plus the basemap's fonts and sprites; fetched into ./maps by
    # scripts/fetch_map_tiles.sh and mounted read-only. Missing ⇒ 404, which
    # the HBI shows as "no map tiles on this server".
    location /maps/ {
        alias /usr/share/nginx/maps/;
        add_header Accept-Ranges bytes;
        # Fonts and sprites never change under a name: a day is fine.
        add_header Cache-Control "public, max-age=86400";
        types {
            application/json json;
            application/x-protobuf pbf;
            application/octet-stream pmtiles;
            image/png png;
        }
    }

    # The manifest and the archives change when the tiles are re-fetched
    # under the same names: always revalidate (a 304 on the LAN). A day's
    # cache kept a browser on the old manifest (world + Michigan) after the
    # US was fetched, so the US never appeared (2026-10-21), and a stale
    # range of a replaced archive would mix two builds.
    location ~ ^/maps/(manifest\.json|[^/]+\.pmtiles)$ {
        root /usr/share/nginx;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
        types {
            application/json json;
            application/x-protobuf pbf;
            application/octet-stream pmtiles;
            image/png png;
        }
    }

    # Proxy MCP Streamable HTTP + SSE to the brain backend
    location /mcp {
        proxy_pass http://agent-brain:3000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The owner's key and mark, added here so the browser never holds the
        # key; they replace whatever the browser sent.
        proxy_set_header Authorization "Bearer ${BRAIN_API_KEY}";
        proxy_set_header x-brain-initiator owner;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required for SSE streams
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Proxy /chat SSE endpoint
    location /chat {
        proxy_pass http://agent-brain:3000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The owner's key and mark, added here so the browser never holds the
        # key; they replace whatever the browser sent.
        proxy_set_header Authorization "Bearer ${BRAIN_API_KEY}";
        proxy_set_header x-brain-initiator owner;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Proxy /todos REST API
    location /todos {
        proxy_pass http://agent-brain:3000/todos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The owner's key and mark, added here so the browser never holds the
        # key; they replace whatever the browser sent.
        proxy_set_header Authorization "Bearer ${BRAIN_API_KEY}";
        proxy_set_header x-brain-initiator owner;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /workflows REST API (was /scheduled-tasks until workflows replaced
    # schedules in CORE_AND_PLUGINS_PLAN Phase 2b; the HBI's Home "Next up"
    # card got the index page until this block followed it).
    location /workflows {
        proxy_pass http://agent-brain:3000/workflows;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The owner's key and mark, added here so the browser never holds the
        # key; they replace whatever the browser sent.
        proxy_set_header Authorization "Bearer ${BRAIN_API_KEY}";
        proxy_set_header x-brain-initiator owner;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /api/* REST endpoints (graph, health, scheduler, models, etc.)
    location /api {
        proxy_pass http://agent-brain:3000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The owner's key and mark, added here so the browser never holds the
        # key; they replace whatever the browser sent.
        proxy_set_header Authorization "Bearer ${BRAIN_API_KEY}";
        proxy_set_header x-brain-initiator owner;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The OpenAI-compatible front door for Conduit and other OpenAI-wire
    # clients, which reach the brain here since 3001 is loopback only. Unlike
    # the routes above, the client's own key passes through: a phone app
    # keeps holding MCP_API_KEY instead of borrowing the HBI's.
    location /v1 {
        proxy_pass http://agent-brain:3000/v1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
