[workspace]
members = ["crates/app", "crates/host", "crates/api", "crates/skills", "crates/retrieve", "crates/scheduler", "crates/chat", "crates/work", "crates/knowledge", "crates/graph", "crates/llm", "crates/models", "crates/repository", "crates/protocol", "crates/plugin-api", "plugins/*/crate"]
resolver = "2"
exclude = ["vendor/neo4rs"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Neo4j graph database
neo4rs = { version = "0.8", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JSON Schema validation (deterministic write-boundary gate)
jsonschema = { version = "0.26", default-features = false }

# Date/time and UUIDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Async traits
async-trait = "0.1"

# YAML parsing (model catalog)
serde_yaml = "0.9"

# Local Analytics & Logging (The Hippocampus)
# json compiled in: telemetry locks external access, so it cannot be fetched.
# (icu cannot be: its feature needs DuckDB sources the crate does not ship; it
# is loaded from disk at init instead, telemetry.rs.)
duckdb = { version = "1.0", features = ["bundled", "json"] }

# neo4rs 0.8.0 decodes a negative tiny int (-1..-16) as 255..240: a thumbs-down
# (-1) read back as 255. One-line fix, the same as upstream 0.9's.
# Second patch (2026-10-16, ours): `Query::read_only()` sends RUN with access
# mode "r", so Neo4j itself refuses a write in a query that must only read
# (neo4j_query, views, declared tools, profile pre-loads). Upstream has no
# auto-commit read mode; carry it forward before dropping vendor/neo4rs.
# Third patch (2026-10-21, ours): a point's field names deserialize as strings
# when asked (`types/serde/cenum.rs`), so a row holding a point converts to
# serde_json::Value; before, query tools nulled the whole row (MAP_PLAN).
[patch.crates-io]
neo4rs = { path = "vendor/neo4rs" }
