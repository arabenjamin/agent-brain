# Demonyms: nationality and people words resolved to their place (HBI plan
# Phase 20, §12.3; services/entity_resolution.rs). "Chinese hackers" mentions
# China, with "chinese" kept as the mention's surface form.
#
# Generated 2026-10-10 from Wikidata's English demonyms (P1549) of current
# sovereign states and U.S. states, then reviewed by hand. Plurals were
# added for -an and -i words. Dropped:
# - a demonym equal to its place's name (Taiwan, New Zealand);
# - a word two places share, as ambiguous: congolese, dominican, dominicans, georgian, georgians.
# - by hand, words that usually mean something else: finn (also a name); dane (also a name); vatican (mostly the Holy See, an institution); washingtonian (the state or D.C.); persian (the language, the Gulf, cats); tejano (an ethnic group and a music); mongol (a people, not Mongolia's nationals); hawaii resident (not a word); new hampshireman (awkward form); new hampshirewoman (awkward form).
# `place` is the entity name the graph uses, where an entity is linked to
# the place's Wikidata item, else the item's English label.
#
# Not every use is a nationality ("Chinese" is also a language). A pair the
# user answers "different" or "related" in the merge review stops the word
# resolving; remove it here too.

